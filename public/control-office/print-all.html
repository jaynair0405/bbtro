<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Sheets — Print | Control Office</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0b3d91;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --bg: #f1f5f9;
            --surface: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* Top toolbar — visible on screen, hidden in print */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .toolbar a, .toolbar .label { color: var(--text-light); text-decoration: none; font-size: .85rem; }
        .toolbar a:hover { color: var(--brand); }
        .toolbar input[type="date"] {
            padding: 5px 8px;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            font-size: .85rem;
        }
        .toolbar button {
            background: var(--brand);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar button:hover { filter: brightness(.92); }
        .toolbar .status { margin-left: auto; font-size: .82rem; color: var(--text-light); }

        .sheet-block {
            background: white;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .sheet-header {
            background: var(--brand);
            color: white;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sheet-meta { font-size: .8rem; opacity: .85; font-weight: normal; }
        table.sheet {
            width: 100%;
            border-collapse: collapse;
            font-size: .68rem;
            line-height: 1.15;
        }
        table.sheet thead th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
            padding: 3px 6px;
            border-bottom: 2px solid #475569;
            text-transform: uppercase;
            letter-spacing: .3px;
            font-size: .64rem;
            text-align: left;
        }
        table.sheet tbody td {
            padding: 1px 6px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        .sec-header td {
            font-weight: 800;
            font-size: .72rem;
            padding: 2px 8px !important;
            border-left: 3px solid #94a3b8;
        }
        .sec-header.sec-NE    td { background:#dbeafe; color:#1e3a8a; border-left-color:#2563eb; }
        .sec-header.sec-SE    td { background:#dcfce7; color:#14532d; border-left-color:#16a34a; }
        .sec-header.sec-KR    td { background:#fed7aa; color:#7c2d12; border-left-color:#ea580c; }
        .sec-header.sec-other td { background:#e5e7eb; color:#334155; }
        .sec-header.sec-bypass td { background:#f3e8ff; color:#581c87; border-left-color:#a855f7; }

        .loading-msg, .error-msg {
            padding: 24px;
            text-align: center;
            color: var(--text-light);
        }
        .error-msg { color: #dc2626; }

        /* ── PRINT ── */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white !important; padding: 0 !important; }
            .toolbar { display: none !important; }
            .sheet-block {
                margin-bottom: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                /* each sheet on its own page by default */
                page-break-after: always;
            }
            .sheet-block:last-child { page-break-after: auto; }
            /* Grouped mode: only break between terminal pairs, not within */
            body.grouped .sheet-block { page-break-after: auto; }
            body.grouped .sheet-block.terminal-end { page-break-after: always; }
            body.grouped .sheet-block.terminal-end:last-child { page-break-after: auto; }
            .sheet-header {
                background: white !important;
                color: black !important;
                border-bottom: 2px solid #333;
                padding: 4px 0 !important;
                font-size: .95rem !important;
            }
            .sheet-meta { color: #555 !important; font-size: .72rem !important; }
            table.sheet tr { page-break-inside: avoid; }
            @page { size: A4 portrait; margin: 6mm 8mm; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <a href="/control-office/"><i class="fa-solid fa-arrow-left"></i> Back</a>
    <span class="label">Date:</span>
    <input id="dateInput" type="date">
    <label style="display:inline-flex;align-items:center;gap:5px;font-size:.85rem;color:var(--text-light)">
        <input type="checkbox" id="groupByTerminal" style="margin:0"> Group UP+DN per terminal (one page each)
    </label>
    <button onclick="loadAll()"><i class="fa-solid fa-rotate-right"></i> Reload</button>
    <button onclick="window.print()"><i class="fa-solid fa-print"></i> Print / Save PDF</button>
    <span class="status" id="loadStatus">Loading…</span>
</div>

<div id="sheets"></div>

<script>
const $ = sel => document.querySelector(sel);
const SHEETS = [
    { source: 'CSMT-UP', label: 'CSMT-UP' },
    { source: 'CSMT-DN', label: 'CSMT-DN' },
    { source: 'LTT-UP',  label: 'LTT-UP'  },
    { source: 'LTT-DN',  label: 'LTT-DN'  },
    { source: 'KR-UP',   label: 'KR-UP'   },
    { source: 'KR-DN',   label: 'KR-DN'   },
    { source: 'PNVL-UP', label: 'PNVL-UP' },
    { source: 'PNVL-DN', label: 'PNVL-DN' },
    { source: null,      label: 'BYPASS Trains', direction: 'BYPASS' },
];

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtTime(t) {
    if (!t) return '';
    return String(t).split(/\s+/).map(tok => {
        const m = tok.match(/^(\d{1,2}):(\d{2})$/);
        return m ? `${String(parseInt(m[1], 10)).padStart(2, '0')}:${m[2]}` : tok;
    }).join(' ');
}
function parseMin(t) {
    if (!t) return 99999;
    const m = String(t).trim().match(/^(\d{1,2}):(\d{2})/);
    if (!m) return 99999;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}
function sectionColourClass(section) {
    if (section === 'NE') return 'sec-NE';
    if (section === 'SE') return 'sec-SE';
    if (section === 'KR') return 'sec-KR';
    return 'sec-other';
}

// Build URL for /today endpoint
function urlFor(sheet, date) {
    const qs = new URLSearchParams({ date });
    if (sheet.source) qs.set('sheet_source', sheet.source);
    else if (sheet.direction) qs.set('direction', sheet.direction);
    return `/api/division/loco-link/today?${qs}`;
}

function renderSheetBlock(sheet, data, date) {
    const block = document.createElement('div');
    block.className = 'sheet-block';

    const dateDisplay = (function() {
        const [y, m, d] = date.split('-');
        return `${d}-${m}-${y}`;
    })();

    block.innerHTML = `
        <div class="sheet-header">
            <span>${esc(sheet.label)}</span>
            <span class="sheet-meta">${dateDisplay} · ${data.total || 0} trains · ${data.filled || 0} entered</span>
        </div>
        <table class="sheet">
            <thead>
                <tr>
                    <th style="width:50px">Time</th>
                    <th style="width:80px">Train</th>
                    <th>Link</th>
                    <th style="width:90px">Loco</th>
                    <th style="width:80px">${sheet.source && sheet.source.endsWith('-UP') ? 'Outgoing' : 'Incoming'}</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    `;

    const tbody = block.querySelector('tbody');
    if (!data.rows || !data.rows.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding:8px;text-align:center;color:#888">No trains scheduled for this date.</td></tr>`;
        return block;
    }

    // Decide grouping (mirrors daily-entry logic)
    const isBypass = sheet.direction === 'BYPASS';
    if (isBypass) {
        // Group by route_label
        const groups = new Map();
        for (const row of data.rows) {
            const k = row.route_label || '(no route)';
            if (!groups.has(k)) groups.set(k, []);
            groups.get(k).push(row);
        }
        for (const [route, rows] of groups) {
            tbody.insertAdjacentHTML('beforeend', `<tr class="sec-header sec-bypass"><td colspan="5">${esc(route)}</td></tr>`);
            rows.sort((a, b) => parseMin(a.event_time) - parseMin(b.event_time));
            for (const row of rows) tbody.appendChild(renderRow(row, sheet));
            for (const sp of (data.specials || []).filter(s => (s.section || '') === route)) {
                tbody.appendChild(renderSpecialRow(sp, sheet));
            }
        }
    } else {
        // Group by section + secondary station
        const isKrUp = sheet.source === 'KR-UP';
        const secondaryFor = (r) => isKrUp ? (r.to_station || '') : (r.from_station || '');
        const groups = new Map();
        let order = 0;
        for (const row of data.rows) {
            const key = `${row.section || ''}|${secondaryFor(row)}`;
            if (!groups.has(key)) groups.set(key, { section: row.section || '', secondary: secondaryFor(row), rows: [], order: order++ });
            groups.get(key).rows.push(row);
        }
        // Tag inline specials so we can pick the right renderer below
        for (const sp of (data.specials || [])) {
            const key = `${sp.section || ''}|`;
            if (!groups.has(key)) groups.set(key, { section: sp.section || '', secondary: '', rows: [], order: order++ });
            groups.get(key).rows.push(Object.assign({ _isSpecial: true }, sp));
        }

        // Section rank (NE → SE → KR → other → KR-UP destination order)
        const KR_ORDER = { CSMT: 0, LTT: 1, DIVA: 2, PUNE: 3 };
        const rank = (g) => {
            if (isKrUp && g.section === 'KR') {
                const r = KR_ORDER[g.secondary];
                return r !== undefined ? r : 50;
            }
            if (g.section === 'NE') return 0;
            if (g.section === 'SE') return 1;
            if (g.section === 'KR') return 2;
            return 4;
        };
        const sorted = Array.from(groups.values()).sort((a, b) => {
            const ra = rank(a), rb = rank(b);
            if (ra !== rb) return ra - rb;
            return a.order - b.order;
        });

        // Most common secondary for "ex X" sub-label
        const counts = {};
        for (const r of data.rows) {
            const sec = secondaryFor(r);
            counts[sec] = (counts[sec] || 0) + 1;
        }
        const mainSec = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || '';

        for (const g of sorted) {
            let label = g.section || 'OTHER';
            if (g.secondary && g.secondary !== mainSec) {
                label += ` · ${isKrUp ? '→' : 'ex'} ${g.secondary}`;
            } else if (isKrUp && g.secondary) {
                label += ` · → ${g.secondary}`;
            }
            tbody.insertAdjacentHTML('beforeend',
                `<tr class="sec-header ${sectionColourClass(g.section)}"><td colspan="5">${esc(label)}</td></tr>`);
            g.rows.sort((a, b) => parseMin(a.event_time) - parseMin(b.event_time));
            for (const row of g.rows) {
                tbody.appendChild(row._isSpecial ? renderSpecialRow(row, sheet) : renderRow(row, sheet));
            }
        }
    }
    return block;
}

function renderRow(r, sheet) {
    const tr = document.createElement('tr');
    const log = r.log || (r.actual_loco_no ? r : {});
    const inOut = sheet.source && sheet.source.endsWith('-UP') ? (log.outgoing_train || '') : (log.incoming_train || '');
    const linkText = [r.shed_code, r.link_attr, r.expected_hog ? 'HOG' : '', r.is_push_pull ? 'PP' : '']
        .filter(Boolean).join(' · ');
    tr.innerHTML = `
        <td>${esc(fmtTime(r.event_time))}</td>
        <td><strong>${esc(r.train_no)}</strong></td>
        <td>${esc(linkText || '—')}</td>
        <td>${esc(log.actual_loco_no || '')}</td>
        <td>${esc(inOut)}</td>
    `;
    return tr;
}
function renderSpecialRow(sp, sheet) {
    const tr = document.createElement('tr');
    const inOut = sheet.source && sheet.source.endsWith('-UP') ? (sp.outgoing_train || '') : (sp.incoming_train || '');
    tr.innerHTML = `
        <td>${esc(fmtTime(sp.event_time))}</td>
        <td><strong>${esc(sp.train_no)}</strong></td>
        <td>${esc(sp.section || '—')}</td>
        <td>${esc(sp.actual_loco_no || '')}</td>
        <td>${esc(inOut)}</td>
    `;
    return tr;
}

// Map sheet label to its terminal group key (so we know where pairs end)
function terminalGroupOf(label) {
    if (label.startsWith('CSMT-')) return 'CSMT';
    if (label.startsWith('LTT-'))  return 'LTT';
    if (label.startsWith('KR-'))   return 'KR';
    return 'BYPASS';
}

async function loadAll() {
    const date = $('#dateInput').value || todayISO();
    const grouped = $('#groupByTerminal').checked;
    document.body.classList.toggle('grouped', grouped);

    $('#loadStatus').textContent = 'Loading…';
    const container = $('#sheets');
    container.innerHTML = '<div class="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> Fetching all sheets…</div>';

    try {
        const responses = await Promise.all(SHEETS.map(async sh => {
            const r = await fetch(urlFor(sh, date));
            if (!r.ok) throw new Error(`${sh.label}: HTTP ${r.status}`);
            return { sheet: sh, data: await r.json() };
        }));
        container.innerHTML = '';
        for (let i = 0; i < responses.length; i++) {
            const { sheet, data } = responses[i];
            const block = renderSheetBlock(sheet, data, date);
            // Tag the last sheet of each terminal group so grouped-mode CSS
            // can break the page only between groups
            const curGroup = terminalGroupOf(sheet.label);
            const nextGroup = i + 1 < responses.length
                ? terminalGroupOf(responses[i + 1].sheet.label)
                : null;
            if (curGroup !== nextGroup) block.classList.add('terminal-end');
            container.appendChild(block);
        }
        $('#loadStatus').textContent = `Loaded ${SHEETS.length} sheets for ${date}${grouped ? ' · grouped by terminal' : ''}`;
    } catch (e) {
        container.innerHTML = `<div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> ${esc(e.message)}</div>`;
        $('#loadStatus').textContent = 'Failed';
    }
}

// Init: read date from URL or default to today
const params = new URLSearchParams(location.search);
const initialDate = params.get('date') && /^\d{4}-\d{2}-\d{2}$/.test(params.get('date'))
    ? params.get('date') : todayISO();
$('#dateInput').value = initialDate;
$('#dateInput').addEventListener('change', loadAll);
$('#groupByTerminal').addEventListener('change', loadAll);
loadAll();
</script>
<script src="/control-office/nav-home.js"></script>
</body>
</html>
