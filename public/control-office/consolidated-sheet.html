<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidated Sheet | Control Office</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0b3d91;
            --text-main: #1e293b;
            --text-light: #64748b;
            --muted: #94a3b8;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --danger: #dc2626;
            --success: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* Top toolbar — visible on screen, hidden in print */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .toolbar a, .toolbar .label { color: var(--text-light); text-decoration: none; font-size: .85rem; }
        .toolbar a:hover { color: var(--brand); }
        .toolbar h1 { font-size: 1.05rem; margin: 0; color: var(--brand); }
        .toolbar input[type="date"] {
            padding: 5px 8px;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            font-size: .85rem;
        }
        .toolbar button {
            background: var(--brand);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar button.ghost { background: #eef2ff; color: var(--brand); }
        .toolbar button:hover { filter: brightness(.92); }
        .toolbar .status { margin-left: auto; font-size: .82rem; color: var(--text-light); }

        /* Direction group divider (UP TRAINS / DN TRAINS / BYPASS) */
        .dir-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 2px 10px;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: .5px;
            color: var(--brand);
        }
        .dir-divider::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, var(--border-strong), transparent);
        }
        .dir-divider .pill {
            font-size: .72rem;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--brand);
        }
        .dir-divider.dir-BYPASS { color: #7c2d12; }
        .dir-divider.dir-BYPASS .pill { background: #f3e8ff; color: #581c87; }

        .sheet-block {
            background: white;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .sheet-header {
            background: var(--brand);
            color: white;
            padding: 6px 14px;
            font-weight: 700;
            font-size: .98rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sheet-meta { font-size: .8rem; opacity: .85; font-weight: normal; }
        table.sheet {
            width: 100%;
            border-collapse: collapse;
            font-size: .72rem;
            line-height: 1.2;
        }
        table.sheet thead th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
            padding: 4px 7px;
            border-bottom: 2px solid #475569;
            text-transform: uppercase;
            letter-spacing: .3px;
            font-size: .64rem;
            text-align: left;
        }
        table.sheet tbody td {
            padding: 2px 7px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        td.c-loco { font-family: 'Courier New', monospace; font-weight: 700; }
        td.c-loco .rear { display:block; font-size:.66rem; color: var(--text-light); font-weight:600; }
        tr.row-filled td.c-loco { color: #065f46; }
        tr.row-mislink { background: #fff1f2; }
        .flag {
            display:inline-block; font-size:.6rem; font-weight:800; padding:0 5px;
            border-radius:3px; margin-left:4px; vertical-align:middle;
        }
        .flag.mis { background:#fee2e2; color:#991b1b; }
        .flag.dead { background:#e5e7eb; color:#334155; }
        .flag.hog  { background:#dcfce7; color:#14532d; }
        .flag.pp   { background:#e0e7ff; color:#3730a3; }

        /* HOG / Non-HOG column */
        .hog-yes { display:inline-block; font-size:.66rem; font-weight:800; padding:1px 6px; border-radius:4px; background:#dcfce7; color:#14532d; }
        .hog-no  { display:inline-block; font-size:.66rem; font-weight:600; padding:1px 6px; border-radius:4px; background:#f1f5f9; color:#64748b; }
        .hog-na  { color: var(--muted); }

        /* Read-only schedule chip (mirrors the daily-sheet amber chip) */
        .sched-chip {
            display:inline-block; font-size:.66rem; font-weight:700;
            padding:1px 6px; border-radius:4px;
            background:#fef3c7; border:1px solid #f59e0b; color:#92400e;
            white-space:nowrap;
        }
        .sched-chip.overdue { background:#fee2e2; border-color:#ef4444; color:#991b1b; }
        .sched-chip.none { background:transparent; border:none; color: var(--muted); font-weight:400; }

        .sec-header td {
            font-weight: 800;
            font-size: .72rem;
            padding: 2px 8px !important;
            border-left: 3px solid #94a3b8;
        }
        .sec-header.sec-NE    td { background:#dbeafe; color:#1e3a8a; border-left-color:#2563eb; }
        .sec-header.sec-SE    td { background:#dcfce7; color:#14532d; border-left-color:#16a34a; }
        .sec-header.sec-KR    td { background:#fed7aa; color:#7c2d12; border-left-color:#ea580c; }
        .sec-header.sec-other td { background:#e5e7eb; color:#334155; }
        .sec-header.sec-bypass td { background:#f3e8ff; color:#581c87; border-left-color:#a855f7; }

        .loading-msg, .error-msg { padding: 24px; text-align: center; color: var(--text-light); }
        .error-msg { color: #dc2626; }
        .empty-row td { padding:8px; text-align:center; color:#888; }

        /* ── PRINT ── */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white !important; padding: 0 !important; }
            .toolbar { display: none !important; }
            .dir-divider { break-inside: avoid; }
            .sheet-header { background: white !important; color: black !important; border-bottom: 2px solid #333; position: static; }
            .sheet-meta { color: #555 !important; }
            table.sheet tr { page-break-inside: avoid; }
            @page { size: A4 portrait; margin: 7mm 8mm; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <a href="/control-office/"><i class="fa-solid fa-arrow-left"></i> Back</a>
    <h1>Consolidated Sheet</h1>
    <span class="label">Date:</span>
    <input id="dateInput" type="date">
    <button onclick="loadAll()"><i class="fa-solid fa-rotate-right"></i> Reload</button>
    <button class="ghost" onclick="window.print()"><i class="fa-solid fa-print"></i> Print / PDF</button>
    <span class="status" id="loadStatus">Loading…</span>
</div>

<div id="sheets"></div>

<script>
const $ = sel => document.querySelector(sel);

// Consolidated order: all UP sheets, then all DN sheets, then BYPASS.
// Same terminal sections as the daily sheets (CSMT · LTT · KR · PNVL).
const SHEETS = [
    { source: 'CSMT-UP', label: 'CSMT-UP', group: 'UP' },
    { source: 'LTT-UP',  label: 'LTT-UP',  group: 'UP' },
    { source: 'KR-UP',   label: 'KR-UP',   group: 'UP' },
    { source: 'PNVL-UP', label: 'PNVL-UP', group: 'UP' },
    { source: 'CSMT-DN', label: 'CSMT-DN', group: 'DN' },
    { source: 'LTT-DN',  label: 'LTT-DN',  group: 'DN' },
    { source: 'KR-DN',   label: 'KR-DN',   group: 'DN' },
    { source: 'PNVL-DN', label: 'PNVL-DN', group: 'DN' },
    { source: null,      label: 'BYPASS Trains', direction: 'BYPASS', group: 'BYPASS' },
];
const GROUP_LABEL = { UP: 'UP Trains', DN: 'DN Trains', BYPASS: 'Bypass' };

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtTime(t) {
    if (!t) return '';
    return String(t).split(/\s+/).map(tok => {
        const m = tok.match(/^(\d{1,2}):(\d{2})$/);
        return m ? `${String(parseInt(m[1], 10)).padStart(2, '0')}:${m[2]}` : tok;
    }).join(' ');
}
function parseMin(t) {
    if (!t) return 99999;
    const m = String(t).trim().match(/^(\d{1,2}):(\d{2})/);
    if (!m) return 99999;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}
function sectionColourClass(section) {
    if (section === 'NE') return 'sec-NE';
    if (section === 'SE') return 'sec-SE';
    if (section === 'KR') return 'sec-KR';
    return 'sec-other';
}
function fmtDMY(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}-${m}-${y}`;
}
// Read-only schedule chip: "IA · 30-07-2027", red when overdue.
function schedChip(type, due) {
    if (!type && !due) return '<span class="sched-chip none">—</span>';
    const overdue = due && due < todayISO();
    const label = [type || '', due ? fmtDMY(due) : ''].filter(Boolean).join(' · ');
    return `<span class="sched-chip${overdue ? ' overdue' : ''}">${esc(label)}</span>`;
}

function urlFor(sheet, date) {
    const qs = new URLSearchParams({ date });
    if (sheet.source) qs.set('sheet_source', sheet.source);
    else if (sheet.direction) qs.set('direction', sheet.direction);
    return `/api/division/loco-link/today?${qs}`;
}

function renderSheetBlock(sheet, data, date) {
    const block = document.createElement('div');
    block.className = 'sheet-block';
    const inOutHead = sheet.source && sheet.source.endsWith('-UP') ? 'Outgoing' : 'Incoming';

    block.innerHTML = `
        <div class="sheet-header">
            <span>${esc(sheet.label)}</span>
            <span class="sheet-meta">${fmtDMY(date)} · ${data.total || 0} trains · ${data.filled || 0} entered</span>
        </div>
        <table class="sheet">
            <thead>
                <tr>
                    <th style="width:48px">Time</th>
                    <th style="width:74px">Train</th>
                    <th style="width:64px">Shed</th>
                    <th style="width:90px">Loco Type</th>
                    <th style="width:72px">HOG</th>
                    <th style="width:96px">Loco</th>
                    <th style="width:56px">Base</th>
                    <th style="width:120px">Schedule</th>
                    <th style="width:76px">${inOutHead}</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    `;

    const tbody = block.querySelector('tbody');
    if (!data.rows || !data.rows.length) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="9">No trains scheduled for this date.</td></tr>`;
        return block;
    }

    const isBypass = sheet.direction === 'BYPASS';
    if (isBypass) {
        const groups = new Map();
        for (const row of data.rows) {
            const k = row.route_label || '(no route)';
            if (!groups.has(k)) groups.set(k, []);
            groups.get(k).push(row);
        }
        for (const [route, rows] of groups) {
            tbody.insertAdjacentHTML('beforeend', `<tr class="sec-header sec-bypass"><td colspan="9">${esc(route)}</td></tr>`);
            rows.sort((a, b) => parseMin(a.event_time) - parseMin(b.event_time));
            for (const row of rows) tbody.appendChild(renderRow(row, sheet));
            for (const sp of (data.specials || []).filter(s => (s.section || '') === route)) {
                tbody.appendChild(renderRow(Object.assign({ _isSpecial: true }, sp), sheet));
            }
        }
    } else {
        const isKrUp = sheet.source === 'KR-UP';
        const secondaryFor = (r) => isKrUp ? (r.to_station || '') : (r.from_station || '');
        const groups = new Map();
        let order = 0;
        for (const row of data.rows) {
            const key = `${row.section || ''}|${secondaryFor(row)}`;
            if (!groups.has(key)) groups.set(key, { section: row.section || '', secondary: secondaryFor(row), rows: [], order: order++ });
            groups.get(key).rows.push(row);
        }
        for (const sp of (data.specials || [])) {
            const key = `${sp.section || ''}|`;
            if (!groups.has(key)) groups.set(key, { section: sp.section || '', secondary: '', rows: [], order: order++ });
            groups.get(key).rows.push(Object.assign({ _isSpecial: true }, sp));
        }

        const KR_ORDER = { CSMT: 0, LTT: 1, DIVA: 2, PUNE: 3 };
        const rank = (g) => {
            if (isKrUp && g.section === 'KR') {
                const r = KR_ORDER[g.secondary];
                return r !== undefined ? r : 50;
            }
            if (g.section === 'NE') return 0;
            if (g.section === 'SE') return 1;
            if (g.section === 'KR') return 2;
            return 4;
        };
        const sorted = Array.from(groups.values()).sort((a, b) => {
            const ra = rank(a), rb = rank(b);
            if (ra !== rb) return ra - rb;
            return a.order - b.order;
        });

        const counts = {};
        for (const r of data.rows) {
            const sec = secondaryFor(r);
            counts[sec] = (counts[sec] || 0) + 1;
        }
        const mainSec = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || '';

        for (const g of sorted) {
            let label = g.section || 'OTHER';
            if (g.secondary && g.secondary !== mainSec) {
                label += ` · ${isKrUp ? '→' : 'ex'} ${g.secondary}`;
            } else if (isKrUp && g.secondary) {
                label += ` · → ${g.secondary}`;
            }
            tbody.insertAdjacentHTML('beforeend',
                `<tr class="sec-header ${sectionColourClass(g.section)}"><td colspan="9">${esc(label)}</td></tr>`);
            g.rows.sort((a, b) => parseMin(a.event_time) - parseMin(b.event_time));
            for (const row of g.rows) tbody.appendChild(renderRow(row, sheet));
        }
    }
    return block;
}

function renderRow(r, sheet) {
    const tr = document.createElement('tr');
    // Master rows carry the entry under r.log; specials are log rows themselves.
    const log = r.log || (r._isSpecial ? r : (r.actual_loco_no ? r : {}));
    const isUp = sheet.source && sheet.source.endsWith('-UP');
    const inOut = isUp ? (log.outgoing_train || '') : (log.incoming_train || '');
    // Loco type = link_attr with the PUSH-PULL token stripped (shown as its own
    // badge); HOG is drawn from the plan's expected_hog as a HOG / Non-HOG cell.
    const isSpecial = !!r._isSpecial;
    const locoType = (r.link_attr || '').replace(/\bPUSH[\s-]?PULL\b/ig, '').replace(/\s+/g, ' ').trim();
    const ppBadge = r.is_push_pull ? '<span class="flag pp">PP</span>' : '';
    const hogCell = isSpecial
        ? '<span class="hog-na">—</span>'
        : (r.expected_hog ? '<span class="hog-yes">HOG</span>' : '<span class="hog-no">Non-HOG</span>');

    if (log.actual_loco_no) tr.classList.add('row-filled');
    if (log.is_mislink) tr.classList.add('row-mislink');

    const flags =
        (log.is_mislink ? '<span class="flag mis">MIS</span>' : '') +
        (log.main_loco_dead ? '<span class="flag dead">DEAD</span>' : '') +
        (log.hog ? '<span class="flag hog">HOG</span>' : '');

    const rearLoco = log.actual_loco_no_rear
        ? `<span class="rear">+ ${esc(log.actual_loco_no_rear)}${log.secondary_role ? ' (' + esc(log.secondary_role) + ')' : ''}</span>`
        : '';

    tr.innerHTML = `
        <td>${esc(fmtTime(r.event_time || log.event_time))}</td>
        <td><strong>${esc(r.train_no || log.train_no)}</strong></td>
        <td>${esc(r.shed_code || (isSpecial ? (r.section || '') : '')) || '—'}</td>
        <td>${esc(locoType) || '—'}${ppBadge}</td>
        <td>${hogCell}</td>
        <td class="c-loco">${esc(log.actual_loco_no || '')}${flags}${rearLoco}</td>
        <td>${esc(log.base_shed || '')}</td>
        <td>${schedChip(log.schedule_type, log.schedule_due_date)}</td>
        <td>${esc(inOut)}</td>
    `;
    return tr;
}

async function loadAll() {
    const date = $('#dateInput').value || todayISO();
    $('#loadStatus').textContent = 'Loading…';
    const container = $('#sheets');
    container.innerHTML = '<div class="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> Fetching all sheets…</div>';

    try {
        const responses = await Promise.all(SHEETS.map(async sh => {
            const r = await fetch(urlFor(sh, date));
            if (!r.ok) throw new Error(`${sh.label}: HTTP ${r.status}`);
            return { sheet: sh, data: await r.json() };
        }));
        container.innerHTML = '';
        let curGroup = null;
        let totalTrains = 0, totalFilled = 0;
        for (const { sheet, data } of responses) {
            if (sheet.group !== curGroup) {
                curGroup = sheet.group;
                const div = document.createElement('div');
                div.className = `dir-divider dir-${curGroup}`;
                div.innerHTML = `<span class="pill">${curGroup}</span> ${esc(GROUP_LABEL[curGroup] || curGroup)}`;
                container.appendChild(div);
            }
            totalTrains += data.total || 0;
            totalFilled += data.filled || 0;
            container.appendChild(renderSheetBlock(sheet, data, date));
        }
        $('#loadStatus').textContent = `${fmtDMY(date)} · ${totalFilled}/${totalTrains} locos entered across ${SHEETS.length} sheets`;
    } catch (e) {
        container.innerHTML = `<div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> ${esc(e.message)}</div>`;
        $('#loadStatus').textContent = 'Failed';
    }
}

// Init: read date from URL or default to today
const params = new URLSearchParams(location.search);
const initialDate = params.get('date') && /^\d{4}-\d{2}-\d{2}$/.test(params.get('date'))
    ? params.get('date') : todayISO();
$('#dateInput').value = initialDate;
$('#dateInput').addEventListener('change', loadAll);
loadAll();
</script>
<script src="/control-office/nav-home.js"></script>
</body>
</html>
