<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Letter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/div/css/training-letter-workflow.css"></head><body>
<header class="top"><h1>Training Letter <span id="scope" class="status">Loading…</span></h1><div class="actions"><button class="btn outline" id="new-letter">New</button><button class="btn outline" id="history-button">History</button><button class="btn outline" onclick="window.print()">Print / PDF</button><button class="btn primary" id="save-letter">Submit letter</button><button class="btn outline" onclick="location.href='/div'">Back</button></div></header>
<main class="layout"><section class="panel">
<div class="section"><h2>Letter details</h2><div class="fields"><label class="field full">Course<select id="course" required></select></label><label class="field">Letter number<input id="number" maxlength="50" required></label><label class="field">Letter date<input id="letter-date" type="date" required></label><label class="field">Training date<input id="training-date" type="date" required></label><label class="field full">Requirements<input id="requirements" maxlength="255"></label></div><p id="lock-note" class="help"></p></div>
<div class="section"><h2>Add trainee</h2><div class="search-row"><select id="source"><option value="staff">Staff</option><option value="cli">CLI</option><option value="manual_tm">Train Manager</option></select><input id="search" maxlength="100" placeholder="Name, CMS, HRMS or PF number"><button class="btn outline" id="search-button">Search</button></div><div id="results" class="results"></div></div>
<div class="section"><h2>Nominees <span id="count" class="status">0</span></h2><div id="nominees" class="nominees"></div></div>
<div class="section" id="history-section" hidden><h2>Letter history</h2><div id="history" class="history"></div></div>
</section><article class="paper" id="paper"><div class="letter-head"><div>CENTRAL RAILWAY</div><div class="right" id="office-head"></div></div><div class="letter-meta"><div><b>No.</b> <span id="print-number">—</span></div><div><b>Date:</b> <span id="print-date">—</span></div></div><div class="addressee">To,<br>The Chief Loco Inspector,<br>Motormen Training Centre, Kurla (CLA)</div><div class="subject">SUB: <span id="print-subject">—</span></div><div class="body" id="print-body">—</div><div class="requirements" id="print-requirements"></div><table class="letter-table"><thead><tr><th>Sr.</th><th id="name-heading">Trainee Name</th><th>PF No.</th><th>Last Training</th><th>Due Date</th></tr></thead><tbody id="print-trainees"><tr><td colspan="5">No nominees added</td></tr></tbody></table><div>Please report their arrival.</div><div class="signature" id="signature"></div><div class="letter-cc" id="cc"></div><div class="versions" id="version-info"></div></article></main><div class="toast" id="toast"></div><script src="/div/js/training-letter-workflow.js"></script></body></html>
