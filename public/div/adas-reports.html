<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divisional Portal – ADAS Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{background:#f6f7fb;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;color:#1e293b;}

  .top-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .top-bar h1{font-size:18px;font-weight:700;margin:0;color:#0f172a;display:flex;align-items:center;gap:10px;}
  .top-bar h1 .badge-title{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;letter-spacing:.5px;}
  .btn-back{background:none;border:1px solid #cbd5e1;border-radius:8px;padding:6px 14px;color:#475569;font-size:13px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-back:hover{background:#f1f5f9;border-color:#94a3b8;}
  .btn-primary-gradient{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary-gradient:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,92,246,.3);color:#fff;}

  .page{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}

  .card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:20px;overflow:hidden;}
  .card-header{padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;}
  .card-header h2{font-size:14px;font-weight:700;margin:0;color:#0f172a;}
  .card-body{padding:20px;}

  .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .form-label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block;}
  .form-control,.form-select{font-size:13px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;transition:all .2s;background:#fff;width:100%;}
  .form-control:focus,.form-select:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.1);outline:none;}

  .filter-actions{display:flex;gap:8px;align-items:flex-end;}
  .btn-filter{background:#8b5cf6;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
  .btn-filter:hover{background:#7c3aed;}
  .btn-clear{background:transparent;color:#64748b;border:1px solid #e2e8f0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .15s;}
  .btn-clear:hover{background:#f1f5f9;}

  /* Summary stats */
  .stats-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:180px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .stat-card .stat-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .stat-card .stat-value{font-size:24px;font-weight:700;color:#0f172a;margin-top:2px;}
  .stat-card.purple{border-left:4px solid #8b5cf6;}

  /* Report cards */
  .reports-list{display:flex;flex-direction:column;gap:12px;}
  .report-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .report-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:#8b5cf6;}
  .report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .report-title{font-size:14px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .train-badge{background:#f5f3ff;color:#5b21b6;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:.3px;}
  .route{color:#475569;font-size:13px;}
  .arrow{color:#94a3b8;margin:0 4px;}
  .report-date{font-size:12px;color:#64748b;}
  .section-pill{display:inline-block;padding:2px 8px;border-radius:6px;background:#ede9fe;color:#5b21b6;font-size:10px;font-weight:700;letter-spacing:.3px;}
  .safecat-pill{display:inline-block;padding:2px 8px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:700;}

  .report-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:13px;}
  .report-col .label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .report-col .val{color:#1e293b;font-weight:600;margin-top:2px;}
  .report-col .hrms{color:#64748b;font-weight:400;font-size:11px;}

  .report-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed #e2e8f0;font-size:12px;color:#64748b;}
  .view-link{color:#8b5cf6;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}

  .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
  .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5;}
  .empty-state .text{font-size:14px;}
  .loading{text-align:center;padding:40px;color:#94a3b8;font-size:14px;}

  .pagination{display:flex;justify-content:center;gap:4px;margin-top:20px;}
  .page-btn{padding:6px 12px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;font-size:13px;color:#475569;cursor:pointer;transition:all .15s;}
  .page-btn:hover:not(:disabled){background:#f1f5f9;}
  .page-btn.active{background:#8b5cf6;color:#fff;border-color:#8b5cf6;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Detail view */
  .detail-view{display:none;}
  .detail-view.active{display:block;}
  .listing-view.hidden{display:none;}
  .detail-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .detail-header h1{font-size:20px;font-weight:700;margin:0;}
  .detail-actions{margin-left:auto;display:flex;gap:8px;}
  .detail-meta{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .detail-meta .label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .detail-meta .val{font-size:13px;color:#0f172a;font-weight:600;margin-top:2px;}

  .obs-table-detail{width:100%;border-collapse:collapse;background:#fff;}
  .obs-table-detail th{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;padding:10px 14px;text-align:left;background:#f8fafc;border-bottom:2px solid #e2e8f0;}
  .obs-table-detail td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
  .val-chip{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.3px;}
  .val-chip.yes{background:#dcfce7;color:#166534;}
  .val-chip.no{background:#fee2e2;color:#991b1b;}
  .val-chip.na{background:#e0e7ff;color:#3730a3;}
  .val-chip.custom{background:#fef3c7;color:#92400e;font-weight:600;}
  .val-chip.empty{color:#cbd5e1;}

  @media(max-width:768px){
    .grid-5{grid-template-columns:1fr 1fr;}
    .report-body,.detail-meta{grid-template-columns:1fr;}
  }
  @media print{
    .top-bar,.no-print{display:none!important;}
    .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:12px;">
    <a class="btn-back" href="/div/spm-hub.html">← Back</a>
    <h1>
      ADAS Reports
      <span class="badge-title">SUBURBAN</span>
    </h1>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-outline-secondary btn-sm" id="btnPrint" style="font-size:13px;border-radius:8px;display:none;" onclick="window.print()">Print</button>
    <a class="btn-primary-gradient" href="/div/adas.html">+ New ADAS Report</a>
  </div>
</div>

<div class="page">
  <div class="listing-view" id="listingView">
    <div class="card">
      <div class="card-header"><h2>Filters</h2></div>
      <div class="card-body">
        <div class="grid-5" style="margin-bottom:12px;">
          <div>
            <label class="form-label">From Date</label>
            <input type="date" class="form-control" id="fFrom">
          </div>
          <div>
            <label class="form-label">To Date</label>
            <input type="date" class="form-control" id="fTo">
          </div>
          <div>
            <label class="form-label">Motorman HRMS</label>
            <input type="text" class="form-control" id="fMMan" placeholder="HRMS ID...">
          </div>
          <div>
            <label class="form-label">CLI HRMS</label>
            <input type="text" class="form-control" id="fCli" placeholder="CLI HRMS...">
          </div>
          <div>
            <label class="form-label">Section</label>
            <select class="form-select" id="fSection">
              <option value="">All Sections</option>
              <option value="UPL/L">UPL/L</option>
              <option value="DNL/L">DNL/L</option>
              <option value="UPS/S">UPS/S</option>
              <option value="DNS/S">DNS/S</option>
              <option value="UP/F">UP/F</option>
              <option value="DN/F">DN/F</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-filter" onclick="applyFilters()">Search</button>
          <button class="btn-clear" onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div id="reportsList"><div class="loading">Loading reports…</div></div>

    <div class="pagination" id="pagination"></div>
  </div>

  <div class="detail-view" id="detailView"></div>
</div>

<script>
let CURRENT_PAGE = 1;
let TOTAL_PAGES = 1;
let CURRENT_FILTERS = {};

async function api(url, opts = {}) {
  const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store', ...opts });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
  catch(e) { return d; }
}

function valChip(val, isInverse) {
  if (!val) return '<span class="val-chip empty">—</span>';
  const v = String(val).trim().toUpperCase();
  if (v === 'YES') return `<span class="val-chip ${isInverse ? 'no' : 'yes'}">YES</span>`;
  if (v === 'NO')  return `<span class="val-chip ${isInverse ? 'yes' : 'no'}">NO</span>`;
  if (v === 'N/A' || v === 'NA') return '<span class="val-chip na">N/A</span>';
  return `<span class="val-chip custom">${escapeHtml(val)}</span>`;
}

async function loadReports(page = 1) {
  CURRENT_PAGE = page;
  const list = document.getElementById('reportsList');
  list.innerHTML = '<div class="loading">Loading reports…</div>';

  const params = new URLSearchParams({ page, limit: 20, ...CURRENT_FILTERS });

  try {
    const json = await api(`/api/division/adas/reports?${params}`);
    const { data, total, limit } = json;
    TOTAL_PAGES = Math.max(1, Math.ceil(total / limit));

    renderStats(data, total);
    renderList(data);
    renderPagination();
  } catch (err) {
    list.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><div class="text">Error: ${escapeHtml(err.message)}</div></div>`;
  }
}

function renderStats(data, total) {
  // Count by safety category
  const cats = { A: 0, B: 0, C: 0, other: 0 };
  data.forEach(r => { const c = r.safety_category; if (c in cats) cats[c]++; else cats.other++; });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card purple"><div class="stat-label">Total Reports</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Safe Cat A</div><div class="stat-value">${cats.A}</div></div>
    <div class="stat-card"><div class="stat-label">Safe Cat B</div><div class="stat-value">${cats.B}</div></div>
    <div class="stat-card"><div class="stat-label">Safe Cat C</div><div class="stat-value">${cats.C}</div></div>
  `;
}

function renderList(data) {
  const list = document.getElementById('reportsList');
  if (!data.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div class="text">No reports found. Try adjusting filters.</div></div>';
    return;
  }

  list.innerHTML = '<div class="reports-list">' + data.map(r => `
    <div class="report-card" onclick="viewReport(${r.report_id})">
      <div class="report-header">
        <div class="report-title">
          <span class="train-badge">Train ${escapeHtml(r.train_number)}</span>
          ${r.section ? `<span class="section-pill">${escapeHtml(r.section)}</span>` : ''}
          ${r.d_cab ? `<span style="font-size:12px;color:#94a3b8;">D CAB: ${escapeHtml(r.d_cab)}</span>` : ''}
          <span class="route">${escapeHtml(r.from_station || '?')}<span class="arrow">→</span>${escapeHtml(r.to_station || '?')}</span>
        </div>
        <div class="report-date">Event: ${formatDate(r.event_date)}</div>
      </div>
      <div class="report-body">
        <div class="report-col">
          <div class="label">Motorman</div>
          <div class="val">${escapeHtml(r.mman_name)}</div>
          <div class="hrms">${r.mman_hrms_id ? 'HRMS: ' + escapeHtml(r.mman_hrms_id) : ''}${r.mman_hq ? ' · HQ: ' + escapeHtml(r.mman_hq) : ''}</div>
          ${r.safety_category ? `<div style="margin-top:4px;"><span class="safecat-pill">Safe.Cat ${escapeHtml(r.safety_category)}</span></div>` : ''}
        </div>
        <div class="report-col">
          <div class="label">Nominated LI</div>
          <div class="val">${escapeHtml(r.nli_name || '—')}</div>
        </div>
        <div class="report-col">
          <div class="label">Analyzed By</div>
          <div class="val">${escapeHtml(r.cli_name)}</div>
          <div class="hrms">On ${formatDate(r.analysis_date)}</div>
        </div>
      </div>
      <div class="report-footer">
        <span>${r.final_remark ? '📝 ' + escapeHtml((r.final_remark || '').substring(0, 60)) + (r.final_remark.length > 60 ? '…' : '') : '&nbsp;'}</span>
        <a class="view-link" onclick="event.stopPropagation();viewReport(${r.report_id})">View Details →</a>
      </div>
    </div>
  `).join('') + '</div>';
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (TOTAL_PAGES <= 1) { el.innerHTML = ''; return; }

  let html = `<button class="page-btn" ${CURRENT_PAGE === 1 ? 'disabled' : ''} onclick="loadReports(${CURRENT_PAGE - 1})">‹ Prev</button>`;
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    if (i === 1 || i === TOTAL_PAGES || (i >= CURRENT_PAGE - 2 && i <= CURRENT_PAGE + 2)) {
      html += `<button class="page-btn ${i === CURRENT_PAGE ? 'active' : ''}" onclick="loadReports(${i})">${i}</button>`;
    } else if (i === CURRENT_PAGE - 3 || i === CURRENT_PAGE + 3) {
      html += `<span style="padding:6px 4px;color:#94a3b8;">…</span>`;
    }
  }
  html += `<button class="page-btn" ${CURRENT_PAGE === TOTAL_PAGES ? 'disabled' : ''} onclick="loadReports(${CURRENT_PAGE + 1})">Next ›</button>`;
  el.innerHTML = html;
}

function applyFilters() {
  CURRENT_FILTERS = {};
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  const mman = document.getElementById('fMMan').value.trim();
  const cli = document.getElementById('fCli').value.trim();
  const section = document.getElementById('fSection').value;
  if (from) CURRENT_FILTERS.from = from;
  if (to) CURRENT_FILTERS.to = to;
  if (mman) CURRENT_FILTERS.mman_hrms = mman;
  if (cli) CURRENT_FILTERS.cli_hrms = cli;
  if (section) CURRENT_FILTERS.section = section;
  loadReports(1);
}

function clearFilters() {
  ['fFrom','fTo','fMMan','fCli','fSection'].forEach(id => document.getElementById(id).value = '');
  CURRENT_FILTERS = {};
  loadReports(1);
}

async function viewReport(id) {
  const detail = document.getElementById('detailView');
  const listing = document.getElementById('listingView');
  listing.classList.add('hidden');
  detail.classList.add('active');
  detail.innerHTML = '<div class="loading">Loading report…</div>';
  document.getElementById('btnPrint').style.display = 'inline-block';
  window.scrollTo(0, 0);

  try {
    const json = await api(`/api/division/adas/reports/${id}`);
    const { report, observations } = json.data;
    renderDetail(report, observations);
  } catch (err) {
    detail.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><div class="text">Error loading report: ${escapeHtml(err.message)}</div></div>`;
  }
}

function renderDetail(r, obs) {
  document.getElementById('detailView').innerHTML = `
    <div class="detail-header no-print">
      <button class="btn-back" onclick="backToList()">← Back to list</button>
      <h1>ADAS Report #${r.report_id}</h1>
      <div class="detail-actions">
        <a class="btn-primary-gradient" href="/div/adas.html?id=${r.report_id}">✎ Edit</a>
      </div>
    </div>

    <div class="detail-meta">
      <div><div class="label">Train Number</div><div class="val">${escapeHtml(r.train_number)}</div></div>
      <div><div class="label">D CAB</div><div class="val">${escapeHtml(r.d_cab || '—')}</div></div>
      <div><div class="label">Section</div><div class="val">${escapeHtml(r.section || '—')}</div></div>
      <div><div class="label">Safety Category</div><div class="val">${escapeHtml(r.safety_category || '—')}</div></div>
      <div><div class="label">Event Date</div><div class="val">${formatDate(r.event_date)}</div></div>
      <div><div class="label">Analysis Date</div><div class="val">${formatDate(r.analysis_date)}</div></div>
      <div><div class="label">From</div><div class="val">${escapeHtml(r.from_station || '—')}</div></div>
      <div><div class="label">To</div><div class="val">${escapeHtml(r.to_station || '—')}</div></div>
      <div><div class="label">Time From</div><div class="val">${escapeHtml(r.time_from || '—')}</div></div>
      <div><div class="label">Time To</div><div class="val">${escapeHtml(r.time_to || '—')}</div></div>
      <div><div class="label">Motorman</div><div class="val">${escapeHtml(r.mman_name)}${r.mman_hrms_id ? ' <span style="color:#94a3b8;font-weight:400;font-size:11px;">(' + escapeHtml(r.mman_hrms_id) + ')</span>' : ''}</div></div>
      <div><div class="label">Motorman HQ</div><div class="val">${escapeHtml(r.mman_hq || '—')}</div></div>
      <div><div class="label">Analyzing CLI</div><div class="val">${escapeHtml(r.cli_name)}</div></div>
      <div><div class="label">Nominated LI (NLI)</div><div class="val">${escapeHtml(r.nli_name || '—')}</div></div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Observations Checklist (13 items)</h2></div>
      <table class="obs-table-detail">
        <thead>
          <tr>
            <th style="width:40px;">#</th>
            <th>Observation</th>
            <th style="width:150px;">Value</th>
          </tr>
        </thead>
        <tbody>
          ${obs.map((o, idx) => `
            <tr>
              <td style="color:#94a3b8;font-weight:600;">${idx + 1}.</td>
              <td>${escapeHtml(o.item_text)}${o.is_inverse ? ' <span style="color:#dc2626;font-size:10px;font-weight:700;margin-left:4px;">(NO expected)</span>' : ''}</td>
              <td>${valChip(o.value_text, o.is_inverse)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    ${r.final_remark ? `
      <div class="card">
        <div class="card-header"><h2>Final Remark</h2></div>
        <div class="card-body" style="font-size:13px;color:#334155;white-space:pre-wrap;">${escapeHtml(r.final_remark)}</div>
      </div>
    ` : ''}
  `;
}

function backToList() {
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('detailView').innerHTML = '';
  document.getElementById('listingView').classList.remove('hidden');
  document.getElementById('btnPrint').style.display = 'none';
}

(function init() {
  const today = new Date();
  const monthAgo = new Date(today.getTime() - 30 * 86400000);
  document.getElementById('fFrom').value = monthAgo.toISOString().split('T')[0];
  document.getElementById('fTo').value = today.toISOString().split('T')[0];
  applyFilters();
})();
</script>
</body>
</html>
