<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Shed defect</title><link rel="stylesheet" href="/div/css/trip-shed.css"></head><body><header class="top"><div class="brand"><b>VVH Trip Shed defect</b><small>Lifecycle and audit history</small></div><span class="spacer"></span><a href="/div/trip-shed.html">← Trip Shed</a></header><main class="main"><div class="heading"><div><h1 id="title">Defect</h1><p id="state"></p></div></div><div class="grid"><section class="card" id="detail">Loading…</section><section class="card"><h2>Lifecycle update</h2><form id="life" class="formgrid"><label>Status<select name="status"><option value="UNDER_ATTENTION">Under attention</option><option value="CLOSED">Closed</option></select></label><label>Responsible party<input class="input" name="responsible_party"></label><label class="wide">Action taken<textarea name="action_taken"></textarea></label><label class="wide">Event note<textarea name="event_note"></textarea></label><div class="wide"><button class="btn primary">Save update</button></div></form><p id="notice" role="status"></p></section></div><section class="card" style="margin-top:15px"><h2>Event history</h2><div id="events"></div></section></main><script>
const API='/api/division/trip-shed',shedCode=new URLSearchParams(location.search).get('shed_code')||'',scoped=p=>shedCode?p+(p.includes('?')?'&':'?')+'shed_code='+encodeURIComponent(shedCode):p,id=new URLSearchParams(location.search).get('id'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let defect;
const text=(v)=>v==null||v===''?'—':esc(v);function render(d){defect=d.defect;$('#title').textContent='Defect #'+defect.id+' · '+defect.status;$('#state').textContent=defect.status==='CLOSED'?'Closed defects are locked':'Update the lifecycle and preserve the event history.';$('#detail').innerHTML=`<h2>${text(defect.loco_number)} · ${text(defect.equipment_name)}</h2><p><b>Date:</b> ${text(defect.defect_date)} · <b>Category:</b> ${text(defect.defect_category)} · <b>Status:</b> ${text(defect.status)}</p><p><b>Description:</b> ${text(defect.description)}</p><p><b>Action taken:</b> ${text(defect.action_taken)}</p><p><b>Responsible:</b> ${text(defect.responsible_party)}</p>`;$('#events').innerHTML=d.events.length?d.events.map(e=>`<div class="row"><b>${text(e.status_after)}</b> · ${text(e.created_at)}<br>${text(e.event_note)}</div>`).join(''):'<div class="row">No lifecycle events.</div>';const closed=defect.status==='CLOSED';$('#life').querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=closed);if(closed)$('#notice').textContent='Closed defect is locked.';}
async function load(){try{const r=await fetch(API+scoped('/defects/'+encodeURIComponent(id)+'/events'));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load defect');render(d)}catch(e){$('#detail').innerHTML='<p>'+esc(e.message)+'</p>';$('#life').hidden=true}}$('#life').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));try{const r=await fetch(API+scoped('/defects/'+encodeURIComponent(id)+'/lifecycle'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to update defect');$('#notice').textContent=d.message;await load()}catch(x){$('#notice').textContent=x.message}};if(/^\d+$/.test(id||''))load();else $('#detail').innerHTML='<p>Valid defect ID required.</p>';
</script></body></html>
