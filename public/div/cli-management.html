<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLI Management - Division Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .filter-box select {
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }

        .cli-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .cli-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.2s;
            cursor: pointer;
        }

        .cli-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .cli-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .cli-cmsid {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }

        .cli-name {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin: 4px 0;
        }

        .cli-office {
            font-size: 14px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .staff-count {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 16px 0;
        }

        .staff-count .number {
            font-size: 28px;
            font-weight: 700;
        }

        .staff-count .label {
            font-size: 12px;
            opacity: 0.9;
        }

        .cli-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .cli-actions button {
            flex: 1;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 24px;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .close-btn:hover {
            background: #f3f4f6;
        }

        .modal-body {
            padding: 24px;
        }

        .info-section {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .info-section h3 {
            color: #1f2937;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            color: #1f2937;
            font-weight: 500;
        }

        .stats-section {
            margin-bottom: 24px;
        }

        .stat-box {
            background: #f9fafb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .stat-box h4 {
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .category-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .category-label {
            width: 100px;
            font-size: 14px;
            color: #6b7280;
        }

        .category-progress {
            flex: 1;
            background: #e5e7eb;
            border-radius: 4px;
            height: 24px;
            position: relative;
            overflow: hidden;
        }

        .category-fill {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: 500;
        }

        .category-A { background: linear-gradient(90deg, #10b981, #059669); }
        .category-B { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .category-C { background: linear-gradient(90deg, #ef4444, #dc2626); }

        .crosstab-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .crosstab-table th,
        .crosstab-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .crosstab-table th {
            background: #f3f4f6;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #ef4444;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .staff-table {
            width: 100%;
            border-collapse: collapse;
        }

        .staff-table th,
        .staff-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .staff-table th {
            background: #f9fafb;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
        }

        .staff-table td {
            font-size: 14px;
            color: #1f2937;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-expired {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-transferred {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👨‍✈️ CLI Management</h1>
            <div class="header-actions">
                <span id="cliCounts" style="margin-right: 16px; color: #6b7280; font-size: 14px;"></span>
                <button class="btn btn-secondary" onclick="window.location.href='/div'">← Back</button>
                <button class="btn btn-primary" onclick="openAddCLIModal()">+ Add New CLI</button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name or CMSID..." onkeyup="filterCLIs()">
            </div>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #6b7280;">
                <input type="checkbox" id="showInactiveToggle" onchange="loadCLIs()">
                Show Inactive CLIs
            </label>
            <div class="filter-box">
                <select id="officeFilter" onchange="filterCLIs()">
                    <option value="">All Offices</option>
                </select>
            </div>
        </div>

        <!-- CLI Grid -->
        <div id="cliGrid" class="cli-grid">
            <div class="loading">Loading CLIs...</div>
        </div>
    </div>

    <!-- CLI Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailsTitle">CLI Details</h2>
                <button class="close-btn" onclick="closeModal('detailsModal')">×</button>
            </div>
            <div class="modal-body" id="detailsBody">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Add/Edit CLI Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="editTitle">Add New CLI</h2>
                <button class="close-btn" onclick="closeModal('editModal')">×</button>
            </div>
            <div class="modal-body">
                <form id="cliForm">
                    <input type="hidden" id="cli_id">

                    <div class="form-group">
                        <label>CMSID <span class="required">*</span></label>
                        <input type="text" id="cmsid" required>
                    </div>

                    <div class="form-group">
                        <label>CLI Name <span class="required">*</span></label>
                        <input type="text" id="cli_name" required>
                    </div>

                    <div class="form-group">
                        <label>Current Office</label>
                        <select id="current_office_code">
                            <option value="">Select Office</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="cli_dob">
                    </div>

                    <div class="form-group">
                        <label>Date of Appointment</label>
                        <input type="date" id="cli_doa">
                    </div>

                    <div class="form-group">
                        <label>Date Promoted to CLI</label>
                        <input type="date" id="date_promoted_to_cli">
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="cli_mobile" pattern="[0-9]{10}">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveCLI()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Staff List Modal -->
    <div id="staffModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="staffTitle">Staff under CLI</h2>
                <button class="close-btn" onclick="closeModal('staffModal')">×</button>
            </div>
            <div class="modal-body" id="staffBody">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Nominate Staff Modal -->
    <div id="nominateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="nominateTitle">Nominate Staff to CLI</h2>
                <button class="close-btn" onclick="closeNominateModal()">×</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 16px;">
                    <input type="text" id="staffSearchInput" placeholder="🔍 Search staff by name or HRMS ID..."
                           style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;"
                           onkeyup="filterNominationStaff()">
                </div>

                <div style="margin-bottom: 16px; display: flex; gap: 12px; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="showWithoutCLI" checked onchange="filterNominationStaff()">
                        <span>Without CLI (<span id="withoutCLICount">0</span>)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="showWithCLI" onchange="filterNominationStaff()">
                        <span>With CLI (<span id="withCLICount">0</span>)</span>
                    </label>
                </div>

                <div id="staffListContainer" style="max-height: 300px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 20px;">
                    <div id="staffListLoading">Loading staff...</div>
                    <div id="staffListContent"></div>
                </div>

                <div style="margin-bottom: 12px; padding: 12px; background: #f9fafb; border-radius: 8px;">
                    <strong>Selected: <span id="selectedCount">0</span> staff</strong>
                </div>

                <div class="form-group">
                    <label>Start Date <span class="required">*</span></label>
                    <input type="date" id="nominationStartDate" required>
                </div>

                <div class="form-group">
                    <label>Remarks (Optional)</label>
                    <textarea id="nominationRemarks" rows="3" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeNominateModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitNomination()" id="nominateBtn">Nominate Selected</button>
            </div>
        </div>
    </div>

    <!-- Change CLI Modal -->
    <div id="changeCLIModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Change CLI</h2>
                <button class="close-btn" onclick="closeModal('changeCLIModal')">×</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 16px;">
                    <strong>Staff:</strong> <span id="changeStaffName"></span> (<span id="changeStaffHRMS"></span>)
                </p>
                <p style="margin-bottom: 20px; color: #6b7280;">
                    <strong>Current CLI:</strong> <span id="changeCurrentCLI"></span>
                </p>

                <div class="form-group">
                    <label>New CLI <span class="required">*</span></label>
                    <select id="newCLISelect" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                        <option value="">Select new CLI</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Effective Date <span class="required">*</span></label>
                    <input type="date" id="changeEffectiveDate" required>
                </div>

                <div class="form-group">
                    <label>Remarks (Optional)</label>
                    <textarea id="changeRemarks" rows="2" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('changeCLIModal')">Cancel</button>
                <button class="btn btn-primary" onclick="submitCLIChange()">Change CLI</button>
            </div>
        </div>
    </div>

    <!-- Deactivate CLI Modal -->
    <div id="deactivateModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header" style="background: #fef2f2;">
                <h2 style="color: #dc2626;">⚠️ Deactivate CLI</h2>
                <button class="close-btn" onclick="closeModal('deactivateModal')">×</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 16px; color: #6b7280;">
                    You are about to deactivate: <strong id="deactivateCLIName"></strong>
                </p>
                <input type="hidden" id="deactivateCLIId">

                <div class="form-group">
                    <label>Reason for Deactivation <span class="required">*</span></label>
                    <select id="inactiveReason" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                        <option value="">Select Reason</option>
                        <option value="Retired">Retired</option>
                        <option value="Promoted_ADEE">Promoted to ADEE</option>
                        <option value="Promoted_ADME">Promoted to ADME</option>
                        <option value="Expired">Expired (Deceased)</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Effective Date</label>
                    <input type="date" id="inactiveDate" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('deactivateModal')">Cancel</button>
                <button class="btn" style="background: #dc2626; color: white;" onclick="confirmDeactivateCLI()">Deactivate CLI</button>
            </div>
        </div>
    </div>

    <!-- Office History Modal -->
    <div id="officeHistoryModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h2 id="officeHistoryTitle">📍 Office History</h2>
                <button class="close-btn" onclick="closeModal('officeHistoryModal')">×</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <span style="color: #6b7280;" id="officeHistoryCLIName"></span>
                    <button class="btn btn-primary" onclick="openAddOfficeHistoryModal()">+ Add Posting</button>
                </div>
                <div id="officeHistoryList">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Office History Modal -->
    <div id="addOfficeHistoryModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h2 id="addOfficeHistoryTitle">Add Office Posting</h2>
                <button class="close-btn" onclick="closeModal('addOfficeHistoryModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="officeHistoryId">
                <input type="hidden" id="officeHistoryCLIId">

                <div class="form-group">
                    <label>Office <span class="required">*</span></label>
                    <select id="historyOfficeCode" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                        <option value="">Select Office</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="historyFromDate" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>

                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="historyToDate" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="historyIsCurrent">
                        <span>This is the current posting</span>
                    </label>
                </div>

                <div class="form-group">
                    <label>Remarks</label>
                    <input type="text" id="historyRemarks" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addOfficeHistoryModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveOfficeHistory()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let allCLIs = [];
        let allOffices = [];
        let cliCounts = { active_count: 0, inactive_count: 0 };

        // Load CLIs on page load
        async function loadCLIs() {
            try {
                const showInactive = document.getElementById('showInactiveToggle').checked;
                const url = showInactive ? '/api/division/cli?include_inactive=true' : '/api/division/cli';
                const response = await fetch(url);
                const data = await response.json();

                allCLIs = data.clis || data;
                cliCounts = data.counts || { active_count: allCLIs.length, inactive_count: 0 };

                // Update counts display
                document.getElementById('cliCounts').innerHTML = `
                    <span style="color: #059669;">Active: ${cliCounts.active_count || 0}</span>
                    ${cliCounts.inactive_count > 0 ? `<span style="margin-left: 12px; color: #dc2626;">Inactive: ${cliCounts.inactive_count}</span>` : ''}
                `;

                renderCLIs(allCLIs);
            } catch (error) {
                console.error('Error loading CLIs:', error);
                document.getElementById('cliGrid').innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Failed to load CLIs</p></div>';
            }
        }

        // Load offices for filter
        async function loadOffices() {
            try {
                const response = await fetch('/api/division/offices');
                const result = await response.json();
                allOffices = result.data || result; // Handle both response formats

                const officeFilter = document.getElementById('officeFilter');
                const officeSelect = document.getElementById('current_office_code');

                allOffices.forEach(office => {

        // Render CLI cards
        function renderCLIs(clis) {
            const grid = document.getElementById('cliGrid');

            if (clis.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No CLIs found</p></div>';
                return;
            }

            grid.innerHTML = clis.map(cli => {
                const years = cli.years_as_cli || 0;
                const months = cli.months_as_cli || 0;
                let cliSince = '';
                if (years > 0 && months > 0) {
                    cliSince = `CLI: ${years}y ${months}m`;
                } else if (years > 0) {
                    cliSince = `CLI: ${years} year${years > 1 ? 's' : ''}`;
                } else if (months > 0) {
                    cliSince = `CLI: ${months} month${months > 1 ? 's' : ''}`;
                } else {
                    cliSince = 'Recently promoted';
                }

                const isInactive = cli.is_active === 0 || cli.is_active === false;
                const inactiveStyle = isInactive ? 'opacity: 0.7; border: 2px dashed #dc2626;' : '';
                const inactiveBadge = isInactive ? `
                    <div style="position: absolute; top: 8px; right: 8px; background: #dc2626; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;">
                        INACTIVE${cli.inactive_reason ? ' - ' + cli.inactive_reason.replace('_', ' ') : ''}
                    </div>
                ` : '';

                return `
                <div class="cli-card" onclick="viewCLIDetails(${cli.cli_id})" style="position: relative; ${inactiveStyle}">
                    ${inactiveBadge}
                    <div class="cli-card-header">
                        <div>
                            <div class="cli-cmsid">${cli.cmsid || 'N/A'}</div>
                            <div class="cli-name">${cli.cli_name}</div>
                            <div class="cli-office">🏢 ${cli.office_name || cli.current_office_code || 'N/A'}</div>
                            <div class="cli-office" style="margin-top: 4px; color: #2563eb;">⏱️ ${cliSince}</div>
                        </div>
                    </div>
                    <div class="staff-count">
                        <div class="number">${cli.active_staff_count || 0}</div>
                        <div class="label">Active Staff</div>
                    </div>
                    <div class="cli-actions">
                        <button class="btn btn-secondary" onclick="event.stopPropagation(); editCLI(${cli.cli_id})">✏️ Edit</button>
                        <button class="btn btn-primary" onclick="event.stopPropagation(); viewCLIDetails(${cli.cli_id})">👁️ View</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Filter CLIs
        function filterCLIs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const office = document.getElementById('officeFilter').value;

            const filtered = allCLIs.filter(cli => {
                const matchesSearch = !search ||
                    cli.cli_name.toLowerCase().includes(search) ||
                    (cli.cmsid && cli.cmsid.toLowerCase().includes(search));
                const matchesOffice = !office || cli.current_office_code === office;
                return matchesSearch && matchesOffice;
            });

            renderCLIs(filtered);
        }

        // Generate crosstab table rows
        function generateCrosstabRows(crossTab) {
            const grouped = {};
            crossTab.forEach(row => {
                if (!grouped[row.designation_name]) {
                    grouped[row.designation_name] = { A: 0, B: 0, C: 0 };
                }
                grouped[row.designation_name][row.safety_category] = row.count;
            });

            return Object.entries(grouped).map(([desig, counts]) => `
                <tr>
                    <td>${desig}</td>
                    <td>${counts.A || 0}</td>
                    <td>${counts.B || 0}</td>
                    <td>${counts.C || 0}</td>
                    <td><strong>${(counts.A || 0) + (counts.B || 0) + (counts.C || 0)}</strong></td>
                </tr>
            `).join('');
        }

        // Save CLI (Add or Update)
        async function saveCLI() {
            const cliId = document.getElementById('cli_id').value;
            const data = {
                cmsid: document.getElementById('cmsid').value,
                cli_name: document.getElementById('cli_name').value,
                current_office_code: document.getElementById('current_office_code').value,
                cli_dob: document.getElementById('cli_dob').value || null,
                cli_doa: document.getElementById('cli_doa').value || null,

                cli_mobile: document.getElementById('cli_mobile').value || null
            };

            try {
                const url = cliId ? `/api/division/cli/${cliId}` : '/api/division/cli';
                const method = cliId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message || 'CLI saved successfully');

                    loadCLIs();
                } else {
                    alert(result.error || 'Failed to save CLI');

                console.error('Error saving CLI:', error);
                alert('Failed to save CLI');

        // Utility functions
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-GB');
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // ========== CLI NOMINATION FUNCTIONS ==========

        let currentCLIForNomination = null;
        let availableStaff = { withoutCLI: [], withCLI: [] };
        let selectedStaffIds = new Set();
        let currentNominationId = null;

        // Open nominate modal
        async function openNominateModal(cliId, cliName) {
            currentCLIForNomination = { id: cliId, name: cliName };
            selectedStaffIds.clear();

            document.getElementById('nominateTitle').textContent = `Nominate Staff to: ${cliName}`;
            document.getElementById('nominationStartDate').valueAsDate = new Date();
            document.getElementById('nominationRemarks').value = '';
            document.getElementById('staffSearchInput').value = '';

            openModal('nominateModal');
            await loadAvailableStaff(cliId);
        }

        function closeNominateModal() {
            closeModal('nominateModal');
            selectedStaffIds.clear();
        }

        // Load available staff for nomination
        async function loadAvailableStaff(cliId) {
            try {
                document.getElementById('staffListLoading').style.display = 'block';
                document.getElementById('staffListContent').innerHTML = '';

                const response = await fetch(`/api/division/cli/available-staff?exclude_cli_id=${cliId}`);
                const result = await response.json();

                if (result.success) {
                    availableStaff = result.data;
                    document.getElementById('withoutCLICount').textContent = availableStaff.withoutCLI.length;
                    document.getElementById('withCLICount').textContent = availableStaff.withCLI.length;
                    renderAvailableStaff();
                }

                document.getElementById('staffListLoading').style.display = 'none';
            } catch (error) {
                console.error('Error loading available staff:', error);
                document.getElementById('staffListLoading').innerHTML = '<p style="color: #ef4444;">Failed to load staff</p>';
            }
        }

        // Render staff list with checkboxes
        function renderAvailableStaff() {
            const searchTerm = document.getElementById('staffSearchInput').value.toLowerCase();
            const showWithoutCLI = document.getElementById('showWithoutCLI').checked;
            const showWithCLI = document.getElementById('showWithCLI').checked;

            let staffToShow = [];

            if (showWithoutCLI) {
                staffToShow = staffToShow.concat(availableStaff.withoutCLI);
            }
            if (showWithCLI) {
                staffToShow = staffToShow.concat(availableStaff.withCLI);
            }

            if (searchTerm) {
                staffToShow = staffToShow.filter(s =>
                    s.name.toLowerCase().includes(searchTerm) ||
                    s.hrms_id.toLowerCase().includes(searchTerm)
                );
            }

            const content = document.getElementById('staffListContent');

            if (staffToShow.length === 0) {
                content.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 20px;">No staff available</p>';
                return;
            }

            content.innerHTML = staffToShow.map(staff => `
                <label style="display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #f3f4f6; cursor: pointer; transition: background 0.2s;"
                       onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='white'"
                       onclick="toggleStaffSelection('${staff.hrms_id}')">
                    <input type="checkbox"
                           id="staff_${staff.hrms_id}"
                           ${selectedStaffIds.has(staff.hrms_id) ? 'checked' : ''}
                           style="margin-right: 12px; width: 18px; height: 18px; cursor: pointer;">
                    <div style="flex: 1;">
                        <div style="font-weight: 500; color: #1f2937;">${staff.name}</div>
                        <div style="font-size: 12px; color: #6b7280;">
                            ${staff.hrms_id} • ${staff.office_name || 'N/A'} • ${staff.designation_name || 'N/A'}
                            ${staff.current_cli_name ? `<br>Current CLI: <strong>${staff.current_cli_name}</strong>` : '<br><span style="color: #f59e0b;">⚠️ No CLI assigned</span>'}
                        </div>
                    </div>
                </label>
            `).join('');

            updateSelectedCount();
        }

        function filterNominationStaff() {
            renderAvailableStaff();
        }

        function toggleStaffSelection(hrmsId) {
            if (selectedStaffIds.has(hrmsId)) {
                selectedStaffIds.delete(hrmsId);
            } else {
                selectedStaffIds.add(hrmsId);
            }
            updateSelectedCount();
            // Update checkbox state
            const checkbox = document.getElementById(`staff_${hrmsId}`);
            if (checkbox) {
                checkbox.checked = selectedStaffIds.has(hrmsId);
            }
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedStaffIds.size;
            document.getElementById('nominateBtn').disabled = selectedStaffIds.size === 0;
        }

        // Submit nomination
        async function submitNomination() {
            if (selectedStaffIds.size === 0) {
                alert('Please select at least one staff member');
                return;
            }

            const startDate = document.getElementById('nominationStartDate').value;
            if (!startDate) {
                alert('Please select start date');
                return;
            }

            const btn = document.getElementById('nominateBtn');
            btn.disabled = true;
            btn.textContent = 'Nominating...';

            try {
                const response = await fetch(`/api/division/cli/${currentCLIForNomination.id}/nominate-bulk`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        staff_hrms_ids: Array.from(selectedStaffIds),
                        nominated_from_date: startDate,
                        remarks: document.getElementById('nominationRemarks').value || null
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`Successfully nominated ${result.results.length} staff member(s) to ${currentCLIForNomination.name}`);
                    closeNominateModal();
                    // Refresh CLI details if modal is open
                    if (document.getElementById('detailsModal').classList.contains('active')) {
                        viewCLIDetails(currentCLIForNomination.id);
                    }
                } else {
                    alert(result.error || 'Failed to nominate staff');
                }
            } catch (error) {
                console.error('Error nominating staff:', error);
                alert('Failed to nominate staff');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Nominate Selected';
            }
        }

        function openChangeCLIModal(nominationId, staffName, staffHRMS, currentCLIName) {
            currentNominationId = nominationId;

            document.getElementById('changeStaffName').textContent = staffName;
            document.getElementById('changeStaffHRMS').textContent = staffHRMS;
            document.getElementById('changeCurrentCLI').textContent = currentCLIName;
            document.getElementById('changeEffectiveDate').valueAsDate = new Date();
            document.getElementById('changeRemarks').value = '';

            // Load CLIs into dropdown
            const select = document.getElementById('newCLISelect');
            select.innerHTML = '<option value="">Select new CLI</option>';
            allCLIs.forEach(cli => {
                if (cli.cli_name !== currentCLIName) {
                    select.innerHTML += `<option value="${cli.cli_id}">${cli.cli_name} (${cli.cmsid})</option>`;
                }
            });

            openModal('changeCLIModal');
        }

        // Submit CLI change
        async function submitCLIChange() {
            const newCLIId = document.getElementById('newCLISelect').value;
            const effectiveDate = document.getElementById('changeEffectiveDate').value;

            if (!newCLIId) {
                alert('Please select new CLI');
                return;
            }

            if (!effectiveDate) {
                alert('Please select effective date');
                return;
            }

            try {
                const response = await fetch(`/api/division/cli/nomination/${currentNominationId}/change`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        new_cli_id: newCLIId,
                        nominated_from_date: effectiveDate,
                        remarks: document.getElementById('changeRemarks').value || null
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    closeModal('changeCLIModal');
                    // Refresh staff modal
                    closeModal('staffModal');
                    closeModal('detailsModal');
                    loadCLIs();
                } else {
                    alert(result.error || 'Failed to change CLI');
                }
            } catch (error) {
                console.error('Error changing CLI:', error);
                alert('Failed to change CLI');
            }
        }

        function openDeactivateModal(cliId, cliName) {
            currentCLIForDeactivate = { id: cliId, name: cliName };
            document.getElementById('deactivateCLIId').value = cliId;
            document.getElementById('deactivateCLIName').textContent = cliName;
            document.getElementById('inactiveReason').value = '';
            document.getElementById('inactiveDate').valueAsDate = new Date();
            openModal('deactivateModal');
        }

        async function confirmDeactivateCLI() {
            const cliId = document.getElementById('deactivateCLIId').value;
            const reason = document.getElementById('inactiveReason').value;
            const date = document.getElementById('inactiveDate').value;

            if (!reason) {
                alert('Please select a reason for deactivation');
                return;
            }

            if (!confirm(`Are you sure you want to deactivate ${currentCLIForDeactivate.name}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/division/cli/${cliId}/deactivate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inactive_reason: reason,
                        inactive_date: date
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    closeModal('deactivateModal');
                    closeModal('detailsModal');
                    loadCLIs();
                } else {
                    alert(result.error || 'Failed to deactivate CLI');
                }
            } catch (error) {
                console.error('Error deactivating CLI:', error);
                alert('Failed to deactivate CLI');
            }
        }

        async function reactivateCLI(cliId, cliName) {
            if (!confirm(`Are you sure you want to reactivate ${cliName}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/division/cli/${cliId}/reactivate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    closeModal('detailsModal');
                    loadCLIs();
                } else {
                    alert(result.error || 'Failed to reactivate CLI');
                }
            } catch (error) {
                console.error('Error reactivating CLI:', error);
                alert('Failed to reactivate CLI');
            }
        }

        // ========== OFFICE HISTORY FUNCTIONS ==========

        let currentCLIForHistory = null;

        async function openOfficeHistoryModal(cliId, cliName) {
            currentCLIForHistory = { id: cliId, name: cliName };
            document.getElementById('officeHistoryCLIName').textContent = cliName;
            document.getElementById('officeHistoryCLIId').value = cliId;

            await loadOfficeHistory(cliId);
            openModal('officeHistoryModal');
        }

        async function loadOfficeHistory(cliId) {
            try {
                const response = await fetch(`/api/division/cli/${cliId}/office-history`);
                const data = await response.json();

                const listDiv = document.getElementById('officeHistoryList');

                if (!data.history || data.history.length === 0) {
                    listDiv.innerHTML = '<p style="color: #6b7280; text-align: center; padding: 20px;">No office history records found.</p>';
                    return;
                }

                listDiv.innerHTML = `
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: #f3f4f6;">
                                <th style="padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb;">Office</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb;">From</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb;">To</th>
                                <th style="padding: 10px; text-align: center; border-bottom: 1px solid #e5e7eb;">Status</th>
                                <th style="padding: 10px; text-align: center; border-bottom: 1px solid #e5e7eb;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.history.map(h => `
                                <tr>
                                    <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">
                                        <strong>${h.office_code}</strong>
                                        ${h.office_name ? `<br><span style="font-size: 12px; color: #6b7280;">${h.office_name}</span>` : ''}
                                    </td>
                                    <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">${formatDate(h.from_date)}</td>
                                    <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">${h.to_date ? formatDate(h.to_date) : '-'}</td>
                                    <td style="padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: center;">
                                        ${h.is_current ? '<span style="background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 12px; font-size: 12px;">Current</span>' : ''}
                                    </td>
                                    <td style="padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: center;">
                                        <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="editOfficeHistory(${h.id})">Edit</button>
                                        <button class="btn" style="padding: 4px 8px; font-size: 12px; background: #fecaca; color: #991b1b;" onclick="deleteOfficeHistory(${h.id})">Del</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error loading office history:', error);
                document.getElementById('officeHistoryList').innerHTML = '<p style="color: #dc2626;">Error loading office history</p>';
            }
        }

        function openAddOfficeHistoryModal() {
            document.getElementById('addOfficeHistoryTitle').textContent = 'Add Office Posting';
            document.getElementById('officeHistoryId').value = '';
            document.getElementById('historyOfficeCode').value = '';
            document.getElementById('historyFromDate').value = '';
            document.getElementById('historyToDate').value = '';
            document.getElementById('historyIsCurrent').checked = false;
            document.getElementById('historyRemarks').value = '';

            // Populate office dropdown
            const select = document.getElementById('historyOfficeCode');
            select.innerHTML = '<option value="">Select Office</option>';
            allOffices.forEach(o => {
                select.innerHTML += `<option value="${o.office_code}">${o.office_code} - ${o.office_name}</option>`;
            });

            openModal('addOfficeHistoryModal');
        }

        async function editOfficeHistory(historyId) {
            try {
                const response = await fetch(`/api/division/cli/${currentCLIForHistory.id}/office-history`);
                const data = await response.json();
                const record = data.history.find(h => h.id === historyId);

                if (!record) {
                    alert('Record not found');
                    return;
                }

                document.getElementById('addOfficeHistoryTitle').textContent = 'Edit Office Posting';
                document.getElementById('officeHistoryId').value = historyId;

                // Populate office dropdown
                const select = document.getElementById('historyOfficeCode');
                select.innerHTML = '<option value="">Select Office</option>';
                allOffices.forEach(o => {
                    select.innerHTML += `<option value="${o.office_code}">${o.office_code} - ${o.office_name}</option>`;
                });

                document.getElementById('historyOfficeCode').value = record.office_code;
                document.getElementById('historyFromDate').value = record.from_date ? record.from_date.split('T')[0] : '';
                document.getElementById('historyToDate').value = record.to_date ? record.to_date.split('T')[0] : '';
                document.getElementById('historyIsCurrent').checked = record.is_current;
                document.getElementById('historyRemarks').value = record.remarks || '';

                openModal('addOfficeHistoryModal');
            } catch (error) {
                console.error('Error loading record:', error);
                alert('Failed to load record');
            }
        }

        async function saveOfficeHistory() {
            const historyId = document.getElementById('officeHistoryId').value;
            const cliId = currentCLIForHistory.id;
            const data = {
                office_code: document.getElementById('historyOfficeCode').value,
                from_date: document.getElementById('historyFromDate').value || null,
                to_date: document.getElementById('historyToDate').value || null,
                is_current: document.getElementById('historyIsCurrent').checked,
                remarks: document.getElementById('historyRemarks').value || null
            };

            if (!data.office_code) {
                alert('Office is required');
                return;
            }

            try {
                const url = historyId
                    ? `/api/division/cli/office-history/${historyId}`
                    : `/api/division/cli/${cliId}/office-history`;
                const method = historyId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    closeModal('addOfficeHistoryModal');
                    loadOfficeHistory(cliId);
                    loadCLIs(); // Refresh in case current_office_code changed
                } else {
                    alert(result.error || 'Failed to save');
                }
            } catch (error) {
                console.error('Error saving:', error);
                alert('Failed to save');
            }
        }

        async function deleteOfficeHistory(historyId) {
            if (!confirm('Are you sure you want to delete this office posting?')) {
                return;
            }

            try {
                const response = await fetch(`/api/division/cli/office-history/${historyId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    loadOfficeHistory(currentCLIForHistory.id);
                } else {
                    alert(result.error || 'Failed to delete');
                }
            } catch (error) {
                console.error('Error deleting:', error);
                alert('Failed to delete');
            }
        }

        // Initialize
        loadCLIs();
        loadOffices();
    </script>
</body>
</html>
