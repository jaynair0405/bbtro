<style>
:root{
  --bg:#0b0e14;--bg2:#0e1219;--panel:#141922;--panel2:#1a2029;--line:#232b37;--line2:#2c3745;
  --ink:#e8edf4;--ink2:#aeb9c8;--ink3:#6b7686;--amber:#f4a533;
  --single:#5aa9e6;--double:#f4a533;--triple:#e56a86;--cont:#4fd1a5;--fix:#b98cff;--memu:#57b6ff;
  --fast:#e56a86;--semi:#f4a533;--slow:#5aa9e6;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75);
  --mono:'Space Mono',ui-monospace,monospace;--disp:'Bricolage Grotesque',sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(1200px 640px at 82% -12%,rgba(244,165,51,.09),transparent 60%),radial-gradient(900px 700px at 2% 112%,rgba(87,182,255,.06),transparent 55%);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.11;mask-image:radial-gradient(circle at 60% 30%,#000 22%,transparent 80%);}
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 300px 1fr;height:100vh}

/* app shell sidebar */
.side{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .kick{font:700 9px/1 var(--mono);letter-spacing:.3em;color:var(--amber);text-transform:uppercase}
.brand h1{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.02em;margin-top:8px}
.brand h1 em{font-style:normal;color:var(--amber)}
.nav{flex:1;overflow-y:auto;padding:14px 10px}
.ngroup{font:700 9px var(--mono);letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;margin:16px 10px 6px}
.item{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;margin:2px 0;border-radius:11px;cursor:pointer;color:var(--ink2);text-decoration:none;transition:.16s}
.item:hover{background:var(--panel);color:var(--ink)}
.item.on{background:linear-gradient(90deg,rgba(244,165,51,.15),rgba(244,165,51,.02));color:var(--ink)}
.item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--amber)}
.item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}.item.on svg{stroke:var(--amber)}
.item b{flex:1;font-size:13.5px;font-weight:600}.item .b{font:700 9px var(--mono);color:var(--ink3);padding:2px 6px;border:1px solid var(--line2);border-radius:20px}
.item.soon{opacity:.5}

/* report picker column */
.picker{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:18px 14px}
.picker h2{font-family:var(--disp);font-weight:700;font-size:20px;margin:2px 8px 4px}
.picker .pd{font-size:12px;color:var(--ink3);margin:0 8px 16px}
.pgroup{font:700 9px var(--mono);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;margin:16px 8px 7px}
.rep{padding:11px 13px;margin:3px 0;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.15s}
.rep:hover{background:var(--panel)}
.rep.on{background:var(--panel);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--amber)}
.rep b{display:block;font-size:13.5px;font-weight:600}
.rep span{display:block;font:400 10.5px/1.4 var(--body);color:var(--ink3);margin-top:2px}

/* report body */
.body{overflow-y:auto}
.rhead{position:sticky;top:0;z-index:6;backdrop-filter:blur(14px);background:rgba(11,14,20,.85);border-bottom:1px solid var(--line);padding:20px 30px 16px}
.rhead h3{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:-.02em}
.rhead p{color:var(--ink3);font-size:12.5px;margin-top:4px}
.controls{display:flex;align-items:center;gap:12px;margin-top:15px;flex-wrap:wrap}
.fl{display:flex;align-items:center;gap:7px}
.fl label{font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.fl select{font:600 12px var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;cursor:pointer}
.spacer{flex:1}
.sum{font:600 11px var(--mono);color:var(--ink2);display:flex;gap:16px}
.sum b{color:var(--amber)}
.exp{display:flex;align-items:center;gap:8px;font:700 11px var(--mono);letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 13px;cursor:pointer;transition:.16s}
.exp:hover{border-color:var(--amber);color:var(--amber)}
.exp svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

.tblwrap{padding:20px 30px 90px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:113px;background:var(--bg);font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:11px 12px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap;z-index:3}
thead th:hover{color:var(--ink)}
thead th.r{text-align:right}thead th.c{text-align:center}
thead th .ar{opacity:0;margin-left:5px;color:var(--amber)}
thead th.sorted .ar{opacity:1}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
tbody tr:hover{background:var(--panel)}
td.r{text-align:right}td.c{text-align:center}
td.mono,.m{font-family:var(--mono);font-weight:700}
.dn{font-family:var(--disp);font-weight:800;font-size:16px}
.pill{font:700 9px var(--mono);letter-spacing:.08em;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.pill.single{background:rgba(90,169,230,.13);color:var(--single)}.pill.double{background:rgba(244,165,51,.13);color:var(--double)}.pill.triple{background:rgba(229,106,134,.13);color:var(--triple)}
.pill.FAST{background:rgba(229,106,134,.14);color:var(--fast)}.pill.SEMI_FAST{background:rgba(244,165,51,.14);color:var(--semi)}.pill.SLOW{background:rgba(90,169,230,.14);color:var(--slow)}.pill.EMPTY_RAKE{background:rgba(107,118,134,.16);color:var(--ink3)}
.pill.continuous{background:rgba(79,209,165,.13);color:var(--cont)}.pill.fix{background:rgba(185,140,255,.13);color:var(--fix)}.pill.memu{background:rgba(87,182,255,.13);color:var(--memu)}
.pill.AC{background:rgba(87,182,255,.14);color:var(--memu)}
.restcell{font-family:var(--mono);font-weight:700}
.restcell.warn{color:var(--triple)}.restcell.key{color:var(--amber)}
.bararr{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-family:var(--mono);font-size:11px}
.bararr .s{color:var(--ink)}
.dir{font:700 9px var(--mono);padding:2px 7px;border-radius:5px}
.dir.FROM{background:rgba(79,209,165,.13);color:var(--cont)}.dir.TO{background:rgba(244,165,51,.13);color:var(--amber)}
.nd{position:relative}.nd .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(229,106,134,.12);border-radius:4px;z-index:0}.nd span{position:relative;z-index:1}
</style>
</head>

const OFF={'CSMT-SUB':'CSMT','KYN-SUB':'KYN','PNVL-SUB':'PNVL'};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtHM=m=>{if(m==null)return'';const h=Math.floor(m/60),mm=m%60;return h+':'+String(mm).padStart(2,'0');};
// Rolling links work the next detail the NEXT day, so rest = 24h + (nextOn - thisOff).
// (Evening->morning doubles fall out short ~5-6h; single->single turnarounds ~24h.)
const restBetween=(off,son)=>1440+son-off;
function nightMins(son,soff){let a=toMin(son),b=toMin(soff);if(a==null||b==null)return 0;if(b<=a)b+=1440;let s=0;
  for(const k of[-1,0,1]){const ws=1320+k*1440,we=1800+k*1440;s+=Math.max(0,Math.min(b,we)-Math.max(a,ws));}return s;}

  document.querySelectorAll('.rep').forEach(el=>el.onclick=()=>{cur=REPORTS.find(r=>r.id===el.dataset.id);filters={};sortKey=null;render();});

function renderControls(){
  const ctl=document.getElementById('ctl');

let CURRENT={cols:[],rows:[]};
function fmtCell(c,v){
  if(v==null||v==='')return'<span style="color:var(--ink3)">–</span>';
  if(c.dn)return`<span class="dn">${v}</span>`;
  if(c.pill)return`<span class="pill ${v}">${String(v).replace('_',' ')}</span>`;
  if(c.dir)return`<span class="dir ${v}">${v}</span>`;
  if(c.rest){const cls=c.key?'key':(v<300||v>16*60?'warn':'');return`<span class="restcell ${cls}">${fmtHM(v)}</span>`;}
  if(c.hm)return`<span class="m">${fmtHM(v)}</span>`;
  if(c.ndhbar){const w=Math.min(100,v/480*100);return`<span class="nd"><span class="bar" style="width:${w}%"></span><span class="m">${fmtHM(v)}</span></span>`;}
  if(c.m)return`<span class="m">${v}</span>`;
  return v;
}

    return (x<y?-1:x>y?1:0)*(sortDir==='asc'?1:-1);});
  document.getElementById('thead').innerHTML='<tr>'+out.cols.map(c=>
    `<th class="${c.r?'r':c.c?'c':''} ${c.k===sortKey?'sorted':''}" data-k="${c.k}">${c.l}<span class="ar">${sortDir==='asc'?'▲':'▼'}</span></th>`).join('')+'</tr>';
  document.querySelectorAll('thead th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
    if(sortKey===k)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=k;sortDir='asc';}render();});
  document.getElementById('tbody').innerHTML=out.rows.map(r=>'<tr>'+out.cols.map(c=>
    `<td class="${c.r?'r':c.c?'c':''}">${fmtCell(c,r[c.k])}</td>`).join('')+'</tr>').join('');
  document.getElementById('sum').innerHTML=out.sum||'';
}
function exportCSV(){
  const{cols,rows}=CURRENT;
  const head=cols.map(c=>c.l).join(',');
  const body=rows.map(r=>cols.map(c=>{let v=r[c.k];if((c.hm||c.rest||c.ndhbar)&&typeof v==='number')v=fmtHM(v);return `"${String(v==null?'':v).replace(/"/g,'""')}"`;}).join(',')).join('\n');
  const blob=new Blob([head+'\n'+body],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=cur.id+'.csv';a.click();
}
render();
</script>
