<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Shed inspection print</title><link rel="stylesheet" href="/div/css/trip-shed.css"><style>
body{background:#fff;color:#111}.print-wrap{max-width:1100px;margin:0 auto;padding:18px}.print-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}.print-title{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}.print-title h1{font-size:20px;margin:0 0 4px}.print-title p{margin:2px 0;font-size:12px}.print-meta{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #111;margin-bottom:12px}.print-meta div{padding:6px 8px;border-right:1px solid #111;border-bottom:1px solid #111;font-size:11px}.print-meta div:nth-child(4n){border-right:0}.print-meta b{display:block;font-size:9px;text-transform:uppercase;color:#555;margin-bottom:2px}.print-table{font-size:10px}.print-table th,.print-table td{border:1px solid #111;padding:5px}.print-table th{background:#eee;color:#111}.print-table .section td{font-weight:bold;background:#e6edf3}.print-footer{margin-top:18px;display:flex;justify-content:space-between;font-size:11px}.error{padding:20px;border:1px solid #c33;color:#900}@media print{.print-actions{display:none}.print-wrap{padding:0;max-width:none}.top{display:none}.print-table{font-size:9px}body{font-family:Arial,"Noto Sans Devanagari",sans-serif}@page{size:A4 portrait;margin:10mm}}@media(max-width:760px){.print-meta{grid-template-columns:repeat(2,1fr)}.print-meta div:nth-child(4n){border-right:1px solid #111}.print-meta div:nth-child(2n){border-right:0}}
</style></head><body><main class="print-wrap"><div class="print-actions"><button class="btn" id="printBtn">Print / Save PDF</button><button class="btn" onclick="window.close()">Close</button></div><div id="app">Loading finalized inspection…</div></main><script>
const API='/api/division/trip-shed',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=(o,k)=>o[k]==null||o[k]===''?'—':esc(o[k]);
function render(d){const i=d.inspection;let last=null;const rows=d.items.map(x=>{const section=x.section_name!==last?(last=x.section_name,`<tr class="section"><td colspan="6">${esc(last||'Checklist')}</td></tr>`):'';return section+`<tr><td>${val(x,'item_no')}</td><td>${val(x,'label_en')}${x.label_hi?'<br><small>'+esc(x.label_hi)+'</small>':''}</td><td>${val(x,'standard_value')}</td><td>${val(x,'outcome')}</td><td>${val(x,'observed_value')}</td><td>${x.is_required?'Required':'Reference'}</td></tr>`}).join('');document.getElementById('app').innerHTML=`<div class="print-title"><h1>${esc(d.shed.shed_name||'VVH Trip Shed')}</h1><p>TRIP INSPECTION PROFORMA · ${esc(i.inspection_type||'')} · ${esc(i.template_title||'')}</p><p>Finalized inspection #${esc(i.id)} · ${val(i,'finalized_at')}</p></div><div class="print-meta"><div><b>Date</b>${val(i,'inspection_date')}</div><div><b>Shift</b>${val(i,'shift_code')}</div><div><b>Loco number</b>${val(i,'loco_number')}</div><div><b>Loco type</b>${val(i,'loco_type')}</div><div><b>Loco base</b>${val(i,'loco_base')}</div><div><b>Train no.</b>${val(i,'train_no')}</div><div><b>Incoming train</b>${val(i,'incoming_train_no')}</div><div><b>Cab leading</b>${val(i,'cab_leading')}</div><div><b>Kms reading</b>${val(i,'kms_reading')}</div><div><b>Technician</b>${val(i,'technician_name')}</div><div><b>Supervisor</b>${val(i,'supervisor_name')}</div><div><b>Energy consumed (KWH)</b>${val(i,'energy_consumed_kwh')}</div><div><b>Traction converter</b>${val(i,'traction_converter_make')}</div><div><b>Auxiliary converter</b>${val(i,'auxiliary_converter_make')}</div><div><b>Brake system</b>${val(i,'brake_system_make')}</div><div><b>HLC / SPM</b>${val(i,'hlc_make')} / ${val(i,'spm_make')}</div><div><b>RTIS</b>${val(i,'rtis_status')}</div><div><b>RTIS remarks</b>${val(i,'rtis_remarks')}</div><div style="grid-column:1/-1"><b>General remarks</b>${val(i,'general_remarks')}</div></div><table class="print-table"><thead><tr><th style="width:6%">Item</th><th style="width:42%">Check / जाँच</th><th style="width:20%">Standard</th><th style="width:12%">Outcome</th><th style="width:15%">Observation</th><th style="width:5%">Class</th></tr></thead><tbody>${rows}</tbody></table><div class="print-footer"><span>Generated from finalized Trip Shed record #${esc(i.id)}</span><span>Signature: ____________________</span></div>`}
document.getElementById('printBtn').onclick=()=>window.print();(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!/^\d+$/.test(id||''))throw Error('A finalized inspection ID is required');const r=await fetch(API+'/inspections/'+id+'/print');const d=await r.json();if(!r.ok)throw Error(d.error||'Print view unavailable');render(d)}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}})();
</script></body></html>
