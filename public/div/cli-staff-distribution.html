<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLI Staff Distribution - Division Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --brand: #059669;
      --cat-a: #059669;
      --cat-b: #d97706;
      --cat-c: #dc2626;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Manrope', system-ui, sans-serif;
      background: #f1f5f9;
      color: var(--text);
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--brand);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
    }

    .tab-switcher {
      display: inline-flex;
      background: #fff;
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--brand);
      color: #fff;
    }

    /* Table Container */
    .table-container {
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    th, td {
      padding: 8px 6px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    /* Header styles */
    thead tr:first-child th {
      background: #fbbf24;
      color: #78350f;
      font-weight: 700;
      font-size: 0.9rem;
    }

    thead tr:nth-child(2) th {
      background: #fef3c7;
      color: #92400e;
      font-weight: 600;
      font-size: 0.75rem;
    }

    /* Category header colors */
    th.cat-a { background: #d1fae5 !important; color: #065f46 !important; }
    th.cat-b { background: #fef3c7 !important; color: #92400e !important; }
    th.cat-c { background: #fee2e2 !important; color: #991b1b !important; }
    th.total-col { background: #e0e7ff !important; color: #3730a3 !important; }

    /* Data rows */
    tbody tr:nth-child(odd) { background: #fafafa; }
    tbody tr:hover { background: #f0fdf4; }

    td.cli-name {
      text-align: left;
      font-weight: 600;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.hq {
      font-weight: 600;
      color: var(--brand);
    }

    td.total-col {
      background: #f0f9ff;
      font-weight: 700;
    }

    td.grand-total {
      background: #fef3c7;
      font-weight: 700;
      color: #92400e;
    }

    td.net-col {
      background: #ecfdf5;
      font-weight: 700;
      color: #065f46;
    }

    /* Editable LPS cell for Suburban */
    td.editable input {
      width: 40px;
      padding: 4px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    td.editable input:focus {
      outline: none;
      border-color: var(--brand);
    }

    /* Footer totals */
    tfoot tr {
      background: #1e293b !important;
      color: #fff;
      font-weight: 700;
    }

    tfoot td {
      border-color: #334155;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Print */
    @media print {
      body { background: #fff; }
      .header-actions { display: none; }
      .page { padding: 10px; max-width: 100%; }
      .table-container { border: none; }
      table { font-size: 9pt; }
      th, td { padding: 4px 3px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1><i class="fa-solid fa-clipboard-list"></i> CLI Staff Distribution</h1>
      <div class="header-actions">
        <div class="tab-switcher">
          <button class="tab-btn active" data-type="MAINLINE">Main Line</button>
          <button class="tab-btn" data-type="SUBURBAN">Suburban</button>
        </div>
        <button class="btn btn-back" onclick="window.print()">
          <i class="fa-solid fa-print"></i> Print
        </button>
        <button class="btn btn-primary" onclick="exportExcel()">
          <i class="fa-solid fa-file-excel"></i> Excel
        </button>
        <button class="btn btn-back" onclick="window.location.href='/div/cli-load.html'">
          <i class="fa-solid fa-arrow-left"></i> Back to CLI Load
        </button>
      </div>
    </header>

    <div class="table-container">
      <div class="table-wrapper">
        <!-- Main Line Table -->
        <table id="mainlineTable">
          <thead>
            <tr>
              <th rowspan="2">SR</th>
              <th rowspan="2">CLI</th>
              <th rowspan="2">HQ</th>
              <th colspan="4">LP GOODS</th>
              <th colspan="4">LPP</th>
              <th colspan="4">LPM</th>
              <th colspan="4">LP GHAT</th>
              <th rowspan="2" class="total-col">Total<br>LP</th>
              <th rowspan="2" class="total-col">STR<br>(LPS)</th>
              <th rowspan="2" class="total-col">ALP</th>
              <th rowspan="2" class="total-col">STR+<br>ALP</th>
              <th rowspan="2" class="total-col">GRAND<br>TOTAL</th>
              <th rowspan="2" class="total-col">NET</th>
            </tr>
            <tr>
              <th class="cat-a">A</th>
              <th class="cat-b">B</th>
              <th class="cat-c">C</th>
              <th class="total-col">Tot</th>
              <th class="cat-a">A</th>
              <th class="cat-b">B</th>
              <th class="cat-c">C</th>
              <th class="total-col">Tot</th>
              <th class="cat-a">A</th>
              <th class="cat-b">B</th>
              <th class="cat-c">C</th>
              <th class="total-col">Tot</th>
              <th class="cat-a">A</th>
              <th class="cat-b">B</th>
              <th class="cat-c">C</th>
              <th class="total-col">Tot</th>
            </tr>
          </thead>
          <tbody id="mainlineBody">
            <tr><td colspan="25" class="loading"><div class="spinner"></div>Loading...</td></tr>
          </tbody>
          <tfoot id="mainlineFoot"></tfoot>
        </table>

        <!-- Suburban Table (hidden by default) -->
        <table id="suburbanTable" style="display:none;">
          <thead>
            <tr>
              <th rowspan="2">SR</th>
              <th rowspan="2">CLI</th>
              <th rowspan="2">HQ</th>
              <th colspan="4">MOTORMAN</th>
              <th rowspan="2" class="total-col">LPS<br>(Manual)</th>
              <th rowspan="2" class="total-col">GRAND<br>TOTAL</th>
            </tr>
            <tr>
              <th class="cat-a">A</th>
              <th class="cat-b">B</th>
              <th class="cat-c">C</th>
              <th class="total-col">Total</th>
            </tr>
          </thead>
          <tbody id="suburbanBody">
            <tr><td colspan="9" class="loading"><div class="spinner"></div>Loading...</td></tr>
          </tbody>
          <tfoot id="suburbanFoot"></tfoot>
        </table>
      </div>
    </div>
  </div>

  <script>
    const state = {
      staffType: 'MAINLINE',
      data: [],
      lpsManual: {} // For suburban manual LPS entries: { cli_id: value }
    };

    // Load from localStorage
    const savedLps = localStorage.getItem('cli_staff_distribution_lps');
    if (savedLps) {
      try { state.lpsManual = JSON.parse(savedLps); } catch(e) {}
    }

    async function loadData() {
      const isMainline = state.staffType === 'MAINLINE';
      const tbody = document.getElementById(isMainline ? 'mainlineBody' : 'suburbanBody');
      const tfoot = document.getElementById(isMainline ? 'mainlineFoot' : 'suburbanFoot');

      tbody.innerHTML = `<tr><td colspan="${isMainline ? 24 : 9}" class="loading"><div class="spinner"></div>Loading...</td></tr>`;
      tfoot.innerHTML = '';

      try {
        const res = await fetch(`/api/division/category/cli-monitoring?staff_type=${state.staffType}`);
        const result = await res.json();
        if (!result.success) throw new Error(result.error);

        state.data = result.data || [];
        renderTable();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="${isMainline ? 24 : 9}" style="text-align:center;color:#dc2626;padding:40px;">Failed to load data</td></tr>`;
      }
    }

    function renderTable() {
      if (state.staffType === 'MAINLINE') {
        renderMainlineTable();
      } else {
        renderSuburbanTable();
      }
    }

    function renderMainlineTable() {
      const tbody = document.getElementById('mainlineBody');
      const tfoot = document.getElementById('mainlineFoot');

      if (state.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="25" style="text-align:center;color:#64748b;padding:40px;">No data found</td></tr>';
        tfoot.innerHTML = '';
        return;
      }

      let totals = {
        lpg_a: 0, lpg_b: 0, lpg_c: 0, lpg_total: 0,
        lpp_a: 0, lpp_b: 0, lpp_c: 0, lpp_total: 0,
        lpm_a: 0, lpm_b: 0, lpm_c: 0, lpm_total: 0,
        ghat_a: 0, ghat_b: 0, ghat_c: 0, ghat_total: 0,
        total_lp: 0, str: 0, alp: 0, str_alp: 0, grand_total: 0, net: 0
      };

      tbody.innerHTML = state.data.map((row, i) => {
        const str = parseInt(row.str) || 0;
        const alp = parseInt(row.alp) || 0;
        const strAlp = str + alp;

        Object.keys(totals).forEach(k => {
          if (k === 'net') totals[k] += parseFloat(row[k]) || 0;
          else if (k === 'str_alp') totals[k] += strAlp;
          else totals[k] += parseInt(row[k]) || 0;
        });

        return `
          <tr>
            <td>${i + 1}</td>
            <td class="cli-name" title="${row.cli_name}">${row.cli_name}</td>
            <td class="hq">${row.hq || '-'}</td>
            <td>${row.lpg_a || 0}</td>
            <td>${row.lpg_b || 0}</td>
            <td>${row.lpg_c || 0}</td>
            <td class="total-col">${row.lpg_total || 0}</td>
            <td>${row.lpp_a || 0}</td>
            <td>${row.lpp_b || 0}</td>
            <td>${row.lpp_c || 0}</td>
            <td class="total-col">${row.lpp_total || 0}</td>
            <td>${row.lpm_a || 0}</td>
            <td>${row.lpm_b || 0}</td>
            <td>${row.lpm_c || 0}</td>
            <td class="total-col">${row.lpm_total || 0}</td>
            <td>${row.ghat_a || 0}</td>
            <td>${row.ghat_b || 0}</td>
            <td>${row.ghat_c || 0}</td>
            <td class="total-col">${row.ghat_total || 0}</td>
            <td class="total-col">${row.total_lp || 0}</td>
            <td class="total-col">${str}</td>
            <td class="total-col">${alp}</td>
            <td class="total-col">${strAlp}</td>
            <td class="grand-total">${row.grand_total || 0}</td>
            <td class="net-col">${(row.net || 0).toFixed(1)}</td>
          </tr>
        `;
      }).join('');

      tfoot.innerHTML = `
        <tr>
          <td colspan="3">TOTAL</td>
          <td>${totals.lpg_a}</td>
          <td>${totals.lpg_b}</td>
          <td>${totals.lpg_c}</td>
          <td>${totals.lpg_total}</td>
          <td>${totals.lpp_a}</td>
          <td>${totals.lpp_b}</td>
          <td>${totals.lpp_c}</td>
          <td>${totals.lpp_total}</td>
          <td>${totals.lpm_a}</td>
          <td>${totals.lpm_b}</td>
          <td>${totals.lpm_c}</td>
          <td>${totals.lpm_total}</td>
          <td>${totals.ghat_a}</td>
          <td>${totals.ghat_b}</td>
          <td>${totals.ghat_c}</td>
          <td>${totals.ghat_total}</td>
          <td>${totals.total_lp}</td>
          <td>${totals.str}</td>
          <td>${totals.alp}</td>
          <td>${totals.str_alp}</td>
          <td>${totals.grand_total}</td>
          <td>${totals.net.toFixed(1)}</td>
        </tr>
      `;
    }

    function renderSuburbanTable() {
      const tbody = document.getElementById('suburbanBody');
      const tfoot = document.getElementById('suburbanFoot');

      if (state.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#64748b;padding:40px;">No data found</td></tr>';
        tfoot.innerHTML = '';
        return;
      }

      let totals = { mm_a: 0, mm_b: 0, mm_c: 0, mm_total: 0, lps: 0, grand_total: 0 };

      tbody.innerHTML = state.data.map((row, i) => {
        const lpsVal = state.lpsManual[row.cli_id] || 0;
        const grandTotal = (row.mm_total || 0) + lpsVal;

        totals.mm_a += parseInt(row.mm_a) || 0;
        totals.mm_b += parseInt(row.mm_b) || 0;
        totals.mm_c += parseInt(row.mm_c) || 0;
        totals.mm_total += parseInt(row.mm_total) || 0;
        totals.lps += lpsVal;
        totals.grand_total += grandTotal;

        return `
          <tr>
            <td>${i + 1}</td>
            <td class="cli-name" title="${row.cli_name}">${row.cli_name}</td>
            <td class="hq">${row.hq || '-'}</td>
            <td>${row.mm_a || 0}</td>
            <td>${row.mm_b || 0}</td>
            <td>${row.mm_c || 0}</td>
            <td class="total-col">${row.mm_total || 0}</td>
            <td class="editable">
              <input type="number" min="0" value="${lpsVal}"
                     onchange="updateLps(${row.cli_id}, this.value)" />
            </td>
            <td class="grand-total" id="grand_${row.cli_id}">${grandTotal}</td>
          </tr>
        `;
      }).join('');

      tfoot.innerHTML = `
        <tr>
          <td colspan="3">TOTAL</td>
          <td>${totals.mm_a}</td>
          <td>${totals.mm_b}</td>
          <td>${totals.mm_c}</td>
          <td>${totals.mm_total}</td>
          <td id="totalLps">${totals.lps}</td>
          <td id="totalGrand">${totals.grand_total}</td>
        </tr>
      `;
    }

    function updateLps(cliId, value) {
      const lpsVal = parseInt(value) || 0;
      state.lpsManual[cliId] = lpsVal;

      // Save to localStorage
      localStorage.setItem('cli_staff_distribution_lps', JSON.stringify(state.lpsManual));

      // Update grand total for this row
      const row = state.data.find(r => r.cli_id === cliId);
      if (row) {
        const grandTotal = (row.mm_total || 0) + lpsVal;
        document.getElementById(`grand_${cliId}`).textContent = grandTotal;
      }

      // Recalculate footer totals
      let totalLps = 0, totalGrand = 0;
      state.data.forEach(r => {
        const lps = state.lpsManual[r.cli_id] || 0;
        totalLps += lps;
        totalGrand += (r.mm_total || 0) + lps;
      });
      document.getElementById('totalLps').textContent = totalLps;
      document.getElementById('totalGrand').textContent = totalGrand;
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.staffType = btn.dataset.type;

        document.getElementById('mainlineTable').style.display = state.staffType === 'MAINLINE' ? '' : 'none';
        document.getElementById('suburbanTable').style.display = state.staffType === 'SUBURBAN' ? '' : 'none';

        loadData();
      });
    });

    // Excel export
    function exportExcel() {
      const isMainline = state.staffType === 'MAINLINE';
      let headers, rows;

      if (isMainline) {
        headers = ['SR', 'CLI', 'HQ', 'LPG_A', 'LPG_B', 'LPG_C', 'LPG_Total', 'LPP_A', 'LPP_B', 'LPP_C', 'LPP_Total', 'LPM_A', 'LPM_B', 'LPM_C', 'LPM_Total', 'GHAT_A', 'GHAT_B', 'GHAT_C', 'GHAT_Total', 'Total_LP', 'STR', 'ALP', 'STR_ALP', 'Grand_Total', 'NET'];
        rows = state.data.map((r, i) => {
          const str = parseInt(r.str) || 0;
          const alp = parseInt(r.alp) || 0;
          return [
            i + 1, r.cli_name, r.hq || '',
            r.lpg_a || 0, r.lpg_b || 0, r.lpg_c || 0, r.lpg_total || 0,
            r.lpp_a || 0, r.lpp_b || 0, r.lpp_c || 0, r.lpp_total || 0,
            r.lpm_a || 0, r.lpm_b || 0, r.lpm_c || 0, r.lpm_total || 0,
            r.ghat_a || 0, r.ghat_b || 0, r.ghat_c || 0, r.ghat_total || 0,
            r.total_lp || 0, str, alp, str + alp, r.grand_total || 0, (r.net || 0).toFixed(1)
          ];
        });
      } else {
        headers = ['SR', 'CLI', 'HQ', 'MM_A', 'MM_B', 'MM_C', 'MM_Total', 'LPS', 'Grand_Total'];
        rows = state.data.map((r, i) => {
          const lps = state.lpsManual[r.cli_id] || 0;
          return [
            i + 1, r.cli_name, r.hq || '',
            r.mm_a || 0, r.mm_b || 0, r.mm_c || 0, r.mm_total || 0,
            lps, (r.mm_total || 0) + lps
          ];
        });
      }

      let csv = headers.join(',') + '\n';
      rows.forEach(r => {
        csv += r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cli_staff_distribution_${state.staffType.toLowerCase()}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Init
    loadData();
  </script>
</body>
</html>
