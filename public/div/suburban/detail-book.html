<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Book — Suburban Crew Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/div/suburban/css/suburban.css">
<style>
/* Detail Book only. Shell tokens, module nav and states come from suburban.css. */
.app{grid-template-columns:272px 288px 1fr}
[data-sub-host]{grid-column:2 / 4}

/* ---------- BLOCK PICKER (office -> link) ---------- */
.picker{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.pickhead{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.pickhead h2{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:.95}
.pickhead h2 em{font-style:normal;color:var(--amber)}
.pickhead .sub{color:var(--ink3);font-size:12px;margin-top:6px;font-weight:500}
.nav2{flex:1;overflow-y:auto;padding:14px 12px 30px}
.nav2::-webkit-scrollbar{width:8px}.nav2::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.office{margin:6px 0 4px;padding:0 10px}
.office .oname{display:flex;align-items:center;gap:9px;font:700 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin:16px 0 8px}
.office .oname .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(244,165,51,.14)}
.link{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;margin:2px 0;border-radius:11px;cursor:pointer;
  color:var(--ink2);transition:background .16s,color .16s,transform .16s}
.link:hover{background:var(--panel);color:var(--ink);transform:translateX(2px)}
.link.off{cursor:default}.link.off:hover{background:none;transform:none}
.link.on{background:linear-gradient(90deg,rgba(244,165,51,.14),rgba(244,165,51,.03));color:var(--ink)}
.link.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--amber)}
.link .tick{width:8px;height:8px;border-radius:2px;flex:none;transform:rotate(45deg)}
.link .lt{flex:1;min-width:0}
.link .lt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .lt span{font:400 10px/1.3 var(--mono);color:var(--ink3);letter-spacing:.04em}
.link .cnt{font:700 11px var(--mono);color:var(--ink3)}
.link.on .cnt{color:var(--amber)}

/* ---------- MAIN ---------- */
.main{overflow-y:auto;padding:0}
.top{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:rgba(11,14,20,.82);border-bottom:1px solid var(--line);
  padding:20px 34px 18px}
.crumbs{display:flex;align-items:center;gap:10px;font:600 12px var(--mono);color:var(--ink3);letter-spacing:.05em}
.crumbs .sep{color:var(--line2)}
.crumbs .cur{color:var(--amber)}
.top h2{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:-.02em;margin-top:8px;display:flex;align-items:baseline;gap:14px}
.top h2 .lk{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:8px;transform:translateY(-3px)}
.stats{display:flex;gap:26px;margin-top:16px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:21px;font-weight:700;line-height:1}
.stat span{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:5px}
.stat.s b{color:var(--single)} .stat.d b{color:var(--double)} .stat.t b{color:var(--triple)}

.grid{padding:26px 34px 90px;display:flex;flex-direction:column;gap:16px}

/* cycle card */
.cyc{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);opacity:0;transform:translateY(14px);animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.cyc-head{display:flex;align-items:center;gap:12px;padding:15px 20px 13px;border-bottom:1px solid var(--line)}
.ctag{display:inline-flex;align-items:center;gap:7px;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;
  padding:5px 11px 5px 9px;border-radius:20px}
.ctag .g{width:8px;height:8px;border-radius:50%}
.ctag.single{background:rgba(90,169,230,.12);color:var(--single)} .ctag.single .g{background:var(--single)}
.ctag.double{background:rgba(244,165,51,.13);color:var(--double)} .ctag.double .g{background:var(--double)}
.ctag.triple{background:rgba(229,106,134,.13);color:var(--triple)} .ctag.triple .g{background:var(--triple)}
.cyc-head .anchor{font:600 12px var(--mono);color:var(--ink3)}
.cyc-head .spacer{flex:1}
.cyc-head .span{font:600 12px var(--mono);color:var(--ink2)}
.cyc-head .span .a{color:var(--ink)}

/* chain of leaves */
.chain{display:flex;align-items:stretch;gap:0;padding:20px 20px 22px;overflow-x:auto}
.leaf{flex:1 0 220px;min-width:220px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 15px;
  cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;position:relative}
.leaf:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.8)}
.leaf.open{border-color:var(--amber)}
.leaf-top{display:flex;align-items:center;justify-content:space-between}
.dnum{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.02em}
.role{font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:var(--ink3);border:1px solid var(--line2)}
.route{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.tchip{display:flex;flex-direction:column;gap:3px;min-width:0}
.tchip .t{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1;
  background:linear-gradient(180deg,#0a0d13,#0f141c);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;color:var(--ink)}
.tchip .p{font:600 10px var(--mono);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;text-align:center}
.arrow{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 7px,transparent 7px 12px);position:relative;min-width:22px}
.arrow::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--line2)}
.leaf .meta{display:flex;gap:14px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line2)}
.leaf .meta div{display:flex;flex-direction:column;gap:3px}
.leaf .meta b{font:700 13px var(--mono);color:var(--ink)}
.leaf .meta span{font:600 8.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}

/* rest connector between leaves */
.rest{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.rest .wire{position:absolute;top:50%;left:0;right:0;height:2px;background:var(--line2)}
.rest .node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--bg2);padding:6px 4px;border-radius:10px}
.rest .rv{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink)}
.rest .rl{font:700 7.5px var(--mono);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.rest.warn .rv{color:var(--triple)}
.rest.rest-key .node{box-shadow:0 0 0 1px var(--amber-dim);background:linear-gradient(180deg,#1c1608,#12100a)}
.rest.rest-key .rv{color:var(--amber)}

/* legs drawer */
.legwrap{margin:6px 20px 20px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  animation:slide .32s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.legwrap h4{font:700 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px;display:flex;gap:9px;align-items:center}
.legwrap h4 .d{color:var(--amber);font-size:14px;letter-spacing:-.01em}
.leg{display:grid;grid-template-columns:120px 1fr 150px;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:none}
.leg .tn{font:700 13px var(--mono);color:var(--ink)}
.leg .tn.pilot{color:var(--ink3)}
.leg .seg{display:flex;align-items:center;gap:10px}
.leg .st{font:600 11px var(--mono);color:var(--ink2);width:52px}
.leg .bar{flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--cont),#2f8f6f)}
.leg .bar.pilot{background:repeating-linear-gradient(90deg,var(--ink3) 0 5px,transparent 5px 9px);height:2px}
.leg .stn{font:700 11px var(--mono);color:var(--ink);white-space:nowrap}
.leg .rem{font:600 10px var(--mono);color:var(--amber);text-align:right;opacity:.85}
.tag2{font:700 8px var(--mono);letter-spacing:.1em;padding:2px 6px;border-radius:5px;text-transform:uppercase;margin-left:8px}
.tag2.w{background:rgba(79,209,165,.14);color:var(--cont)} .tag2.p{background:rgba(107,118,134,.16);color:var(--ink3)}

.empty{padding:80px 30px;text-align:center;color:var(--ink3)}
.empty b{font-family:var(--disp);font-size:20px;color:var(--ink2);display:block;margin-bottom:6px}
.legend{position:fixed;bottom:16px;right:22px;z-index:8;display:flex;gap:16px;background:rgba(20,25,34,.9);
  border:1px solid var(--line);border-radius:12px;padding:9px 15px;backdrop-filter:blur(10px)}
.legend div{display:flex;align-items:center;gap:7px;font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.legend i{width:9px;height:9px;border-radius:50%}
.sub-built{right:auto;left:22px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" data-sub-nav="detail-book"></aside>

  <div data-sub-host></div>

  <aside class="picker" data-sub-body hidden>
    <div class="pickhead">
      <h2>DETAIL<em>·</em>BOOK</h2>
      <div class="sub">Motormen / LP duty cycles</div>
    </div>
    <nav class="nav2" id="nav"></nav>
  </aside>

  <main class="main" data-sub-body hidden>
    <div class="top" id="top"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div class="legend" data-sub-body hidden>
  <div><i style="background:var(--single)"></i>Single</div>
  <div><i style="background:var(--double)"></i>Double</div>
  <div><i style="background:var(--triple)"></i>Triple</div>
</div>

<script src="/div/js/division-auth.js"></script>
<script src="/div/suburban/js/sub-derive.js"></script>
<script src="/div/suburban/js/sub-data.js"></script>
<script src="/div/suburban/js/sub-shell.js"></script>
<script src="/div/suburban/js/page-detail-book.js"></script>
</body>
</html>
