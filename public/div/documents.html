<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Central Railway BB Division</title>
    <link rel="stylesheet" href="/div/css/division-main.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f1f5f9; color: #1e293b;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        .docs-page { display: flex; min-height: 100vh; }

        /* Category rail */
        .docs-rail { width: 240px; background: #fff; border-right: 1px solid #e2e8f0;
                     padding: 20px 12px; flex-shrink: 0; }
        .rail-back { display: inline-flex; align-items: center; gap: 6px; color: #3b82f6;
                     text-decoration: none; font-size: 13px; margin: 0 8px 18px; }
        .rail-back:hover { text-decoration: underline; }
        .rail-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
                      color: #94a3b8; margin: 0 8px 10px; font-weight: 600; }
        .cat-link { display: flex; align-items: center; gap: 10px; width: 100%; border: none;
                    background: none; text-align: left; padding: 10px 12px; border-radius: 8px;
                    font-size: 14px; color: #334155; cursor: pointer; }
        .cat-link:hover { background: #f1f5f9; }
        .cat-link.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
        .cat-link .icon { font-size: 18px; }

        /* Main */
        .docs-main { flex: 1; padding: 28px 36px; max-width: 1100px; }
        .docs-head { display: flex; align-items: center; justify-content: space-between;
                     margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 600; margin: 0; }
        .page-subtitle { color: #64748b; font-size: 13px; margin-top: 4px; }
        .btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px;
               cursor: pointer; font-weight: 500; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-ghost { background: #f1f5f9; color: #334155; }
        .btn-ghost:hover { background: #e2e8f0; }

        /* Card grid (flat lists) */
        .docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                     gap: 18px; }
        .doc-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;
                    position: relative; }
        .doc-card .ficon { width: 42px; height: 42px; border-radius: 10px; background: #dbeafe;
                           display: flex; align-items: center; justify-content: center;
                           font-size: 20px; margin-bottom: 14px; }
        .doc-card .dtitle { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .doc-card .ddesc { font-size: 13px; color: #64748b; line-height: 1.5; }
        .doc-card .dmeta { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f1f5f9;
                           font-size: 12px; color: #94a3b8; display: flex; gap: 8px; flex-wrap: wrap; }
        .doc-actions { display: flex; gap: 8px; margin-top: 12px; }
        .link-btn { font-size: 13px; color: #2563eb; background: none; border: none;
                    cursor: pointer; padding: 0; }
        .link-btn.danger { color: #dc2626; }
        .link-btn:hover { text-decoration: underline; }

        /* Tree view */
        .tree-node { margin-bottom: 4px; }
        .tree-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer;
                       padding: 8px 10px; border-radius: 8px; font-size: 14px; user-select: none; }
        .tree-toggle:hover { background: #fff; }
        .tree-toggle .caret { transition: transform .15s; color: #94a3b8; font-size: 12px; }
        .tree-toggle.open .caret { transform: rotate(90deg); }
        .tree-year { font-weight: 600; }
        .tree-children { margin-left: 18px; display: none; }
        .tree-children.open { display: block; }
        .tree-count { color: #94a3b8; font-size: 12px; font-weight: 400; }
        .tree-leaf { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
                     border-radius: 8px; }
        .tree-leaf:hover { background: #fff; }
        .tree-leaf .lname { font-size: 14px; flex: 1; }
        .tree-leaf .lname a { color: #1e293b; text-decoration: none; }
        .tree-leaf .lname a:hover { color: #2563eb; text-decoration: underline; }
        .tree-leaf .ldesc { color: #94a3b8; font-size: 12px; }

        .empty { color: #94a3b8; font-size: 14px; padding: 40px 0; text-align: center; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45);
                         display: none; align-items: center; justify-content: center; z-index: 50; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 14px; padding: 26px; width: 460px;
                 max-width: 92vw; }
        .modal h3 { margin: 0 0 18px; font-size: 18px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px;
                 color: #1e293b; }
        .field input, .field select, .field textarea { width: 100%; padding: 9px 11px;
                 border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit;
                 color: #1e293b; background: #fff; }
        .field input::placeholder, .field textarea::placeholder { color: #94a3b8; }
        .field select { -webkit-appearance: menulist; appearance: menulist; }
        .field textarea { resize: vertical; min-height: 60px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        .form-err { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="docs-page">
        <!-- Category rail -->
        <aside class="docs-rail">
            <a href="/div/" class="rail-back"><span>←</span> Back to Dashboard</a>
            <div class="rail-title">Documents</div>
            <nav id="catNav"></nav>
        </aside>

        <!-- Main -->
        <main class="docs-main">
            <div class="docs-head">
                <div>
                    <h1 class="page-title" id="mainTitle">Documents</h1>
                    <div class="page-subtitle" id="mainSubtitle">Division document repository</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <a class="btn btn-primary" id="composeBtn" style="display:none;" href="#">✍ Add Instruction</a>
                    <button class="btn btn-primary" id="uploadBtn" style="display:none;">＋ Upload</button>
                </div>
            </div>
            <div id="content"><div class="empty">Loading…</div></div>
        </main>
    </div>

    <!-- Upload modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <h3>Upload Document</h3>
            <div class="field">
                <label>Category</label>
                <select id="upCategory"></select>
            </div>
            <div class="field" id="upFolderField" style="display:none;">
                <label><span id="upFolderLabelText">Section</span> <span id="upFolderReq" style="color:#dc2626;display:none;">*</span></label>
                <select id="upFolder"></select>
            </div>
            <div class="field">
                <label>Title</label>
                <input type="text" id="upTitle" placeholder="e.g. Refresher Letter — March 2026">
            </div>
            <div class="field" id="upDateField">
                <label>Document date <span id="upDateReq" style="color:#dc2626;display:none;">*</span></label>
                <input type="date" id="upDate">
            </div>
            <div class="field">
                <label id="upDescLabel">Description (optional)</label>
                <textarea id="upDesc" placeholder="Short description"></textarea>
            </div>
            <div class="field">
                <label>File <span style="color:#94a3b8;font-weight:400;">(pdf, ppt, doc, xls — max 25 MB)</span></label>
                <input type="file" id="upFile" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx">
            </div>
            <div class="form-err" id="upErr"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="upCancel">Cancel</button>
                <button class="btn btn-primary" id="upSubmit">Upload</button>
            </div>
        </div>
    </div>

<!-- pdf.js — used to auto-suggest the Subject line from an instruction PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// mode: how a category is browsed —
//   date       Year → Month tree
//   promotion  Year → Month tree, plus a 'Reinstatements' sub-folder
//   folders    fixed folders (from perms.folderConfig), flat list under each
//   folderdate fixed folders, Year → Month tree inside each (transfer letters)
//   flat       plain card grid
const CAT_META = {
    TRAINING_LETTER:    { label: 'Training Letters',    icon: '🎓', mode: 'date' },
    INITIAL_APPOINTMENT:{ label: 'Initial Appointments', icon: '📝', mode: 'date' },
    TRANSFER_LETTER:    { label: 'Transfer Letters',    icon: '📨', mode: 'folderdate' },
    PROMOTION_ORDER:    { label: 'Promotion Orders',    icon: '📈', mode: 'promotion' },
    SR_DEE_INSTRUCTION: { label: 'Sr.DEE Instructions', icon: '📋', mode: 'date' },
    CEE_OP_INSTRUCTION: { label: 'CEE-OP Instructions', icon: '📋', mode: 'date' },
    SAFETY_CIRCULAR:    { label: 'Safety Circulars',    icon: '🦺', mode: 'date' },
    NEWS_LETTER:        { label: 'News Letters',         icon: '📰', mode: 'folderdate' },
    E_CASE_STUDY:       { label: 'e-Case-Study',         icon: '🔎', mode: 'folderdate' },
    STUDY_MATERIAL:     { label: 'Study Materials',     icon: '📚', mode: 'folders' },
    MANUAL:             { label: 'Manuals',             icon: '📕', mode: 'flat' },
    PRESENTATION:       { label: 'Presentations',       icon: '📊', mode: 'flat' },
    BROCHURE:           { label: 'Brochures',           icon: '📘', mode: 'flat' },
    MISC:               { label: 'Misc',                icon: '🗂️', mode: 'flat' },
};
const FILE_ICON = { pdf:'📄', pptx:'📊', ppt:'📊', docx:'📝', doc:'📝', xlsx:'📈', xls:'📈' };
const REINSTATEMENT_FOLDER = 'Reinstatements';
// Instruction categories whose "Description" field is really a Subject, and
// whose PDFs we try to auto-read the subject line from on upload.
const SUBJECT_CATEGORIES = ['SR_DEE_INSTRUCTION', 'CEE_OP_INSTRUCTION'];
if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const DEFAULT_PERMS = {
    success: true, role: null, canUpload: [], canUploadAny: false,
    dateTreeCategories: ['TRAINING_LETTER','INITIAL_APPOINTMENT','PROMOTION_ORDER',
                         'SR_DEE_INSTRUCTION','CEE_OP_INSTRUCTION','SAFETY_CIRCULAR','NEWS_LETTER',
                         'E_CASE_STUDY','TRANSFER_LETTER'],
    folderConfig: {
        STUDY_MATERIAL:  { required: ['Main Line', 'Suburban'] },
        NEWS_LETTER:     { required: ['Main Line', 'Sub Urban'] },
        E_CASE_STUDY:    { required: ['Main Line', 'Sub Urban'] },
        PROMOTION_ORDER: { optional: [REINSTATEMENT_FOLDER] },
        TRANSFER_LETTER: { required: ['CSMT-SUB','KYN-SUB','PNVL-SUB','CSMT-ML','KYN-ML','PNVL-ML',
                                      'IGP','CLA','LNL','NRL','KCS','NCS','SCS','MTN','VVH'] },
    },
    categories: ['TRAINING_LETTER','INITIAL_APPOINTMENT','TRANSFER_LETTER','PROMOTION_ORDER',
                 'SR_DEE_INSTRUCTION','CEE_OP_INSTRUCTION','SAFETY_CIRCULAR','NEWS_LETTER','E_CASE_STUDY',
                 'STUDY_MATERIAL','MANUAL','PRESENTATION','BROCHURE','MISC'],
};
let perms = { ...DEFAULT_PERMS };
let current = 'TRAINING_LETTER';

function fmtSize(b) {
    if (!b) return '';
    if (b < 1024*1024) return (b/1024).toFixed(0) + ' KB';
    return (b/1024/1024).toFixed(1) + ' MB';
}
function fmtDate(d) {
    if (!d) return '';
    // d is 'YYYY-MM-DD' — parse parts directly to avoid timezone shifts.
    const [y, m, day] = String(d).slice(0, 10).split('-').map(Number);
    if (!y) return '';
    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${String(day).padStart(2,'0')} ${MON[m-1]} ${y}`;
}
function isDateTree(cat) { return (perms.dateTreeCategories || []).includes(cat); }
function canManage(cat) { return (perms.canUpload || []).includes(cat); }
// Delete is gated separately from upload — e.g. transfer letters are admin-only
// to delete even though office_hr may still file them.
function canDelete(cat) { return (perms.canDelete || []).includes(cat); }
function catMode(cat) { return (CAT_META[cat] || {}).mode || 'flat'; }
function foldersFor(cat) {
    const fc = (perms.folderConfig || {})[cat] || {};
    return fc.required || fc.optional || [];
}
function folderRequired(cat) { return !!((perms.folderConfig || {})[cat] || {}).required; }
function viewUrl(id) { return `/api/division/documents/${id}/view`; }
function downloadUrl(id) { return `/api/division/documents/${id}/download`; }

async function loadPerms() {
    try {
        const r = await fetch('/api/division/documents/permissions');
        if (!r.ok) throw new Error('permissions HTTP ' + r.status);
        const j = await r.json();
        if (!j || !j.success || !Array.isArray(j.dateTreeCategories)) {
            throw new Error('permissions payload invalid');
        }
        perms = { ...DEFAULT_PERMS, ...j };
    } catch (e) {
        // Falls back to view-only defaults so the tree still renders. Most
        // likely the server needs restarting to mount the documents routes.
        console.error('Could not load document permissions (is the server running the latest code?):', e);
        perms = { ...DEFAULT_PERMS };
    }
    if (perms.canUploadAny) document.getElementById('uploadBtn').style.display = '';
}

function buildRail() {
    const nav = document.getElementById('catNav');
    nav.innerHTML = '';
    Object.keys(CAT_META).forEach(cat => {
        const b = document.createElement('button');
        b.className = 'cat-link' + (cat === current ? ' active' : '');
        b.innerHTML = `<span class="icon">${CAT_META[cat].icon}</span> ${CAT_META[cat].label}`;
        b.onclick = () => selectCategory(cat);
        nav.appendChild(b);
    });
}

function selectCategory(cat) {
    current = cat;
    buildRail();
    const mode = catMode(cat);
    document.getElementById('mainTitle').textContent = CAT_META[cat].label;
    document.getElementById('mainSubtitle').textContent =
        (mode === 'date' || mode === 'promotion') ? 'Browse by year and month'
        : mode === 'folders' ? 'Browse by section'
        : 'All documents in this category';
    syncComposeBtn();
    loadContent();
}

// Instruction categories can be authored in-site (rich text) — show the
// "Add Instruction" button for those when the user may manage the category.
const COMPOSE_CATEGORIES = ['SR_DEE_INSTRUCTION'];
function syncComposeBtn() {
    const btn = document.getElementById('composeBtn');
    if (COMPOSE_CATEGORIES.includes(current) && canManage(current)) {
        btn.style.display = '';
        btn.href = '/div/instruction-compose.html?category=' + encodeURIComponent(current);
    } else {
        btn.style.display = 'none';
    }
}

async function loadContent() {
    const el = document.getElementById('content');
    el.innerHTML = '<div class="empty">Loading…</div>';
    const r = await fetch(`/api/division/documents?category=${current}`);
    if (!r.ok) { el.innerHTML = '<div class="empty">Could not load documents. Refresh, or restart the server if this persists.</div>'; return; }
    const docs = (await r.json()).documents || [];
    el.innerHTML = '';
    await renderDraftsPanel(el);                 // author's unfinalised instructions, on top
    const body = document.createElement('div');
    el.appendChild(body);
    if (!docs.length) { body.innerHTML = '<div class="empty">No documents yet.</div>'; return; }
    const mode = catMode(current);
    if (mode === 'promotion')  return renderPromotion(body, docs);
    if (mode === 'folders')    return renderFixedFolders(body, docs);
    if (mode === 'folderdate') return renderFolderDate(body, docs);
    if (mode === 'date')       return renderDateTree(body, docs);
    return renderFlat(body, docs);
}

// Drafts panel — only for composable instruction categories, shows the current
// user's own unfinalised drafts with Edit / Preview / Delete.
async function renderDraftsPanel(el) {
    if (!COMPOSE_CATEGORIES.includes(current) || !canManage(current)) return;
    let drafts = [];
    try {
        const r = await fetch(`/api/division/documents/drafts?category=${current}`);
        if (r.ok) drafts = (await r.json()).drafts || [];
    } catch (e) { return; }
    if (!drafts.length) return;
    const panel = document.createElement('div');
    panel.style.cssText = 'margin-bottom:18px;border:1px solid #fde68a;background:#fffbeb;border-radius:10px;padding:12px 14px;';
    panel.innerHTML = `<div style="font-weight:600;color:#b45309;font-size:13px;margin-bottom:6px;">📝 Your drafts (${drafts.length}) — not yet finalized, visible only to you</div>`;
    drafts.forEach(d => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid #fef3c7;font-size:13px;';
        const name = d.title ? escapeHtml(d.title) : '<i style="color:#94a3b8">Untitled</i>';
        row.innerHTML = `
            <span style="flex:1;">${name}${d.description ? ' — ' + escapeHtml(d.description) : ''}</span>
            <span style="color:#94a3b8;">${d.doc_date ? fmtDate(d.doc_date) : ''}</span>
            <a class="link-btn" href="/div/instruction-compose.html?id=${d.id}">Edit</a>
            <a class="link-btn" href="${viewUrl(d.id)}" target="_blank" rel="noopener">Preview ↗</a>
            <button class="link-btn danger" data-deldraft="${d.id}">Delete</button>`;
        row.querySelector('[data-deldraft]').onclick = () => delDoc(d.id);
        panel.appendChild(row);
    });
    el.appendChild(panel);
}

function renderFlat(el, documents) {
    const grid = document.createElement('div');
    grid.className = 'docs-grid';
    documents.forEach(d => grid.appendChild(cardEl(d)));
    el.appendChild(grid);
}

function cardEl(d) {
    const c = document.createElement('div');
    c.className = 'doc-card';
    const manage = canDelete(d.category);
    c.innerHTML = `
        <div class="ficon">${FILE_ICON[d.file_type] || '📄'}</div>
        <div class="dtitle">${escapeHtml(d.title)}</div>
        <div class="ddesc">${escapeHtml(d.description || '')}</div>
        <div class="dmeta">
            <span>${d.file_type.toUpperCase()}</span>
            ${d.file_size ? `<span>· ${fmtSize(d.file_size)}</span>` : ''}
            ${d.doc_date ? `<span>· ${fmtDate(d.doc_date)}</span>` : ''}
        </div>
        <div class="doc-actions">
            <a class="link-btn" href="${viewUrl(d.id)}" target="_blank" rel="noopener">Open ↗</a>
            <a class="link-btn" href="${downloadUrl(d.id)}">Download</a>
            ${manage ? `<button class="link-btn danger" data-del="${d.id}">Delete</button>` : ''}
        </div>`;
    if (manage) c.querySelector('[data-del]').onclick = () => delDoc(d.id);
    return c;
}

const MONTHS = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

// Group docs (each doc_date 'YYYY-MM-DD' or null) → {years:[...], undated:[...]}
function groupYears(docs) {
    const tree = {}; const undated = [];
    docs.forEach(d => {
        if (!d.doc_date) { undated.push(d); return; }
        const [ys, ms] = String(d.doc_date).split('-');
        const y = Number(ys), m = Number(ms) - 1;
        tree[y] = tree[y] || {};
        (tree[y][m] = tree[y][m] || []).push(d);
    });
    const years = Object.keys(tree).map(Number).sort((a,b)=>b-a).map(y => ({
        year: y,
        months: Object.keys(tree[y]).map(Number).sort((a,b)=>b-a).map(m => ({
            monthName: MONTHS[m], documents: tree[y][m],
        })),
    }));
    return { years, undated };
}

// Append Year→Month→leaf nodes into container. autoExpand → open newest year+month.
function appendYearNodes(container, grouped, autoExpand) {
    grouped.years.forEach((y, yi) => {
        const count = y.months.reduce((s, m) => s + m.documents.length, 0);
        const open = autoExpand && yi === 0;
        const node = document.createElement('div');
        node.className = 'tree-node';
        node.innerHTML = `
            <div class="tree-toggle tree-year ${open?'open':''}">
                <span class="caret">▶</span><span>${y.year}</span>
                <span class="tree-count">· ${count}</span>
            </div>
            <div class="tree-children ${open?'open':''}"></div>`;
        const kids = node.querySelector('.tree-children');
        node.querySelector('.tree-toggle').onclick = (e) => toggle(e.currentTarget);
        y.months.forEach((m, mi) => {
            const mOpen = open && mi === 0;
            const mnode = document.createElement('div');
            mnode.className = 'tree-node';
            mnode.innerHTML = `
                <div class="tree-toggle ${mOpen ? 'open' : ''}">
                    <span class="caret">▶</span><span>${m.monthName}</span>
                    <span class="tree-count">· ${m.documents.length}</span>
                </div>
                <div class="tree-children ${mOpen ? 'open' : ''}"></div>`;
            const mkids = mnode.querySelector('.tree-children');
            mnode.querySelector('.tree-toggle').onclick = (e) => toggle(e.currentTarget);
            m.documents.forEach(d => mkids.appendChild(leafEl(d)));
            kids.appendChild(mnode);
        });
        container.appendChild(node);
    });
    if (grouped.undated.length) {
        const node = document.createElement('div');
        node.className = 'tree-node';
        node.innerHTML = `
            <div class="tree-toggle tree-year"><span class="caret">▶</span><span>Undated</span>
                <span class="tree-count">· ${grouped.undated.length}</span></div>
            <div class="tree-children"></div>`;
        const kids = node.querySelector('.tree-children');
        node.querySelector('.tree-toggle').onclick = (e) => toggle(e.currentTarget);
        grouped.undated.forEach(d => kids.appendChild(leafEl(d)));
        container.appendChild(node);
    }
}

// A collapsible top-level folder node; buildFn fills its children container.
function folderNode(label, count, open, buildFn) {
    const node = document.createElement('div');
    node.className = 'tree-node';
    node.innerHTML = `
        <div class="tree-toggle tree-year ${open?'open':''}">
            <span class="caret">▶</span><span>${escapeHtml(label)}</span>
            <span class="tree-count">· ${count}</span>
        </div>
        <div class="tree-children ${open?'open':''}"></div>`;
    node.querySelector('.tree-toggle').onclick = (e) => toggle(e.currentTarget);
    buildFn(node.querySelector('.tree-children'));
    return node;
}

function renderDateTree(el, docs) {
    appendYearNodes(el, groupYears(docs), true);
}

// Folder per lobby, Year → Month tree inside each (Transfer Letters).
// Only folders that actually have documents are shown.
function renderFolderDate(el, docs) {
    const configured = foldersFor(current);
    const discovered = [...new Set(docs.map(d => d.folder || 'Unassigned'))]
        .filter(f => !configured.includes(f))
        .sort();
    const folders = [...configured, ...discovered];
    folders.forEach((f, i) => {
        const inFolder = docs.filter(d => (d.folder || 'Unassigned') === f);
        el.appendChild(folderNode(f, inFolder.length, i === 0, (kids) => {
            if (!inFolder.length) {
                kids.innerHTML = '<div class="empty" style="text-align:left;padding:8px 10px;">Empty</div>';
                return;
            }
            appendYearNodes(kids, groupYears(inFolder), i === 0);
        }));
    });
}

// Promotion Orders: a 'Reinstatements' sub-folder + the regular orders by year.
function renderPromotion(el, docs) {
    const reinstate = docs.filter(d => d.folder === REINSTATEMENT_FOLDER);
    const general   = docs.filter(d => d.folder !== REINSTATEMENT_FOLDER);
    if (reinstate.length) {
        el.appendChild(folderNode(REINSTATEMENT_FOLDER, reinstate.length, false,
            (kids) => appendYearNodes(kids, groupYears(reinstate), true)));
    }
    appendYearNodes(el, groupYears(general), true);
}

// Fixed folders (e.g. Study Materials: Main Line / Suburban) → flat list each.
function renderFixedFolders(el, docs) {
    const folders = foldersFor(current);
    folders.forEach((f, i) => {
        const inFolder = docs.filter(d => d.folder === f);
        el.appendChild(folderNode(f, inFolder.length, i === 0, (kids) => {
            if (!inFolder.length) {
                kids.innerHTML = '<div class="empty" style="text-align:left;padding:8px 10px;">Empty</div>';
                return;
            }
            inFolder.forEach(d => kids.appendChild(leafEl(d)));
        }));
    });
}

function toggle(t) {
    t.classList.toggle('open');
    const kids = t.nextElementSibling;
    if (kids) kids.classList.toggle('open');
}

function leafEl(d) {
    const wrap = document.createElement('div');
    wrap.className = 'tree-leaf';
    const manage = canDelete(d.category || current);
    const composed = d.source_type === 'composed';   // in-site instruction, no file
    wrap.innerHTML = `
        <span>${composed ? '📋' : (FILE_ICON[d.file_type] || '📄')}</span>
        <span class="lname"><a href="${viewUrl(d.id)}" target="_blank" rel="noopener">${escapeHtml(d.title)}</a>
            ${d.description ? `<span class="ldesc"> — ${escapeHtml(d.description)}</span>` : ''}</span>
        <span class="tree-count">${fmtDate(d.doc_date)}${d.file_size ? ' · '+fmtSize(d.file_size) : ''}</span>
        ${composed ? '' : `<a class="link-btn" href="${downloadUrl(d.id)}" title="Download">⬇</a>`}
        ${manage ? `<button class="link-btn danger" data-del="${d.id}" title="Delete">✕</button>` : ''}`;
    if (manage) wrap.querySelector('[data-del]').onclick = () => delDoc(d.id);
    return wrap;
}

async function delDoc(id) {
    if (!confirm('Delete this document? This cannot be undone.')) return;
    const r = await fetch(`/api/division/documents/${id}`, { method: 'DELETE' });
    const j = await r.json();
    if (j.success) loadContent();
    else alert(j.error || 'Delete failed');
}

// ── Upload modal ───────────────────────────────────────────────────────────
const modal = document.getElementById('uploadModal');
document.getElementById('uploadBtn').onclick = openModal;
document.getElementById('upCancel').onclick = () => modal.classList.remove('show');
document.getElementById('upCategory').onchange = syncModalFields;
document.getElementById('upSubmit').onclick = submitUpload;
document.getElementById('upFile').onchange = onFileChosen;

function openModal() {
    const sel = document.getElementById('upCategory');
    sel.innerHTML = perms.canUpload.map(c => `<option value="${c}">${CAT_META[c].label}</option>`).join('');
    // default to the currently viewed category if uploadable
    if (perms.canUpload.includes(current)) sel.value = current;
    document.getElementById('upTitle').value = '';
    document.getElementById('upDate').value = '';
    document.getElementById('upDesc').value = '';
    document.getElementById('upFile').value = '';
    document.getElementById('upErr').textContent = '';
    lastAutoSubject = '';
    syncModalFields();
    modal.classList.add('show');
}

// Show/require the date and folder fields based on the selected category.
function syncModalFields() {
    const cat = document.getElementById('upCategory').value;
    const dateTree = isDateTree(cat);
    document.getElementById('upDateField').style.display = dateTree ? '' : 'none';
    document.getElementById('upDateReq').style.display = dateTree ? '' : 'none';

    const opts = foldersFor(cat);
    const wrap = document.getElementById('upFolderField');
    if (opts.length) {
        const req = folderRequired(cat);
        wrap.style.display = '';
        document.getElementById('upFolderReq').style.display = req ? '' : 'none';
        document.getElementById('upFolderLabelText').textContent =
            ['STUDY_MATERIAL','NEWS_LETTER','E_CASE_STUDY'].includes(cat) ? 'Line'
            : cat === 'PROMOTION_ORDER' ? 'Type'
            : cat === 'TRANSFER_LETTER' ? 'Lobby' : 'Section';
        const none = req ? '' : '<option value="">Regular (no folder)</option>';
        document.getElementById('upFolder').innerHTML =
            none + opts.map(o => `<option value="${o}">${o}</option>`).join('');
    } else {
        wrap.style.display = 'none';
    }

    // Instruction categories: the "Description" field is really the Subject,
    // which we try to auto-fill from the PDF on file-select.
    const isSubject = SUBJECT_CATEGORIES.includes(cat);
    document.getElementById('upDescLabel').textContent =
        isSubject ? 'Subject (optional)' : 'Description (optional)';
    document.getElementById('upDesc').placeholder =
        isSubject ? 'Auto-filled from the PDF where possible — edit if needed' : 'Short description';
}

async function submitUpload() {
    const err = document.getElementById('upErr');
    err.textContent = '';
    const cat = document.getElementById('upCategory').value;
    const title = document.getElementById('upTitle').value.trim();
    const date = document.getElementById('upDate').value;
    const file = document.getElementById('upFile').files[0];
    const folderVisible = document.getElementById('upFolderField').style.display !== 'none';
    const folder = folderVisible ? document.getElementById('upFolder').value : '';
    if (!title) { err.textContent = 'Title is required.'; return; }
    if (!file)  { err.textContent = 'Please choose a file.'; return; }
    if (isDateTree(cat) && !date) { err.textContent = 'Document date is required for this category.'; return; }
    if (folderVisible && folderRequired(cat) && !folder) {
        const lineCategory = ['STUDY_MATERIAL','NEWS_LETTER','E_CASE_STUDY'].includes(cat);
        err.textContent = 'Please choose a ' + (lineCategory ? 'line.' : 'section.');
        return;
    }

    const fd = new FormData();
    fd.append('category', cat);
    fd.append('title', title);
    if (date) fd.append('doc_date', date);
    if (folder) fd.append('folder', folder);
    fd.append('description', document.getElementById('upDesc').value.trim());
    fd.append('file', file);

    const btn = document.getElementById('upSubmit');
    btn.disabled = true; btn.textContent = 'Uploading…';
    try {
        const r = await fetch('/api/division/documents', { method: 'POST', body: fd });
        const j = await r.json();
        if (!j.success) { err.textContent = j.error || 'Upload failed.'; return; }
        modal.classList.remove('show');
        if (cat !== current) selectCategory(cat); else loadContent();
    } catch (e) {
        err.textContent = 'Upload failed.';
    } finally {
        btn.disabled = false; btn.textContent = 'Upload';
    }
}

// ── Auto-suggest Subject from an instruction PDF ────────────────────────────
// Best-effort: only for subject categories + PDFs with a real text layer.
// Scanned (image-only) PDFs yield nothing → the field stays blank for manual
// entry. Never blocks upload; the user can always edit the suggestion.
let lastAutoSubject = '';

function onFileChosen() {
    const cat = document.getElementById('upCategory').value;
    const file = document.getElementById('upFile').files[0];
    if (!file || !SUBJECT_CATEGORIES.includes(cat) || !/\.pdf$/i.test(file.name)) return;
    const desc = document.getElementById('upDesc');
    // Don't clobber a subject the user typed or edited themselves.
    if (desc.value.trim() && desc.value !== lastAutoSubject) return;
    extractPdfSubject(file).then(subj => {
        if (!subj) return;
        if (desc.value.trim() && desc.value !== lastAutoSubject) return; // re-check (async)
        desc.value = subj;
        lastAutoSubject = subj;
    }).catch(() => { /* unreadable / scanned PDF — leave blank */ });
}

async function extractPdfSubject(file) {
    if (!window.pdfjsLib) return '';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let lines = [];
    const pages = Math.min(pdf.numPages, 2); // subject sits near the top
    for (let p = 1; p <= pages; p++) {
        const tc = await (await pdf.getPage(p)).getTextContent();
        lines = lines.concat(itemsToLines(tc.items));
        const found = findSubject(lines);
        if (found) return found;
    }
    return findSubject(lines);
}

// Rebuild visual lines from pdf.js text items by grouping on y-position.
function itemsToLines(items) {
    const rows = new Map();
    items.forEach(it => {
        const y = Math.round(it.transform[5]);
        (rows.get(y) || rows.set(y, []).get(y)).push(it);
    });
    return [...rows.entries()]
        .sort((a, b) => b[0] - a[0])                          // top → bottom
        .map(([, its]) => its.sort((a, b) => a.transform[4] - b.transform[4])
            .map(i => i.str).join(' ').replace(/\s+/g, ' ').trim())
        .filter(Boolean);
}

// Find a "Sub:" / "Subject:" line; fall back to the next line if the label
// sits alone. Returns '' when no subject label is present.
function findSubject(lines) {
    for (let i = 0; i < lines.length; i++) {
        const m = lines[i].match(/\bsub(?:ject)?\s*[:\-]+\s*(.*)$/i);
        if (m) {
            let s = m[1].trim();
            if (!s && i + 1 < lines.length) s = lines[i + 1].trim();
            return s.replace(/\s+/g, ' ').slice(0, 300).trim();
        }
    }
    return '';
}

function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Init ─────────────────────────────────────────────────────────────────--
(async function init() {
    await loadPerms();
    buildRail();
    selectCategory('TRAINING_LETTER');
})();
</script>
