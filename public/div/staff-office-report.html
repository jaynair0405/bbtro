<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Staff Listing</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .report-shell {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 24px;
      box-shadow: 0 30px 80px -40px rgba(15, 23, 42, 0.3);
      padding: 32px 36px 42px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }
    .office-info span {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
      color: var(--primary);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .controls select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
    }
    .controls button {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .multiselect-wrapper {
      position: relative;
      display: inline-block;
    }
    .multiselect-button {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 180px;
      justify-content: space-between;
    }
    .multiselect-button:hover {
      background: rgba(37, 99, 235, 0.04);
    }
    .multiselect-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.2);
      min-width: 260px;
      max-height: 400px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .multiselect-dropdown.active {
      display: block;
    }
    .multiselect-actions {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .multiselect-actions button {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }
    .multiselect-actions button:hover {
      background: rgba(37, 99, 235, 0.08);
      border-color: var(--primary);
      color: var(--primary);
    }
    .multiselect-option {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .multiselect-option:hover {
      background: rgba(37, 99, 235, 0.04);
    }
    .multiselect-option input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }
    .multiselect-option label {
      cursor: pointer;
      flex: 1;
      user-select: none;
    }
    .multiselect-count {
      display: inline-block;
      padding: 2px 8px;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      border: 1px solid var(--border);
    }
    thead {
      background: rgba(226, 232, 240, 0.6);
    }
    th, td {
      padding: 12px 14px;
      font-size: 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
      color: var(--muted);
    }
    tbody tr:nth-child(odd) {
      background: rgba(248, 250, 255, 0.6);
    }
    .loading, .empty {
      text-align: center;
      padding: 28px;
      font-size: 15px;
      color: var(--muted);
    }
    /* Sticky table header */
    thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    /* Search box */
    .search-box {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      width: 200px;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    /* Back to top button */
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
      z-index: 100;
    }
    .back-to-top:hover {
      transform: scale(1.1);
    }
    .back-to-top.visible {
      display: flex;
    }
    /* Clickable name link */
    .staff-name-link {
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
    }
    .staff-name-link:hover {
      text-decoration: underline;
    }
    @media print {
      body { padding: 0; background: white; }
      .report-shell { border-radius: 0; box-shadow: none; }
      .controls { display: none; }
      .back-to-top { display: none !important; }
      .multiselect-dropdown { display: none !important; }
    }
  </style>
</head>
<body>
  <script src="/div/js/division-auth.js"></script>
  <div class="report-shell">
    <header>
      <div>
        <div class="office-info"><span>Office Staff Register</span></div>
        <h1 id="officeTitle">Office Staff Register</h1>
        <div id="officeSubtext" style="color: var(--muted); font-size: 14px;"></div>
      </div>
      <div class="controls">
        <!-- Search Box -->
        <input type="text" class="search-box" id="searchInput" placeholder="Search name/HRMS/CMS/PF..." oninput="onSearchChange()">

        <!-- Office Multi-Select (Admin Only) -->
        <div class="multiselect-wrapper" id="officeMultiselectWrapper" style="display: none;">
          <div class="multiselect-button" id="officeButton">
            <span id="officeButtonText">All Offices</span>
            <span>▼</span>
          </div>
          <div class="multiselect-dropdown" id="officeDropdown">
            <div class="multiselect-actions">
              <button type="button" onclick="selectAllOffices()">Select All</button>
              <button type="button" onclick="clearAllOffices()">Clear All</button>
            </div>
            <div id="officeOptions"></div>
          </div>
        </div>

        <!-- Designation Multi-Select -->
        <div class="multiselect-wrapper">
          <div class="multiselect-button" id="designationButton">
            <span id="designationButtonText">All Designations</span>
            <span>▼</span>
          </div>
          <div class="multiselect-dropdown" id="designationDropdown">
            <div class="multiselect-actions">
              <button type="button" onclick="selectAllDesignations()">Select All</button>
              <button type="button" onclick="clearAllDesignations()">Clear All</button>
            </div>
            <div id="designationOptions"></div>
          </div>
        </div>
        <button type="button" onclick="handleBack()">← Back</button>
        <button type="button" onclick="window.print()">Print</button>
      </div>
    </header>

    <div id="tableContainer">
      <div class="loading">Fetching staff list...</div>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>

  <script>
    let currentUser = null;
    let staffData = [];
    let allDesignations = [];
    let selectedDesignations = [];
    let allOffices = [];
    let selectedOffices = [];

    async function init() {
      await fetchCurrentUser();
      await fetchOffices();
      await fetchDesignations();
      await loadStaff();

      // Setup office dropdown toggle (admin only)
      const officeButton = document.getElementById('officeButton');
      if (officeButton) {
        officeButton.addEventListener('click', toggleOfficeDropdown);
      }

      // Setup designation dropdown toggle
      document.getElementById('designationButton').addEventListener('click', toggleDesignationDropdown);

      // Close dropdowns when clicking outside
      document.addEventListener('click', function(e) {
        const officeWrapper = document.getElementById('officeMultiselectWrapper');
        const designationWrapper = document.querySelector('.multiselect-wrapper:not(#officeMultiselectWrapper)');

        if (officeWrapper && !officeWrapper.contains(e.target)) {
          document.getElementById('officeDropdown').classList.remove('active');
        }
        if (designationWrapper && !designationWrapper.contains(e.target)) {
          document.getElementById('designationDropdown').classList.remove('active');
        }
      });
    }

    async function fetchCurrentUser() {
      const res = await fetch('/api/current-user');
      if (!res.ok) throw new Error('Not authenticated');
      currentUser = await res.json();
    }

    async function fetchOffices() {
      // Only show office filter for admin users
      if (currentUser.div_role !== 'division_admin') {
        return;
      }

      const res = await fetch('/api/division/offices');
      const payload = await res.json();
      allOffices = (payload?.data || payload || []).map(o => ({
        code: o.office_code,
        name: o.office_name
      }));

      const container = document.getElementById('officeOptions');
      allOffices.forEach((office, index) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'multiselect-option';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `office_${index}`;
        checkbox.value = office.code;
        checkbox.addEventListener('change', onOfficeChange);

        const label = document.createElement('label');
        label.htmlFor = `office_${index}`;
        label.textContent = office.name;

        optionDiv.appendChild(checkbox);
        optionDiv.appendChild(label);
        container.appendChild(optionDiv);

        // Make the whole div clickable
        optionDiv.addEventListener('click', function(e) {
          if (e.target !== checkbox) {
            checkbox.checked = !checkbox.checked;
            onOfficeChange();
          }
        });
      });

      // Show the office multiselect for admin
      document.getElementById('officeMultiselectWrapper').style.display = 'inline-block';

      // Set initial value from URL parameter if present
      const urlOfficeCode = new URLSearchParams(window.location.search).get('office_code');
      if (urlOfficeCode) {
        const checkbox = document.querySelector(`#officeOptions input[value="${urlOfficeCode}"]`);
        if (checkbox) {
          checkbox.checked = true;
          onOfficeChange();
        }
      }
    }

    async function fetchDesignations() {
      const res = await fetch('/api/division/designations');
      const payload = await res.json();
      const options = payload?.data || payload || [];
      allDesignations = options.map(desg => desg.designation_name);

      const container = document.getElementById('designationOptions');
      allDesignations.forEach((designation, index) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'multiselect-option';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `desg_${index}`;
        checkbox.value = designation;
        checkbox.addEventListener('change', onDesignationChange);

        const label = document.createElement('label');
        label.htmlFor = `desg_${index}`;
        label.textContent = designation;

        optionDiv.appendChild(checkbox);
        optionDiv.appendChild(label);
        container.appendChild(optionDiv);

        // Make the whole div clickable
        optionDiv.addEventListener('click', function(e) {
          if (e.target !== checkbox) {
            checkbox.checked = !checkbox.checked;
            onDesignationChange();
          }
        });
      });
    }

    async function loadStaff() {
      let staffResults = [];

      if (currentUser.div_role === 'division_admin') {
        // Admin: Load staff from selected offices or all if none selected
        if (selectedOffices.length === 0) {
          // No offices selected, load all
          const res = await fetch('/api/division/staff');
          const payload = await res.json();
          staffResults = payload?.data || payload || [];
        } else {
          // Load staff from each selected office
          for (const officeCode of selectedOffices) {
            const res = await fetch(`/api/division/staff?office_code=${encodeURIComponent(officeCode)}`);
            const payload = await res.json();
            staffResults = staffResults.concat(payload?.data || payload || []);
          }
        }
      } else {
        // Non-admin users see only their office
        const res = await fetch(`/api/division/staff?office_code=${encodeURIComponent(currentUser.div_office_code)}`);
        const payload = await res.json();
        staffResults = payload?.data || payload || [];
      }

      staffData = staffResults;

      // Update title based on selection
      if (currentUser.div_role === 'division_admin') {
        if (selectedOffices.length === 0) {
          document.getElementById('officeTitle').textContent = 'All Offices';
        } else if (selectedOffices.length === 1) {
          const office = allOffices.find(o => o.code === selectedOffices[0]);
          document.getElementById('officeTitle').textContent = office?.name || selectedOffices[0];
        } else {
          document.getElementById('officeTitle').textContent = `${selectedOffices.length} Offices Selected`;
        }
      } else {
        const office = allOffices.find(o => o.code === currentUser.div_office_code);
        document.getElementById('officeTitle').textContent = office?.name || currentUser.div_office_code;
      }

      document.getElementById('officeSubtext').textContent = `${staffData.length} staff records`;
      renderTable();
    }

    function renderTable() {
      const container = document.getElementById('tableContainer');
      if (!staffData.length) {
        container.innerHTML = '<div class="empty">No staff records found.</div>';
        document.getElementById('officeSubtext').textContent = '0 staff records';
        return;
      }

      // Apply designation filter (multiple selections)
      let filtered = staffData;
      if (selectedDesignations.length > 0) {
        filtered = staffData.filter(s =>
          selectedDesignations.some(desg =>
            (s.designation_name || '').toLowerCase() === desg.toLowerCase()
          )
        );
      }

      // Apply search filter
      const searchTerm = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      if (searchTerm) {
        filtered = filtered.filter(s =>
          (s.name || '').toLowerCase().includes(searchTerm) ||
          (s.hrms_id || '').toLowerCase().includes(searchTerm) ||
          (s.current_cms_id || '').toLowerCase().includes(searchTerm) ||
          (s.pf_number || '').toLowerCase().includes(searchTerm)
        );
      }

      // Update staff count with filtered/total
      if (filtered.length !== staffData.length) {
        document.getElementById('officeSubtext').textContent = `${filtered.length} of ${staffData.length} staff records`;
      } else {
        document.getElementById('officeSubtext').textContent = `${staffData.length} staff records`;
      }

      if (!filtered.length) {
        container.innerHTML = '<div class="empty">No staff match the filters.</div>';
        return;
      }

      const rows = filtered.map((staff, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${staff.hrms_id || '—'}</td>
          <td>${staff.current_cms_id || '—'}</td>
          <td><a class="staff-name-link" href="/div/biodataform.html?search=${encodeURIComponent(staff.hrms_id)}">${staff.name || '—'}</a></td>
          <td>${staff.designation_name || '—'}</td>
        </tr>
      `).join('');
      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Sl. No</th>
              <th>HRMS ID</th>
              <th>Current CMS ID</th>
              <th>Name</th>
              <th>Designation</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function toggleDesignationDropdown(e) {
      e.stopPropagation();
      document.getElementById('designationDropdown').classList.toggle('active');
    }

    function onDesignationChange() {
      // Get all checked designations
      const checkboxes = document.querySelectorAll('#designationOptions input[type="checkbox"]');
      selectedDesignations = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      // Update button text
      updateDesignationButtonText();

      // Re-render table
      renderTable();
    }

    function updateDesignationButtonText() {
      const buttonText = document.getElementById('designationButtonText');
      if (selectedDesignations.length === 0) {
        buttonText.innerHTML = 'All Designations';
      } else if (selectedDesignations.length === 1) {
        buttonText.innerHTML = selectedDesignations[0];
      } else {
        buttonText.innerHTML = `<span class="multiselect-count">${selectedDesignations.length}</span> Designations`;
      }
    }

    function selectAllDesignations() {
      const checkboxes = document.querySelectorAll('#designationOptions input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = true);
      onDesignationChange();
    }

    function clearAllDesignations() {
      const checkboxes = document.querySelectorAll('#designationOptions input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);
      onDesignationChange();
    }

    // Office Multi-Select Functions
    function toggleOfficeDropdown(e) {
      e.stopPropagation();
      document.getElementById('officeDropdown').classList.toggle('active');
    }

    function onOfficeChange() {
      // Get all checked offices
      const checkboxes = document.querySelectorAll('#officeOptions input[type="checkbox"]');
      selectedOffices = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      // Update button text
      updateOfficeButtonText();

      // Reload staff data
      loadStaff();
    }

    function updateOfficeButtonText() {
      const buttonText = document.getElementById('officeButtonText');
      if (selectedOffices.length === 0) {
        buttonText.innerHTML = 'All Offices';
      } else if (selectedOffices.length === 1) {
        const office = allOffices.find(o => o.code === selectedOffices[0]);
        buttonText.innerHTML = office?.name || selectedOffices[0];
      } else {
        buttonText.innerHTML = `<span class="multiselect-count">${selectedOffices.length}</span> Offices`;
      }
    }

    function selectAllOffices() {
      const checkboxes = document.querySelectorAll('#officeOptions input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = true);
      onOfficeChange();
    }

    function clearAllOffices() {
      const checkboxes = document.querySelectorAll('#officeOptions input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);
      onOfficeChange();
    }

    document.addEventListener('DOMContentLoaded', init);

    function handleBack() {
      window.location.href = '/div';
    }

    // Search functionality
    function onSearchChange() {
      renderTable();
    }

    // Back to top functionality
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Show/hide back to top button based on scroll position
    window.addEventListener('scroll', function() {
      const backToTopBtn = document.getElementById('backToTop');
      if (window.scrollY > 300) {
        backToTopBtn.classList.add('visible');
      } else {
        backToTopBtn.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
