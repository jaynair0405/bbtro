<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Shed TI overdue</title><link rel="stylesheet" href="/div/css/trip-shed.css"><style>.edit{white-space:nowrap}</style></head><body><header class="top"><div class="brand"><b>VVH Trip Shed TI overdue</b><small>Factual register · edit approved columns</small></div><span class="spacer"></span><a href="/div/trip-shed.html">← Trip Shed</a></header><main class="main"><div class="heading"><div><h1>TI overdue register</h1><p>Dates and remarks remain factual register values; no automatic due rule is applied.</p></div></div><section class="card"><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Loco</th><th>Base</th><th>IN/TR</th><th>KM</th><th>Last TI date</th><th>TI/GC</th><th>O/TRI</th><th>Last shed</th><th>Remark</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="11">Loading…</td></tr></tbody></table></div></section><section class="card" id="editor" hidden style="margin-top:15px"><h2>Edit TI-overdue entry <span id="eid"></span></h2><form id="form" class="formgrid"><label>Date<input class="input" name="entry_date" type="date" required></label><label>Loco no.<input class="input" name="loco_number" required></label><label>Base<input class="input" name="loco_base"></label><label>IN/TR no.<input class="input" name="incoming_train_no"></label><label>KM<input class="input" name="kms" type="number" min="0" step="0.01"></label><label>Last TI date<input class="input" name="last_inspection_date" type="date"></label><label>TI / GC<input class="input" name="last_inspection_type"></label><label>O/TRI no.<input class="input" name="outgoing_train_no"></label><label>Last shed<input class="input" name="last_shed"></label><label class="wide">Remark<textarea name="remarks"></textarea></label><div class="wide"><button class="btn primary">Save changes</button><button class="btn" type="button" id="cancel">Cancel</button></div></form><p id="notice" role="status"></p></section></main><script>
const API='/api/division/trip-shed',shedCode=new URLSearchParams(location.search).get('shed_code')||'',scoped=p=>shedCode?p+(p.includes('?')?'&':'?')+'shed_code='+encodeURIComponent(shedCode):p,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];const text=v=>v==null||v===''?'—':esc(v);function render(){ $('#rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${text(x.entry_date)}</td><td>${text(x.loco_number)}</td><td>${text(x.loco_base)}</td><td>${text(x.incoming_train_no)}</td><td>${text(x.kms)}</td><td>${text(x.last_inspection_date)}</td><td>${text(x.last_inspection_type)}</td><td>${text(x.outgoing_train_no)}</td><td>${text(x.last_shed)}</td><td>${text(x.remarks)}</td><td class="edit"><button class="btn" data-edit="${x.id}">Edit</button></td></tr>`).join(''):'<tr><td colspan="11">No TI-overdue entries.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)))}async function load(){const r=await fetch(API+scoped('/overdue'));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load register');rows=d.rows;render()}function edit(id){const x=rows.find(r=>r.id===id);if(!x)return;$('#editor').hidden=false;$('#eid').textContent='#'+id;$('#form').dataset.id=id;for(const [k,v] of Object.entries(x)){const f=$('#form').elements.namedItem(k);if(f&&v!=null)f.value=v}window.scrollTo(0,document.body.scrollHeight)}$('#cancel').onclick=()=>$('#editor').hidden=true;$('#form').onsubmit=async e=>{e.preventDefault();const id=e.target.dataset.id;try{const r=await fetch(API+scoped('/overdue/'+id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to update entry');$('#notice').textContent=d.message;await load()}catch(x){$('#notice').textContent=x.message}};load().catch(e=>$('#rows').innerHTML='<tr><td colspan="11">'+esc(e.message)+'</td></tr>');
</script></body></html>
