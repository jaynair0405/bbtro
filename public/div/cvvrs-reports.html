<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divisional Portal – CVVRS Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{background:#f6f7fb;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;color:#1e293b;}

  .top-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .top-bar h1{font-size:18px;font-weight:700;margin:0;color:#0f172a;display:flex;align-items:center;gap:10px;}
  .top-bar h1 .badge-title{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;letter-spacing:.5px;}
  .btn-back{background:none;border:1px solid #cbd5e1;border-radius:8px;padding:6px 14px;color:#475569;font-size:13px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-back:hover{background:#f1f5f9;border-color:#94a3b8;}
  .btn-primary-gradient{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary-gradient:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3);color:#fff;}

  .page{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}

  .card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:20px;overflow:hidden;}
  .card-header{padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;}
  .card-header h2{font-size:14px;font-weight:700;margin:0;color:#0f172a;}
  .card-body{padding:20px;}

  .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .form-label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block;}
  .form-control,.form-select{font-size:13px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;transition:all .2s;background:#fff;width:100%;}
  .form-control:focus,.form-select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1);outline:none;}

  .perf-filter-group{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0;background:#f8fafc;}
  .perf-filter-btn{padding:6px 12px;font-size:12px;font-weight:600;border:none;background:transparent;color:#64748b;cursor:pointer;transition:all .15s;}
  .perf-filter-btn:not(:last-child){border-right:1px solid #e2e8f0;}
  .perf-filter-btn.active{background:#3b82f6;color:#fff;}

  .filter-actions{display:flex;gap:8px;align-items:flex-end;}
  .btn-filter{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
  .btn-filter:hover{background:#2563eb;}
  .btn-clear{background:transparent;color:#64748b;border:1px solid #e2e8f0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .15s;}
  .btn-clear:hover{background:#f1f5f9;}

  /* Summary stats */
  .stats-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:180px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .stat-card .stat-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .stat-card .stat-value{font-size:24px;font-weight:700;color:#0f172a;margin-top:2px;}
  .stat-card.good{border-left:4px solid #22c55e;}
  .stat-card.sat{border-left:4px solid #f59e0b;}
  .stat-card.poor{border-left:4px solid #ef4444;}

  /* Report cards */
  .reports-list{display:flex;flex-direction:column;gap:12px;}
  .report-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .report-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:#3b82f6;}
  .report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .report-title{font-size:14px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .train-badge{background:#eff6ff;color:#1e40af;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:.3px;}
  .route{color:#475569;font-size:13px;}
  .arrow{color:#94a3b8;margin:0 4px;}
  .report-date{font-size:12px;color:#64748b;}
  .report-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:13px;}
  .report-col .label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .report-col .val{color:#1e293b;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:8px;}
  .report-col .hrms{color:#64748b;font-weight:400;font-size:11px;}

  .perf-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.3px;}
  .perf-badge.good{background:#dcfce7;color:#166534;}
  .perf-badge.sat{background:#fef3c7;color:#92400e;}
  .perf-badge.poor{background:#fee2e2;color:#991b1b;}
  .perf-badge.none{background:#f1f5f9;color:#94a3b8;}

  .report-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed #e2e8f0;font-size:12px;color:#64748b;}
  .view-link{color:#3b82f6;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}

  .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
  .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5;}
  .empty-state .text{font-size:14px;}

  .loading{text-align:center;padding:40px;color:#94a3b8;font-size:14px;}

  /* Pagination */
  .pagination{display:flex;justify-content:center;gap:4px;margin-top:20px;}
  .page-btn{padding:6px 12px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;font-size:13px;color:#475569;cursor:pointer;transition:all .15s;}
  .page-btn:hover:not(:disabled){background:#f1f5f9;}
  .page-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Detail view */
  .detail-view{display:none;}
  .detail-view.active{display:block;}
  .listing-view.hidden{display:none;}

  .detail-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .detail-header h1{font-size:20px;font-weight:700;margin:0;}
  .detail-actions{margin-left:auto;display:flex;gap:8px;}
  .detail-meta{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .detail-meta .label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .detail-meta .val{font-size:13px;color:#0f172a;font-weight:600;margin-top:2px;}

  .section-block{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;overflow:hidden;}
  .section-block-header{padding:12px 18px;background:#f8fafc;border-bottom:1px solid #e2e8f0;}
  .section-block-header h3{font-size:13px;font-weight:700;margin:0;color:#0f172a;}
  .obs-table-detail{width:100%;border-collapse:collapse;}
  .obs-table-detail th{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;padding:8px 14px;text-align:left;background:#f8fafc;border-bottom:2px solid #e2e8f0;}
  .obs-table-detail td{padding:8px 14px;font-size:13px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
  .val-chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;}
  .val-chip.pos{background:#dcfce7;color:#166534;}
  .val-chip.neg{background:#fee2e2;color:#991b1b;}
  .val-chip.na{color:#cbd5e1;font-weight:500;}

  @media(max-width:768px){
    .grid-5{grid-template-columns:1fr 1fr;}
    .report-body,.detail-meta{grid-template-columns:1fr;}
  }

  @media print{
    .top-bar,.no-print{display:none!important;}
    .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:12px;">
    <a class="btn-back" href="/div/spm-hub.html">← Back</a>
    <h1>
      CVVRS Reports
      <span class="badge-title">MAINLINE</span>
    </h1>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-outline-secondary btn-sm" id="btnPrint" style="font-size:13px;border-radius:8px;display:none;" onclick="window.print()">Print</button>
    <a class="btn-primary-gradient" href="/div/cvvrs.html">+ New CVVRS Report</a>
  </div>
</div>

<div class="page">
  <!-- ============ LISTING VIEW ============ -->
  <div class="listing-view" id="listingView">
    <!-- Filters -->
    <div class="card">
      <div class="card-header"><h2>Filters</h2></div>
      <div class="card-body">
        <div class="grid-5" style="margin-bottom:12px;">
          <div>
            <label class="form-label">From Date</label>
            <input type="date" class="form-control" id="fFrom">
          </div>
          <div>
            <label class="form-label">To Date</label>
            <input type="date" class="form-control" id="fTo">
          </div>
          <div>
            <label class="form-label">Crew HRMS ID</label>
            <input type="text" class="form-control" id="fCrew" placeholder="LP or ALP HRMS...">
          </div>
          <div>
            <label class="form-label">CLI HRMS ID</label>
            <input type="text" class="form-control" id="fCli" placeholder="CLI HRMS...">
          </div>
          <div>
            <label class="form-label">Performance</label>
            <div class="perf-filter-group" id="perfFilterGroup">
              <button class="perf-filter-btn active" data-val="">All</button>
              <button class="perf-filter-btn" data-val="GOOD">Good</button>
              <button class="perf-filter-btn" data-val="SATISFACTORY">Sat</button>
              <button class="perf-filter-btn" data-val="POOR">Poor</button>
            </div>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-filter" onclick="applyFilters()">Search</button>
          <button class="btn-clear" onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Summary stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Reports list -->
    <div id="reportsList"><div class="loading">Loading reports…</div></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- ============ DETAIL VIEW ============ -->
  <div class="detail-view" id="detailView"></div>
</div>

<script>
let CURRENT_PAGE = 1;
let TOTAL_PAGES = 1;
let CURRENT_FILTERS = {};
let PERF_FILTER = '';

async function api(url, opts = {}) {
  const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store', ...opts });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
  catch(e) { return d; }
}

function perfBadge(perf) {
  if (!perf) return '<span class="perf-badge none">—</span>';
  const cls = perf === 'GOOD' ? 'good' : perf === 'SATISFACTORY' ? 'sat' : 'poor';
  return `<span class="perf-badge ${cls}">${perf}</span>`;
}

// ============ LIST ============
async function loadReports(page = 1) {
  CURRENT_PAGE = page;
  const list = document.getElementById('reportsList');
  list.innerHTML = '<div class="loading">Loading reports…</div>';

  const params = new URLSearchParams({ page, limit: 20, ...CURRENT_FILTERS });
  if (PERF_FILTER) params.set('performance', PERF_FILTER);

  try {
    const json = await api(`/api/division/cvvrs/reports?${params}`);
    const { data, total, limit } = json;
    TOTAL_PAGES = Math.max(1, Math.ceil(total / limit));

    renderStats(data, total);
    renderList(data);
    renderPagination();
  } catch (err) {
    list.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><div class="text">Error: ${escapeHtml(err.message)}</div></div>`;
  }
}

function renderStats(data, total) {
  let good = 0, sat = 0, poor = 0;
  data.forEach(r => {
    [r.lp_performance, r.alp_performance].forEach(p => {
      if (p === 'GOOD') good++;
      else if (p === 'SATISFACTORY') sat++;
      else if (p === 'POOR') poor++;
    });
  });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Reports</div><div class="stat-value">${total}</div></div>
    <div class="stat-card good"><div class="stat-label">Good</div><div class="stat-value">${good}</div></div>
    <div class="stat-card sat"><div class="stat-label">Satisfactory</div><div class="stat-value">${sat}</div></div>
    <div class="stat-card poor"><div class="stat-label">Poor</div><div class="stat-value">${poor}</div></div>
  `;
}

function renderList(data) {
  const list = document.getElementById('reportsList');
  if (!data.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div class="text">No reports found. Try adjusting filters.</div></div>';
    return;
  }

  list.innerHTML = '<div class="reports-list">' + data.map(r => `
    <div class="report-card" onclick="viewReport(${r.report_id})">
      <div class="report-header">
        <div class="report-title">
          <span class="train-badge">Train ${escapeHtml(r.train_number)}</span>
          <span class="route">${escapeHtml(r.from_station || '?')}<span class="arrow">→</span>${escapeHtml(r.to_station || '?')}</span>
          ${r.loco_number ? `<span style="font-size:12px;color:#94a3b8;">Loco: ${escapeHtml(r.loco_number)}</span>` : ''}
        </div>
        <div class="report-date">Event: ${formatDate(r.event_date)}</div>
      </div>
      <div class="report-body">
        <div class="report-col">
          <div class="label">Loco Pilot</div>
          <div class="val">${escapeHtml(r.lp_name)}${r.lp_hrms_id ? `<span class="hrms">(${escapeHtml(r.lp_hrms_id)})</span>` : ''}</div>
          <div style="margin-top:4px;">${perfBadge(r.lp_performance)}</div>
        </div>
        <div class="report-col">
          <div class="label">Asst. Loco Pilot</div>
          <div class="val">${r.alp_name ? escapeHtml(r.alp_name) : '<span style="color:#94a3b8;font-weight:400;">—</span>'}${r.alp_hrms_id ? `<span class="hrms">(${escapeHtml(r.alp_hrms_id)})</span>` : ''}</div>
          <div style="margin-top:4px;">${r.alp_name ? perfBadge(r.alp_performance) : ''}</div>
        </div>
        <div class="report-col">
          <div class="label">Analyzed By</div>
          <div class="val">${escapeHtml(r.cli_name)}</div>
          <div class="hrms" style="margin-top:4px;">On ${formatDate(r.analysis_date)}</div>
        </div>
      </div>
      <div class="report-footer">
        <span>${r.final_remark ? '📝 ' + escapeHtml((r.final_remark || '').substring(0, 60)) + (r.final_remark.length > 60 ? '…' : '') : '&nbsp;'}</span>
        <a class="view-link" onclick="event.stopPropagation();viewReport(${r.report_id})">View Details →</a>
      </div>
    </div>
  `).join('') + '</div>';
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (TOTAL_PAGES <= 1) { el.innerHTML = ''; return; }

  let html = `<button class="page-btn" ${CURRENT_PAGE === 1 ? 'disabled' : ''} onclick="loadReports(${CURRENT_PAGE - 1})">‹ Prev</button>`;
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    if (i === 1 || i === TOTAL_PAGES || (i >= CURRENT_PAGE - 2 && i <= CURRENT_PAGE + 2)) {
      html += `<button class="page-btn ${i === CURRENT_PAGE ? 'active' : ''}" onclick="loadReports(${i})">${i}</button>`;
    } else if (i === CURRENT_PAGE - 3 || i === CURRENT_PAGE + 3) {
      html += `<span style="padding:6px 4px;color:#94a3b8;">…</span>`;
    }
  }
  html += `<button class="page-btn" ${CURRENT_PAGE === TOTAL_PAGES ? 'disabled' : ''} onclick="loadReports(${CURRENT_PAGE + 1})">Next ›</button>`;
  el.innerHTML = html;
}

// ============ FILTERS ============
function applyFilters() {
  CURRENT_FILTERS = {};
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  const crew = document.getElementById('fCrew').value.trim();
  const cli = document.getElementById('fCli').value.trim();
  if (from) CURRENT_FILTERS.from = from;
  if (to) CURRENT_FILTERS.to = to;
  if (crew) CURRENT_FILTERS.crew_hrms = crew;
  if (cli) CURRENT_FILTERS.cli_hrms = cli;
  loadReports(1);
}

function clearFilters() {
  document.getElementById('fFrom').value = '';
  document.getElementById('fTo').value = '';
  document.getElementById('fCrew').value = '';
  document.getElementById('fCli').value = '';
  document.querySelectorAll('#perfFilterGroup .perf-filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('#perfFilterGroup .perf-filter-btn[data-val=""]').classList.add('active');
  PERF_FILTER = '';
  CURRENT_FILTERS = {};
  loadReports(1);
}

document.querySelectorAll('#perfFilterGroup .perf-filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#perfFilterGroup .perf-filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    PERF_FILTER = this.dataset.val;
    loadReports(1);
  });
});

// ============ DETAIL VIEW ============
async function viewReport(id) {
  const detail = document.getElementById('detailView');
  const listing = document.getElementById('listingView');
  listing.classList.add('hidden');
  detail.classList.add('active');
  detail.innerHTML = '<div class="loading">Loading report…</div>';
  document.getElementById('btnPrint').style.display = 'inline-block';
  window.scrollTo(0, 0);

  try {
    const json = await api(`/api/division/cvvrs/reports/${id}`);
    const { report, observations } = json.data;
    renderDetail(report, observations);
  } catch (err) {
    detail.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><div class="text">Error loading report: ${escapeHtml(err.message)}</div></div>`;
  }
}

function renderDetail(r, obs) {
  // Group observations by section
  const bySection = {};
  obs.forEach(o => {
    if (!bySection[o.section_id]) bySection[o.section_id] = { name: o.section_name, order: o.section_order, items: [] };
    bySection[o.section_id].items.push(o);
  });
  const sections = Object.values(bySection).sort((a,b) => a.order - b.order);

  const valChip = (val, options) => {
    if (!val) return '<span class="val-chip na">—</span>';
    // options[0] is the positive/expected answer
    const isPos = options && options[0] === val;
    return `<span class="val-chip ${isPos ? 'pos' : 'neg'}">${escapeHtml(val)}</span>`;
  };

  document.getElementById('detailView').innerHTML = `
    <div class="detail-header no-print">
      <button class="btn-back" onclick="backToList()">← Back to list</button>
      <h1>CVVRS Report #${r.report_id}</h1>
      <div class="detail-actions">
        <a class="btn-primary-gradient" href="/div/cvvrs.html?id=${r.report_id}">✎ Edit</a>
      </div>
    </div>

    <div class="detail-meta">
      <div class="field"><div class="label">Train Number</div><div class="val">${escapeHtml(r.train_number)}</div></div>
      <div class="field"><div class="label">Loco Number</div><div class="val">${escapeHtml(r.loco_number || '—')}</div></div>
      <div class="field"><div class="label">Event Date</div><div class="val">${formatDate(r.event_date)}</div></div>
      <div class="field"><div class="label">Analysis Date</div><div class="val">${formatDate(r.analysis_date)}</div></div>
      <div class="field"><div class="label">From</div><div class="val">${escapeHtml(r.from_station || '—')}</div></div>
      <div class="field"><div class="label">To</div><div class="val">${escapeHtml(r.to_station || '—')}</div></div>
      <div class="field"><div class="label">Departure</div><div class="val">${escapeHtml(r.departure_time || '—')}</div></div>
      <div class="field"><div class="label">Arrival</div><div class="val">${escapeHtml(r.arrival_time || '—')}</div></div>
      <div class="field"><div class="label">Crew HQ</div><div class="val">${escapeHtml(r.crew_hq || '—')}</div></div>
      <div class="field"><div class="label">Analyzing CLI</div><div class="val">${escapeHtml(r.cli_name)}</div></div>
      <div class="field"><div class="label">Loco Pilot</div><div class="val">${escapeHtml(r.lp_name)} ${perfBadge(r.lp_performance)}</div></div>
      <div class="field"><div class="label">Asst. Loco Pilot</div><div class="val">${escapeHtml(r.alp_name || '—')} ${r.alp_name ? perfBadge(r.alp_performance) : ''}</div></div>
      <div class="field"><div class="label">NCLI of LP</div><div class="val">${escapeHtml(r.ncli_lp_name || '—')}</div></div>
      <div class="field"><div class="label">NCLI of ALP</div><div class="val">${escapeHtml(r.ncli_alp_name || '—')}</div></div>
    </div>

    ${sections.map(s => `
      <div class="section-block">
        <div class="section-block-header"><h3>${escapeHtml(s.name)}</h3></div>
        <table class="obs-table-detail">
          <thead>
            <tr>
              <th style="width:45%;">Observation</th>
              <th style="width:17%;">Loco Pilot</th>
              <th style="width:17%;">Asst. Loco Pilot</th>
              <th>Remark</th>
            </tr>
          </thead>
          <tbody>
            ${s.items.map(it => `
              <tr>
                <td>${escapeHtml(it.item_text)}</td>
                <td>${it.applies_to === 'ALP' ? '<span class="val-chip na">N/A</span>' : valChip(it.lp_value, it.response_options)}</td>
                <td>${it.applies_to === 'LP' ? '<span class="val-chip na">N/A</span>' : valChip(it.alp_value, it.response_options)}</td>
                <td style="color:#64748b;">${escapeHtml(it.remark || '')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `).join('')}

    ${r.final_remark ? `
      <div class="card">
        <div class="card-header"><h2>Final Remark</h2></div>
        <div class="card-body" style="font-size:13px;color:#334155;white-space:pre-wrap;">${escapeHtml(r.final_remark)}</div>
      </div>
    ` : ''}
  `;
}

function backToList() {
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('detailView').innerHTML = '';
  document.getElementById('listingView').classList.remove('hidden');
  document.getElementById('btnPrint').style.display = 'none';
}

// ============ INIT ============
(function init() {
  // Default: last 30 days
  const today = new Date();
  const monthAgo = new Date(today.getTime() - 30 * 86400000);
  document.getElementById('fFrom').value = monthAgo.toISOString().split('T')[0];
  document.getElementById('fTo').value = today.toISOString().split('T')[0];
  applyFilters();
})();
</script>
</body>
</html>
