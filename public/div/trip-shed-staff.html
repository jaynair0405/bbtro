<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VVH Trip Shed staff</title><link rel="stylesheet" href="/div/css/trip-shed.css"><style>.staff-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.staff-toolbar label{min-width:230px;flex:1}.staff-toolbar .designation-filter{min-width:180px}.staff-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:18px 0}.staff-card{cursor:pointer;text-align:left}.staff-card.active{outline:3px solid #1677b8;background:#eef8ff}.staff-card b{font-size:25px;display:block;color:#1677b8}.staff-card span{font-size:12px;color:#68798a}.staff-table-wrap{overflow:auto}.staff-table td small{color:#68798a}.add-note{color:#68798a;font-size:12px;margin:0 0 12px}.modalbox{width:min(850px,100%)}</style></head><body><header class="top"><div class="brand"><b id="brand">VVH Trip Shed staff</b><small>View and add shed staff</small></div><span class="spacer"></span><a href="/div/trip-shed.html">← Trip Shed</a></header><main class="main"><div class="heading"><div><h1>VVH staff</h1><p id="subtitle">Loading staff register…</p></div><div class="controls"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="add">+ Add new staff</button></div></div><section class="card"><div class="staff-toolbar"><label>Search HRMS ID, name, PF number or mobile<input id="search" class="input" autocomplete="off" placeholder="e.g. KHTLDH, Shankar, 002298…"></label><label class="designation-filter">Designation<select id="designation" class="input"><option value="">All designations</option></select></label><button class="btn" id="clear">Clear</button></div><div id="cards" class="staff-cards"></div><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Name</th><th>HRMS ID</th><th>PF number</th><th>Mobile</th><th>Designation</th><th>Email</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section></main><div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle">Add VVH staff</h2><p class="add-note">HRMS ID, name, PF number and designation are required. Mobile number is optional.</p><form id="form" class="formgrid"><label>Staff name<input class="input" name="staff_name" required maxlength="160"></label><label>HRMS ID<input class="input" name="hrms_id" required maxlength="20"></label><label>PF number<input class="input" name="pf_number" required maxlength="20"></label><label>Mobile number<input class="input" name="mobile_number" maxlength="20" inputmode="tel"></label><label>Designation<input class="input" name="designation" required maxlength="60" list="designationOptions"></label><label>Email<input class="input" name="email" type="email" maxlength="160"></label><datalist id="designationOptions"></datalist><div class="foot wide"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary">Save staff</button></div><p id="formError" class="wide" role="alert"></p></form></div></div><script>
const API='/api/division/trip-shed',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search),shedCode=params.get('shed_code')||'';let activeDesignation='', editingId=null, staffRows=[];function scoped(path){return shedCode?path+(path.includes('?')?'&':'?')+'shed_code='+encodeURIComponent(shedCode):path}async function api(path,options){const url=API+scoped(path)+(scoped(path).includes('?')?'&':'?')+'_ts='+Date.now();const r=await fetch(url,{cache:'no-store',...(options||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(`${r.status}: ${d.error||d.message||'No error body'}`);return d}function renderCards(counts){$('#cards').innerHTML=counts.map(x=>`<button type="button" class="card staff-card ${activeDesignation===x.designation?'active':''}" data-designation="${esc(x.designation)}"><b>${x.count}</b><span>${esc(x.designation)}</span></button>`).join('')||'<div class="row">No active designations.</div>';document.querySelectorAll('.staff-card').forEach(x=>x.onclick=()=>{activeDesignation=activeDesignation===x.dataset.designation?'':x.dataset.designation;$('#designation').value=activeDesignation;load()})}function renderRows(rows){staffRows=rows;$('#rows').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.staff_name)}</b></td><td>${esc(x.hrms_id)}</td><td>${esc(x.pf_number)}</td><td>${esc(x.mobile_number||'—')}</td><td>${esc(x.designation||'—')}</td><td><small>${esc(x.email||'—')}</small></td><td><button type="button" class="btn edit-staff" data-id="${x.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="7">No matching active staff.</td></tr>';document.querySelectorAll('.edit-staff').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.id)))}async function load(){const q=$('#search').value.trim(), query=new URLSearchParams();if(q)query.set('q',q);if(activeDesignation)query.set('designation',activeDesignation);const d=await api('/staff?'+query.toString());$('#subtitle').textContent=`${d.rows.length} shown · active staff register`;renderCards(d.counts);renderRows(d.rows);$('#designationOptions').innerHTML=d.counts.map(x=>`<option value="${esc(x.designation)}">${esc(x.designation)}</option>`).join('')}let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,220)};$('#designation').onchange=()=>{activeDesignation=$('#designation').value;load()};$('#clear').onclick=()=>{$('#search').value='';activeDesignation='';$('#designation').value='';load()};$('#refresh').onclick=load;function openAdd(){editingId=null;$('#modalTitle').textContent='Add VVH staff';$('#form').reset();$('#formError').textContent='';$('#modal').classList.add('show')}function openEdit(id){const x=staffRows.find(r=>Number(r.id)===id);if(!x)return;editingId=id;$('#modalTitle').textContent='Edit VVH staff';for(const k of ['staff_name','hrms_id','pf_number','mobile_number','designation','email']){const el=$('#form').elements.namedItem(k);el.value=x[k]||''}$('#formError').textContent='';$('#modal').classList.add('show')}$('#add').onclick=openAdd;$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#form').onsubmit=async e=>{e.preventDefault();$('#formError').textContent='';try{await api(editingId?'/staff/'+editingId:'/staff',{method:editingId?'PATCH':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#modal').classList.remove('show');await load()}catch(err){$('#formError').textContent=err.message}};load().catch(e=>{$('#subtitle').textContent=e.message;$('#rows').innerHTML='<tr><td colspan="7">Could not load staff register.</td></tr>'});
</script></body></html>
