<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train Index — BB Division Crew Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14;--bg2:#0e1219;--panel:#141922;--panel2:#1a2029;--line:#232b37;--line2:#2c3745;
  --ink:#e8edf4;--ink2:#aeb9c8;--ink3:#6b7686;--amber:#f4a533;
  --single:#5aa9e6;--double:#f4a533;--triple:#e56a86;--cont:#4fd1a5;--fix:#b98cff;--memu:#57b6ff;
  --fast:#e56a86;--semi:#f4a533;--slow:#5aa9e6;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75);
  --mono:'Space Mono',ui-monospace,monospace;--disp:'Bricolage Grotesque',sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(1200px 640px at 82% -12%,rgba(244,165,51,.09),transparent 60%),radial-gradient(900px 700px at 2% 112%,rgba(87,182,255,.06),transparent 55%);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.11;mask-image:radial-gradient(circle at 60% 30%,#000 22%,transparent 80%);}
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 330px 1fr;height:100vh}

/* app shell sidebar */
.side{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .kick{font:700 9px/1 var(--mono);letter-spacing:.3em;color:var(--amber);text-transform:uppercase}
.brand h1{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.02em;margin-top:8px}
.brand h1 em{font-style:normal;color:var(--amber)}
.nav{flex:1;overflow-y:auto;padding:14px 10px}
.ngroup{font:700 9px var(--mono);letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;margin:16px 10px 6px}
.item{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;margin:2px 0;border-radius:11px;cursor:pointer;color:var(--ink2);text-decoration:none;transition:.16s}
.item:hover{background:var(--panel);color:var(--ink)}
.item.on{background:linear-gradient(90deg,rgba(244,165,51,.15),rgba(244,165,51,.02));color:var(--ink)}
.item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--amber)}
.item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}.item.on svg{stroke:var(--amber)}
.item b{flex:1;font-size:13.5px;font-weight:600}.item .b{font:700 9px var(--mono);color:var(--ink3);padding:2px 6px;border:1px solid var(--line2);border-radius:20px}

/* ---------- search column ---------- */
.pick{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.pickhead{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.pickhead h2{font-family:var(--disp);font-weight:700;font-size:20px}
.pickhead .pd{font-size:12px;color:var(--ink3);margin-top:3px}

/* mode toggle */
.seg{display:flex;margin-top:14px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:3px}
.seg button{flex:1;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);background:none;border:0;padding:8px 6px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button.on{background:linear-gradient(180deg,rgba(244,165,51,.2),rgba(244,165,51,.08));color:var(--amber)}
.seg button:not(.on):hover{color:var(--ink)}

/* search box */
.sbox{position:relative;margin-top:12px}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2}
.sbox input{width:100%;font:700 14px var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:11px 12px 11px 36px;outline:none;transition:.16s}
.sbox input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(244,165,51,.1)}
.sbox input::placeholder{color:var(--ink3);font-weight:400;letter-spacing:0}

.filts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.filts select{font:600 10.5px var(--mono);color:var(--ink2);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;cursor:pointer;outline:none}
.filts select:focus{border-color:var(--amber)}
.chk{display:flex;align-items:center;gap:6px;font:600 10.5px var(--mono);letter-spacing:.04em;color:var(--ink3);cursor:pointer;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;user-select:none;transition:.15s}
.chk.on{border-color:var(--amber);color:var(--amber);background:rgba(244,165,51,.08)}

.cnt{padding:9px 18px;font:700 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.cnt b{color:var(--amber)}
.list{flex:1;overflow-y:auto;padding:8px 10px 30px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.row{display:flex;align-items:center;gap:9px;padding:9px 11px;margin:2px 0;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.14s}
.row:hover{background:var(--panel)}
.row.on{background:var(--panel);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--amber)}
.row .rn{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.01em;min-width:66px}
.row .rm{flex:1;min-width:0;font:400 10.5px/1.35 var(--body);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rc{font:700 10px var(--mono);color:var(--ink3);padding:2px 6px;border:1px solid var(--line2);border-radius:20px;flex:none}
.row .rc.multi{color:var(--amber);border-color:rgba(244,165,51,.4)}
.empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.6}

/* ---------- main ---------- */
.body{overflow-y:auto}
.body::-webkit-scrollbar{width:10px}.body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px}
.thead{position:sticky;top:0;z-index:6;backdrop-filter:blur(14px);background:rgba(11,14,20,.85);border-bottom:1px solid var(--line);padding:22px 32px 18px}
.crumbs{display:flex;align-items:center;gap:9px;font:600 11.5px var(--mono);color:var(--ink3);letter-spacing:.05em}
.crumbs .cur{color:var(--amber)}
.thead h3{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.025em;margin-top:9px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.route{display:flex;align-items:center;gap:10px;margin-top:11px;font:700 13px var(--mono);color:var(--ink2)}
.route .ar{color:var(--line2)}
.route .un{color:var(--ink3);font-weight:400;font-family:var(--body);font-size:12.5px}
.tags{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.pill{font:700 9px var(--mono);letter-spacing:.08em;padding:4px 9px;border-radius:20px;text-transform:uppercase}
.pill.FAST{background:rgba(229,106,134,.14);color:var(--fast)}
.pill.SEMI_FAST{background:rgba(244,165,51,.14);color:var(--semi)}
.pill.SLOW{background:rgba(90,169,230,.14);color:var(--slow)}
.pill.EMPTY_RAKE{background:rgba(107,118,134,.16);color:var(--ink3)}
.pill.AC{background:rgba(87,182,255,.14);color:var(--memu)}
.pill.car{background:rgba(232,237,244,.07);color:var(--ink2)}
.pill.lg{background:rgba(79,209,165,.11);color:var(--cont)}
.pill.dir{background:rgba(244,165,51,.12);color:var(--amber)}
.pill.single{background:rgba(90,169,230,.13);color:var(--single)}
.pill.double{background:rgba(244,165,51,.13);color:var(--double)}
.pill.triple{background:rgba(229,106,134,.13);color:var(--triple)}
.pill.continuous{background:rgba(79,209,165,.13);color:var(--cont)}
.pill.fix{background:rgba(185,140,255,.13);color:var(--fix)}
.pill.memu{background:rgba(87,182,255,.13);color:var(--memu)}
.pill.unm{background:rgba(107,118,134,.14);color:var(--ink3)}

.sect{padding:24px 32px 0}
.sect h4{font:700 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:11px;margin-bottom:14px}
.sect h4::after{content:"";flex:1;height:1px;background:var(--line)}
.sect h4 .n{color:var(--amber)}

/* the binding cards: which details work this train */
.cards{display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);transition:.16s}
.card:hover{border-color:var(--line2)}
.chead{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.chead .dnum{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;min-width:58px}
.chead .dmeta{flex:1;min-width:0}
.chead .dmeta .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chead .dmeta .r2{font:400 11.5px var(--body);color:var(--ink3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .sig{text-align:right;font-family:var(--mono);flex:none}
.chead .sig b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.chead .sig span{font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.chead .caret{width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2.2;transition:transform .18s;flex:none}
.card.open .caret{transform:rotate(180deg)}

/* the leg strip — this train's leg(s) inside that detail */
.legs{padding:4px 0}
.leg{display:grid;grid-template-columns:14px 1fr;gap:13px;padding:11px 18px;align-items:start}
.leg .rail{position:relative;height:100%;display:flex;justify-content:center;padding-top:5px}
.leg .rail .d{width:9px;height:9px;border-radius:50%;background:var(--line2);border:2px solid var(--bg2);z-index:1}
.leg.hit .rail .d{background:var(--amber);box-shadow:0 0 0 4px rgba(244,165,51,.16)}
.leg .rail::before{content:"";position:absolute;top:0;bottom:-11px;width:2px;background:var(--line);left:50%;transform:translateX(-50%)}
.leg:last-child .rail::before{display:none}
.leg .lc{min-width:0}
.leg .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.leg .tno{font-family:var(--mono);font-weight:700;font-size:13.5px;color:var(--ink2)}
.leg.hit .tno{color:var(--amber)}
.leg .path{font:600 12.5px var(--body);color:var(--ink3)}
.leg .path b{color:var(--ink2);font-weight:600}
.leg .tm{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.leg .tag{font:700 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.leg .tag.piloting{background:rgba(185,140,255,.14);color:var(--fix)}
.leg .tag.rt,.leg .tag.rb{cursor:pointer;border:1px solid transparent}
.leg .tag.rt{background:rgba(79,209,165,.14);color:var(--cont)}
.leg .tag.rb{background:rgba(244,165,51,.14);color:var(--amber)}
.leg .tag.rt:hover,.leg .tag.rb:hover{border-color:currentColor}
.leg .tag.waiting{background:rgba(107,118,134,.16);color:var(--ink3)}
.legs .more{padding:9px 18px 13px 45px;font:600 11px var(--mono);color:var(--ink3);cursor:pointer}
.legs .more:hover{color:var(--amber)}

/* placeholder */
.ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink3);text-align:center;padding:40px}
.ph svg{width:54px;height:54px;stroke:var(--line2);fill:none;stroke-width:1.4}
.ph h3{font-family:var(--disp);font-weight:700;font-size:23px;color:var(--ink2)}
.ph p{font-size:13px;max-width:400px;line-height:1.65}
.ph .hint{font:600 11px var(--mono);color:var(--ink3);margin-top:4px}
.ph .hint b{color:var(--amber)}
</style>
</head>

  </aside>

  <main class="body" id="main"></main>
</div>

<script>
/* ---------- indexes ---------- */
const byTrain = new Map();          // normalized train no -> legs
const byDetail = new Map();         // detail_id -> legs
for (const l of TLEGS) {
  if (!byTrain.has(l.t)) byTrain.set(l.t, []);
  byTrain.get(l.t).push(l);
  if (!byDetail.has(l.did)) byDetail.set(l.did, []);
  byDetail.get(l.did).push(l);
}
for (const legs of byDetail.values()) legs.sort((a, b) => (a.st || '').localeCompare(b.st || ''));

const trainOf = new Map(TRAINS.map(t => [t.t, t]));
const didByNum = {};
for (const [did, d] of Object.entries(TDET)) didByNum[d.num] = did;

const DETAILS = Object.entries(TDET)
  .map(([did, d]) => ({ did, ...d }))
  .sort((a, b) => (+a.num || 0) - (+b.num || 0));

const OFFNAME = { 'CSMT-SUB': 'CSMT', 'KYN-SUB': 'KYN', 'PNVL-SUB': 'PNVL' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- state ---------- */
let mode = 'train';           // 'train' | 'detail'
let sel = null;               // selected key (norm train no, or detail_id)
const F = { svc: '', lg: '', dir: '', off: '', multi: false };

/* ---------- filter bar ---------- */
const FILTS = {
  train: `
    <select id="f-svc"><option value="">Service · all</option><option>FAST</option><option>SEMI_FAST</option><option>SLOW</option><option>EMPTY_RAKE</option></select>
    <select id="f-lg"><option value="">Line · all</option><option>MAIN</option><option>HARBOUR</option><option>TRANS_HARBOUR</option><option>SE</option><option>NE</option><option>PORT</option><option>OTHER</option></select>
    <select id="f-dir"><option value="">Dir · all</option><option>UP</option><option>DN</option></select>
    <div class="chk" id="f-multi">Multi-detail only</div>`,
  detail: `
    <select id="f-off"><option value="">Office · all</option><option value="CSMT-SUB">CSMT</option><option value="KYN-SUB">KYN</option><option value="PNVL-SUB">PNVL</option></select>
    <select id="f-lg"><option value="">Line · all</option><option value="mainline">Mainline</option><option value="harbour">Harbour</option></select>
    <select id="f-svc"><option value="">Link · all</option><option value="continuous">Continuous</option><option value="fix">Fix</option><option value="memu">MEMU</option></select>`,
};

function paintFilts() {
  document.getElementById('filts').innerHTML = FILTS[mode];
  document.getElementById('q').placeholder = mode === 'train' ? 'Train no. — e.g. PL128, B75, K35' : 'Detail no. — e.g. 466, 201, 675';
  for (const [id, key] of [['f-svc', 'svc'], ['f-lg', 'lg'], ['f-dir', 'dir'], ['f-off', 'off']]) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = F[key];
    el.onchange = () => { F[key] = el.value; paintList(); };
  }
  const m = document.getElementById('f-multi');
  if (m) {
    m.classList.toggle('on', F.multi);
    m.onclick = () => { F.multi = !F.multi; m.classList.toggle('on', F.multi); paintList(); };
  }
}

/* ---------- list ---------- */
const CAP = 300;   // render cap; search narrows below it

function matches(q, ...fields) {
  if (!q) return true;
  return fields.some(f => f && String(f).toUpperCase().includes(q));
}

function filtered() {
  const q = document.getElementById('q').value.trim().toUpperCase().replace(/\s+/g, '');
  if (mode === 'train') {
    return TRAINS.filter(t =>
      matches(q, t.t, t.disp) &&
      (!F.svc || t.svc === F.svc) &&
      (!F.lg || t.lg === F.lg) &&
      (!F.dir || t.dir === F.dir) &&
      (!F.multi || t.ds.length > 1));
  }
  return DETAILS.filter(d =>
    matches(q, d.num, d.did) &&
    (!F.off || d.off === F.off) &&
    (!F.lg || d.ln === F.lg) &&
    (!F.svc || d.lk === F.svc));
}

function paintList() {
  const rows = filtered();
  const shown = rows.slice(0, CAP);
  document.getElementById('cnt').innerHTML = rows.length
    ? `<b>${rows.length}</b> ${mode === 'train' ? 'trains' : 'details'}` +
      (rows.length > CAP ? ` &nbsp;·&nbsp; showing first ${CAP}` : '')
    : 'no match';

  const list = document.getElementById('list');
  if (!rows.length) {
    list.innerHTML = `<div class="empty">Nothing matches that.<br>Try a shorter number — the index is on the working number, so <b>P/</b> prefixes are stripped.</div>`;
    return;
  }

  list.innerHTML = shown.map(r => mode === 'train' ? trainRow(r) : detailRow(r)).join('');
  list.querySelectorAll('.row').forEach(el => {
    el.onclick = () => { sel = el.dataset.k; location.hash = (mode === 'train' ? 't=' : 'd=') + sel; paint(); };
  });
}

function trainRow(t) {
  const n = t.ds.length;
  const sub = t.mm
    ? `${t.f || '?'} → ${t.to || '?'}${t.dir ? ' · ' + t.dir : ''}`
    : 'not in train master';
  return `<div class="row ${sel === t.t ? 'on' : ''}" data-k="${esc(t.t)}">
    <div class="rn">${esc(t.disp || t.t)}</div>
    <div class="rm">${esc(sub)}</div>
    <div class="rc ${n > 1 ? 'multi' : ''}">${n}</div>
  </div>`;
}

function detailRow(d) {
  const legs = byDetail.get(d.did) || [];
  return `<div class="row ${sel === d.did ? 'on' : ''}" data-k="${esc(d.did)}">
    <div class="rn">${esc(d.num)}</div>
    <div class="rm">${esc(OFFNAME[d.off] || '—')} · ${esc(d.ln || '')} · ${esc(d.son || '')}–${esc(d.soff || '')}</div>
    <div class="rc">${legs.length}</div>
  </div>`;
}

/* ---------- main panel ---------- */
function paint() {
  paintList();
  const main = document.getElementById('main');
  if (!sel) { main.innerHTML = placeholder(); return; }
  main.innerHTML = mode === 'train' ? trainPanel(sel) : detailPanel(sel);
  main.scrollTop = 0;
  main.querySelectorAll('.chead').forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle('open');
  });
  main.querySelectorAll('[data-goto]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const [m, k] = el.dataset.goto.split(':');
      setMode(m);
      sel = k;
      location.hash = (m === 'train' ? 't=' : 'd=') + k;
      paint();
    };
  });
}

function placeholder() {
  return `<div class="ph">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6M11 8v6"/></svg>
    <h3>Search a train, or a detail</h3>
    <p><b>By Train</b> answers “who works this train?” — <b>548</b> of the 1,861 working numbers are shared by more than one detail, so this is the lookup the detail book can't give you.</p>
    <p><b>By Detail</b> answers the other direction — every train that detail works, in sign-on order.</p>
    <div class="hint">try <b>PL128</b> — worked by 466, 491, 550 and 352</div>
  </div>`;
}

function trainPanel(k) {
  const t = trainOf.get(k);
  const legs = (byTrain.get(k) || []).slice();
  // group legs by the detail that works them
  const groups = new Map();
  for (const l of legs) {
    if (!groups.has(l.did)) groups.set(l.did, []);
    groups.get(l.did).push(l);
  }
  const ordered = [...groups.entries()].sort((a, b) => (+TDET[a[0]].num || 0) - (+TDET[b[0]].num || 0));

  const tags = [];
  if (t.svc) tags.push(`<span class="pill ${t.svc}">${t.svc.replace('_', '-')}</span>`);
  else tags.push(`<span class="pill unm">not in train master</span>`);
  if (t.car) tags.push(`<span class="pill car">${t.car}-car</span>`);
  if (t.ac === 'AC') tags.push(`<span class="pill AC">AC</span>`);
  if (t.lg) tags.push(`<span class="pill lg">${t.lg.replace('_', '-')}</span>`);
  if (t.dir) tags.push(`<span class="pill dir">${t.dir}</span>`);

  const route = t.mm
    ? `<span>${esc(t.f || '?')}</span><span class="ar">→</span><span>${esc(t.to || '?')}</span>`
    : `<span class="un">No master route — this number isn't in suburban_train_master.</span>`;

  return `
  <div class="thead">
    <div class="crumbs">Crew Ops<span>/</span>Train Index<span>/</span><span class="cur">${esc(t.disp || t.t)}</span></div>
    <h3>${esc(t.disp || t.t)}</h3>
    <div class="route">${route}</div>
    <div class="tags">${tags.join('')}</div>
  </div>
  <div class="sect">
    <h4>Worked by <span class="n">${ordered.length}</span> detail${ordered.length === 1 ? '' : 's'}
      ${t.w ? `· ${t.w} working` : ''} ${t.p ? `· ${t.p} piloting` : ''}</h4>
    <div class="cards">
      ${ordered.map(([did, ls]) => bindingCard(did, ls, k)).join('')}
    </div>
  </div>`;
}

/* one card = one detail that works this train, with that detail's full leg run
   so you can see where this train sits inside the duty */
function bindingCard(did, hits, hiTrain) {
  const d = TDET[did];
  const all = byDetail.get(did) || [];
  const hitIds = new Set(hits.map(h => h.t + '|' + h.st));

  return `<div class="card open">
    <div class="chead">
      <div class="dnum">${esc(d.num)}</div>
      <div class="dmeta">
        <div class="r1">
          <span class="pill lg">${esc(OFFNAME[d.off] || 'DEPT')}</span>
          ${d.dt ? `<span class="pill ${d.dt}">${d.dt}</span>` : ''}
          ${d.lk ? `<span class="pill ${d.lk}">${d.lk}</span>` : ''}
          <span class="pill car">${esc(d.ln || '')}</span>
        </div>
        <div class="r2">Signs on ${esc(d.sonp || '?')} ${esc(d.son || '')} · signs off ${esc(d.soffp || '?')} ${esc(d.soff || '')} · ${all.length} legs</div>
      </div>
      <div class="sig"><b data-goto="detail:${esc(did)}" style="cursor:pointer;color:var(--amber)">open detail →</b><span>${esc(did)}</span></div>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="legs">${all.map(l => legRow(l, hitIds.has(l.t + '|' + l.st))).join('')}</div>
  </div>`;
}

/* R/T = this detail gives relief to that one (at the start station);
   R/B = that one relieves this detail (at the end station). */
function reliefTag(kind, num) {
  if (!num) return '';
  const did = didByNum[num];
  const label = (kind === 'rt' ? 'R/T ' : 'R/B ') + num;
  const go = did ? ` data-goto="detail:${esc(did)}"` : '';
  return `<span class="tag ${kind}"${go} title="${kind === 'rt' ? 'gives relief to' : 'relieved by'} detail ${esc(num)}">${esc(label)}</span>`;
}

function legRow(l, hit) {
  const t = trainOf.get(l.t);
  const svc = t && t.svc && t.svc !== 'SLOW' ? `<span class="tag ${t.svc}">${t.svc.replace('_', '-')}</span>` : '';
  return `<div class="leg ${hit ? 'hit' : ''}">
    <div class="rail"><div class="d"></div></div>
    <div class="lc"><div class="l1">
      <span class="tno" ${hit ? '' : `data-goto="train:${esc(l.t)}" style="cursor:pointer"`}>${esc(l.tn || l.t)}</span>
      ${l.ty !== 'working' ? `<span class="tag ${l.ty}">${l.ty}</span>` : ''}
      ${svc}
      <span class="path"><b>${esc(l.ss || '?')}</b> → <b>${esc(l.es || '?')}</b></span>
      ${reliefTag('rt', l.rt)}${reliefTag('rb', l.rb)}
      ${l.rmk ? `<span class="tag waiting">${esc(l.rmk)}</span>` : ''}
      <span class="tm">${esc(l.st || '')} – ${esc(l.et || '')}</span>
    </div></div>
  </div>`;
}

function detailPanel(did) {
  const d = TDET[did];
  const legs = byDetail.get(did) || [];
  const work = legs.filter(l => l.ty === 'working').length;
  const pil = legs.filter(l => l.ty === 'piloting').length;
  // trains of this detail that are also worked elsewhere
  const shared = legs.filter(l => (trainOf.get(l.t)?.ds.length || 0) > 1).length;

  return `
  <div class="thead">
    <div class="crumbs">Crew Ops<span>/</span>Train Index<span>/</span>By Detail<span>/</span><span class="cur">${esc(d.num)}</span></div>
    <h3>Detail ${esc(d.num)}
      <span class="pill lg">${esc(OFFNAME[d.off] || 'DEPT')}</span>
      ${d.dt ? `<span class="pill ${d.dt}">${d.dt}</span>` : ''}
      ${d.lk ? `<span class="pill ${d.lk}">${d.lk}</span>` : ''}
    </h3>
    <div class="route">
      <span>${esc(d.sonp || '?')} ${esc(d.son || '')}</span><span class="ar">→</span><span>${esc(d.soffp || '?')} ${esc(d.soff || '')}</span>
      <span class="un">&nbsp;·&nbsp; ${esc(d.ln || '')} &nbsp;·&nbsp; ${esc(did)}</span>
    </div>
    <div class="tags">
      <span class="pill car">${legs.length} legs</span>
      <span class="pill SLOW">${work} working</span>
      ${pil ? `<span class="pill fix">${pil} piloting</span>` : ''}
      ${shared ? `<span class="pill dir">${shared} shared with other details</span>` : ''}
    </div>
  </div>
  <div class="sect">
    <h4>Trains worked <span class="n">${legs.length}</span></h4>
    <div class="cards"><div class="card open"><div class="legs">
      ${legs.map(l => legRow(l, false)).join('')}
    </div></div></div>
  </div>`;
}

/* ---------- wiring ---------- */
function setMode(m) {
  if (mode === m) return;
  mode = m;
  document.getElementById('mT').classList.toggle('on', m === 'train');
  document.getElementById('mD').classList.toggle('on', m === 'detail');
  F.svc = F.lg = F.dir = F.off = ''; F.multi = false;
  document.getElementById('q').value = '';
  paintFilts();
}

document.getElementById('mT').onclick = () => { setMode('train'); sel = null; paint(); };
document.getElementById('mD').onclick = () => { setMode('detail'); sel = null; paint(); };
document.getElementById('q').oninput = () => paintList();

function fromHash() {
  const h = location.hash.slice(1);
  const m = h.match(/^([td])=(.+)$/);
  if (!m) return false;
  setMode(m[1] === 't' ? 'train' : 'detail');
  sel = decodeURIComponent(m[2]);
  return true;
}
addEventListener('hashchange', () => { if (fromHash()) paint(); });

paintFilts();
fromHash();
paint();
</script>
</body>
</html>
