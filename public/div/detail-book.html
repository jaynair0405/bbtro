<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR CC | Digital Detail Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/slate-theme.css">
    <style>
        /* Page-specific layout */
        .main-container {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>JR CC DETAIL BOOK</h1>
        <div id="headerInfo" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Duty Shift: 08:00 x 16:00 | Date: --</div>
    </div>

    <div class="main-container">

        <div class="panel">
            <div class="panel-header">Log Arrival & Assign Rest</div>
            <div class="form-content">

                <div class="section-label" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>1. Active/Returning Crews (Click to Fill)</span>
                    <button type="button" id="manualEntryBtn" onclick="enableManualEntry()" style="background: var(--bg-input); border: 1px dashed var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">+ Manual Entry</button>
                </div>
                <div class="active-crews-scroll">
                    <!-- Cards loaded dynamically from API -->
                </div>

                <hr style="border-color: var(--border); margin: 15px 0;">

                <div class="section-label">2. Verify & Process Sign-Off</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Incoming Detail</label>
                        <input type="text" id="incomingTrain" placeholder="Train No.">
                    </div>
                    <div class="form-group">
                        <label>Loco No.</label>
                        <input type="text" id="incomingLoco" placeholder="Loco No. (if any)">
                    </div>
                </div>
                <div class="form-row" style="margin-top: -5px;">
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                            <input type="checkbox" id="isPilot" onchange="togglePilotStation()" style="width: 16px; height: 16px; cursor: pointer;">
                            <span>Pilot</span>
                        </label>
                        <div id="pilotStationGroup" style="display: none; align-items: center; gap: 6px;">
                            <span style="color: var(--text-muted); font-size: 0.8rem;">Ex Stn:</span>
                            <select id="pilotStation" style="padding: 6px 10px; min-width: 100px;">
                                <option value="">-- Select --</option>
                                <option value="KYN">KYN</option>
                                <option value="LNL">LNL</option>
                                <option value="PNVL">PNVL</option>
                                <option value="IGP">IGP</option>
                                <option value="CLA">CLA</option>
                                <option value="NRL">NRL</option>
                                <option value="CSMT">CSMT</option>
                                <option value="DR">DR</option>
                                <option value="TNA">TNA</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row" id="dutyTimeRow">
                    <div class="form-group">
                        <label>Sign-On (Prev)</label>
                        <input type="time" id="signOn">
                    </div>
                    <div class="form-group">
                        <label style="color:var(--accent);">Sign-Off (Current)</label>
                        <input type="time" id="signOff" onchange="isManualMode ? calculateSlotsManual() : calculateSlots()">
                    </div>
                </div>
                <div class="form-row" id="offReasonRow" style="display:none;">
                    <div class="form-group">
                        <label>Previous Status</label>
                        <select id="offReason" onchange="calculateSlotsManual()">
                            <option value="off/rest">Off / Rest</option>
                            <option value="off/leave">Off / Leave</option>
                            <option value="off/trg">Off / Training</option>
                            <option value="off/pme">Off / PME</option>
                            <option value="off/other">Off / Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="color:var(--text-muted);">Based on current time</label>
                        <input type="text" id="currentTimeDisplay" disabled style="color:var(--accent); font-family: 'JetBrains Mono';">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 10px;">
                    <label>Loco Pilot (LP)</label>
                    <select id="lpSelect" onchange="checkStaffStatus()">
                        <option value="none">-- Select LP --</option>
                    </select>
                </div>
                <div id="lpAlert" class="alert"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Rest Rule (LP)</label>
                        <select id="lpRest" onchange="isManualMode ? calculateSlotsManual() : calculateSlots()">
                            <option value="16">Normal Rest (Min. 16hr)</option>
                            <option value="30">PR (Min. 30hr) / 1-Day Leave</option>
                            <option value="suspend">Multi-Day Leave</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Next Slot (LP) <span id="lpSlotDateLabel" style="margin-left: 8px; font-weight: 700; font-size: 0.7rem;"></span></label>
                        <div style="display: flex; gap: 6px;">
                            <select id="lpSlotDate" style="width: 100px; padding: 10px 6px;" onchange="handleDateSelect('lp')">
                                <!-- Options populated dynamically -->
                            </select>
                            <input type="date" id="lpDatePicker" style="display: none; width: 100px; padding: 10px 6px;" onchange="applyPickedDate('lp')">
                            <input type="time" id="lpNextSlot" style="color: var(--accent); font-weight: bold; flex: 1;">
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 5px;">
                    <label>Asst. Loco Pilot (ALP)</label>
                    <select id="alpSelect">
                        <option value="none">[ No ALP / Single Man ]</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Rest Rule (ALP)</label>
                        <select id="alpRest" onchange="isManualMode ? calculateSlotsManual() : calculateSlots()">
                            <option value="16">Normal Rest (Min. 16hr)</option>
                            <option value="30">PR (Min. 30hr) / 1-Day Leave</option>
                            <option value="suspend">Multi-Day Leave</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Next Slot (ALP) <span id="alpSlotDateLabel" style="margin-left: 8px; font-weight: 700; font-size: 0.7rem;"></span></label>
                        <div style="display: flex; gap: 6px;">
                            <select id="alpSlotDate" style="width: 100px; padding: 10px 6px;" onchange="handleDateSelect('alp')">
                                <!-- Options populated dynamically -->
                            </select>
                            <input type="date" id="alpDatePicker" style="display: none; width: 100px; padding: 10px 6px;" onchange="applyPickedDate('alp')">
                            <input type="time" id="alpNextSlot" style="color: var(--accent); font-weight: bold; flex: 1;">
                        </div>
                    </div>
                </div>

                <button class="btn-submit" onclick="submitToSlate()">Save Arrival & Update Forecast</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>Availability Forecast</span>
                <span id="vacantSummary" style="color: #fcd34d; font-size: 0.75rem;">LP: 12 | ALP: 14 vacant</span>
            </div>
            <div class="forecast-container">
                <div class="forecast-nav">
                    <button class="nav-btn" id="navPrev" onclick="scrollForecast(-1)" title="Previous (←)">‹</button>
                    <div class="date-tabs" id="dateTabs">
                        <!-- Date tabs will be generated dynamically -->
                    </div>
                    <button class="nav-btn" id="navNext" onclick="scrollForecast(1)" title="Next (→)">›</button>
                </div>
                <div class="forecast-scroll" id="forecastScroll" tabindex="0">
                    <!-- Date groups will be generated dynamically -->
                </div>
            </div>
        </div>

    </div>

    <!-- Collision Dialog Modal -->
    <div id="collisionModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0 0 15px 0; color: var(--warning); font-size: 1.1rem;">⚠️ Slot Collision Detected</h3>
            <div id="collisionMessage" style="margin-bottom: 20px; font-size: 0.9rem; line-height: 1.5;"></div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button id="btnAddHere" onclick="resolveCollision('adhoc')" style="flex: 1; padding: 12px; background: var(--warning); color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">
                    Add Here (Adhoc)
                </button>
                <button id="btnNextSlot" onclick="resolveCollision('next')" style="flex: 1; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">
                    Next Slot
                </button>
                <button onclick="resolveCollision('cancel')" style="flex: 1; padding: 12px; background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; font-weight: 600; cursor: pointer;">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Load shared utilities first, then page-specific code -->
    <script src="js/slate-common.js"></script>
    <script src="js/detail-book.js"></script>
</body>
</html>
